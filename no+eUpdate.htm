<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RapLom の最新記事 | note</title>
<style>
  :root {
    --bg: #f7f8f5;
    --surface: #ffffff;
    --text: #1d2420;
    --muted: #66706a;
    --line: #dde2dc;
    --accent: #1f6f5c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151a17;
      --surface: #1d2420;
      --text: #e8ece8;
      --muted: #9aa59e;
      --line: #2e3833;
      --accent: #6fcdb3;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", Meiryo, sans-serif;
    line-height: 1.7;
  }
  main {
    max-width: 680px;
    margin: 0 auto;
    padding: 48px 20px 64px;
  }
  h1 {
    font-size: 1.5rem;
    margin: 0 0 4px;
    letter-spacing: .02em;
  }
  .sub { color: var(--muted); font-size: 1.2rem; margin: 0 0 28px; }
  .sub a { color: var(--accent); }
  ol { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  li { border-bottom: 1px solid var(--line); }
  li a {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 16px 4px;
    color: inherit;
    text-decoration: none;
  }
  .thumb {
    flex: none;
    width: 96px;
    height: 64px;
    object-fit: cover;
    border-radius: 4px;
    background: var(--line);
  }
  .text { min-width: 0; }
  li a:hover .title, li a:focus-visible .title { color: var(--accent); text-decoration: underline; }
  li a:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .date { display: block; color: var(--muted); font-size: 1.2rem; }
  .title { display: block; font-size: 1.3rem; font-weight: 600; margin-top: 2px; }
  .status { color: var(--muted); padding: 24px 4px; }
  .status.error { color: #b3261e; }
  @media (prefers-color-scheme: dark) { .status.error { color: #ff8a80; } }
</style>
</head>
<body style="background-color: #FBF4E6">
<main>
  <h1>最新記事</h1>
  <p class="sub"><a id="profile" href="https://note.com/RapLom" target="_blank" rel="noopener">note で全ての記事を見る</a></p>
  <ol id="list" aria-live="polite"></ol>
  <p id="status" class="status">読み込み中です…</p>
</main>

<script>
(function () {
  var NOTE_ID = "RapLom";
  var COUNT = 10;
  var RSS_URL = "https://note.com/" + NOTE_ID + "/rss";
  var API_URL = "https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent(RSS_URL);
  var RAW_URL = "https://api.allorigins.win/raw?url=" + encodeURIComponent(RSS_URL);

  var list = document.getElementById("list");
  var status = document.getElementById("status");
  var slots = []; // { key, a, text, hasImg }

  function norm(url) { return (url || "").split("?")[0].replace(/\/$/, ""); }

  function formatDate(str) {
    var d = new Date(str.replace(" ", "T") + "Z");
    if (isNaN(d)) return str;
    return d.toLocaleDateString("ja-JP", {
      year: "numeric", month: "long", day: "numeric", timeZone: "Asia/Tokyo"
    });
  }

  function findImage(item) {
    if (item.thumbnail) return item.thumbnail;
    if (item.enclosure && item.enclosure.link) return item.enclosure.link;
    var html = (item.content || "") + (item.description || "");
    var m = html.match(/<img[^>]+src=["']([^"']+)["']/i);
    return m ? m[1] : "";
  }

  function addImage(slot, url) {
    if (!url || slot.hasImg) return;
    var img = document.createElement("img");
    img.className = "thumb";
    img.alt = "";
    img.loading = "lazy";
    img.addEventListener("error", function () { img.remove(); slot.hasImg = false; });
    img.src = url;
    slot.a.insertBefore(img, slot.text);
    slot.hasImg = true;
  }

  // RSS の XML を直接読み、<media:thumbnail> から画像を補う
  function fillFromXml() {
    return fetch(RAW_URL)
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
      .then(function (xmlText) {
        var doc = new DOMParser().parseFromString(xmlText, "text/xml");
        var nodes = doc.getElementsByTagName("item");
        var map = {};
        for (var i = 0; i < nodes.length; i++) {
          var link = nodes[i].getElementsByTagName("link")[0];
          var th = nodes[i].getElementsByTagNameNS("*", "thumbnail")[0];
          var url = th ? (th.textContent || th.getAttribute("url") || "").trim() : "";
          if (link && url) map[norm(link.textContent.trim())] = url;
        }
        slots.forEach(function (s) { addImage(s, map[s.key]); });
      })
      .catch(function (e) { console.warn("thumbnail fallback failed", e); });
  }

  fetch(API_URL)
    .then(function (res) {
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    })
    .then(function (data) {
      if (data.status !== "ok" || !data.items) throw new Error("feed error");
      var items = data.items.slice(0, COUNT);
      if (items.length === 0) {
        status.textContent = "表示できる記事がまだありません。";
        return;
      }
      items.forEach(function (item) {
        var li = document.createElement("li");
        var a = document.createElement("a");
        a.href = item.link;
        a.target = "_blank";
        a.rel = "noopener";

        var date = document.createElement("span");
        date.className = "date";
        date.textContent = formatDate(item.pubDate);

        var title = document.createElement("span");
        title.className = "title";
        title.textContent = item.title;

        var text = document.createElement("span");
        text.className = "text";
        text.appendChild(date);
        text.appendChild(title);
        a.appendChild(text);
        li.appendChild(a);
        list.appendChild(li);

        var slot = { key: norm(item.link), a: a, text: text, hasImg: false };
        slots.push(slot);
        addImage(slot, findImage(item));
      });
      status.remove();
      console.log("rss2json first item:", data.items[0]);
      if (slots.some(function (s) { return !s.hasImg; })) fillFromXml();
    })
    .catch(function () {
      status.textContent = "記事を取得できませんでした。時間をおいてページを再読み込みしてください。";
      status.className = "status error";
    });
})();
</script>
</body>
</html>
