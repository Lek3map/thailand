@keyframes infinity-scroll-left {

}

}
.scroll-infinity__list {

}
.scroll-infinity__item>img {
  width: 100%;
}

.scroll-infinity__wrap:hover .scroll-infinity__list--left{
  animation-play-state: paused;
}
