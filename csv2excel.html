<!DOCTYPE html>
<html>
<head>
  <!-- SheetJSライブラリの読み込み -->
  <script src="https://sheetjs.com"></script>
</head>
<body>
<script>
  // MacroDroidから渡されたCSVテキストと保存先パスを受け取る関数
  function convert(csvText, exportPath) {
    try {
      // CSVを2次元配列に変換（Shift-JISなどで文字化けする場合は考慮が必要）
      const csvData = csvText.split(/\r\n|\n/).filter(row => row.trim() !== '').map(row => row.split(','));
      
      const worksheet = XLSX.utils.aoa_to_sheet(csvData);
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, 'Data');
      
      // Excelのバイナリデータを生成
      const wbout = XLSX.write(workbook, {bookType:'xlsx', type:'base64'});
      
      // MacroDroid側に「完了」と「Base64データ」を返す
      MacroDroid.readResponse(JSON.stringify({status: "success", data: wbout, path: exportPath}));
    } catch(e) {
      MacroDroid.readResponse(JSON.stringify({status: "error", message: e.message}));
    }
  }
</script>
</body>
</html>
