<!DOCTYPE html>
<html lang='ja'>
<head>
<meta charset='utf-8'>
<meta property="og:title" content="2007年10月26日の地図日記">
<meta property="og:type" content="website">
<title>2007年10月26日の地図日記</title>
<link rel='stylesheet' href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css' />
<script src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'></script>
<style>
    body { display: flex; height: 100vh; margin: 0; background: #111; font-family: sans-serif; }
    #map { flex: 1; }
    #sidebar { width: 200px; overflow-y: auto; background: #111; padding: 10px; border-left: 1px solid #333; }
    .photo-thumb { margin-bottom: 10px; cursor: pointer; border: 2px solid transparent; min-height: 40px; background: #222; }
    .photo-thumb:hover { border-color: #007bff; }
    .photo-thumb img { width: 100%; border-radius: 4px; display: block; }
    .thumb-label { color: #ccc; font-size: 12px; text-align: center; padding: 4px 2px; word-break: break-word; }
</style>
</head>
<body>
<div id='map'></div>
<div id='sidebar'><div style='color:white; text-align:center; margin-bottom:15px;'>2007年10月26日</div><div class='photo-thumb'><img src='https://lek3map.github.io/thailand/picture/aruki.jpg' title='交通手段' alt='交通手段' onerror="this.style.display='none'"></div><div class='photo-thumb' onclick='moveToMarker(0)'><img src='https://lek3map.github.io/thailand/map/2007/thumbs/07102601.jpg' title='Pier' alt='Pier' onerror="this.style.display='none'"><div class='thumb-label'>Pier</div></div><div class='photo-thumb' onclick='moveToMarker(1)'><img src='https://lek3map.github.io/thailand/map/2007/thumbs/07102619.jpg' title='Clock Tower' alt='Clock Tower' onerror="this.style.display='none'"><div class='thumb-label'>Clock Tower</div></div><div class='photo-thumb' onclick='moveToMarker(2)'><img src='https://lek3map.github.io/thailand/map/2007/thumbs/07102631.jpg' title='Si Racha Post Office' alt='Si Racha Post Office' onerror="this.style.display='none'"><div class='thumb-label'>Si Racha Post Office</div></div><div class='photo-thumb' onclick='moveToMarker(3)'><img src='https://lek3map.github.io/thailand/map/2007/thumbs/07102632.jpg' title='Clock Tower' alt='Clock Tower' onerror="this.style.display='none'"><div class='thumb-label'>Clock Tower</div></div><div class='photo-thumb' onclick='moveToMarker(4)'><img src='https://lek3map.github.io/thailand/map/2007/thumbs/07102635.jpg' title='Street Lamp' alt='Street Lamp' onerror="this.style.display='none'"><div class='thumb-label'>Street Lamp</div></div></div>
<script>
var map = L.map('map');
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

var markers = {};
var markerGroup = L.featureGroup().addTo(map);
var pathPoints = [];

var icon_clock_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/clock.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
var icon_fune_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/fune.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
var icon_gaitou_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/gaitou.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
var icon_postbox_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/postbox.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
markers[0] = L.marker([13.167853, 100.921193], {icon: icon_fune_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Pier</h3><a href='https://lek3map.github.io/thailand/map/2007/picture/07102601.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2007/thumbs/07102601.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>チョンブリ</div><div style='text-align:left; margin-top:8px;'>以前はこの桟橋からシーチャン島への船が出ていたが、今はコ・ロイから出ている</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=13.167853,100.921193' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=13.167853,100.921193&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[1] = L.marker([13.164155, 100.922427], {icon: icon_clock_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Clock Tower<br>หอนาฬิกา</h3><a href='https://lek3map.github.io/thailand/map/2007/picture/07102619.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2007/thumbs/07102619.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>チョンブリ</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=13.164155,100.922427' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=13.164155,100.922427&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[2] = L.marker([13.171828, 100.926406], {icon: icon_postbox_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Si Racha Post Office</h3><a href='https://lek3map.github.io/thailand/map/2007/picture/07102631.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2007/thumbs/07102631.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>チョンブリ</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=13.171828,100.926406' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=13.171828,100.926406&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[3] = L.marker([13.173562, 100.926343], {icon: icon_clock_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Clock Tower<br>หอนาฬิกา</h3><a href='https://lek3map.github.io/thailand/map/2007/picture/07102632.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2007/thumbs/07102632.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>チョンブリ</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=13.173562,100.926343' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=13.173562,100.926343&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[4] = L.marker([13.17084, 100.925753], {icon: icon_gaitou_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Street Lamp</h3><a href='https://lek3map.github.io/thailand/map/2007/picture/07102635.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2007/thumbs/07102635.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>チョンブリ</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=13.17084,100.925753' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=13.17084,100.925753&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");

if (pathPoints.length > 0) {
    var polyline = L.polyline(pathPoints, {color: '#ff0000', weight: 4, opacity: 0.8}).addTo(map);
    map.fitBounds(polyline.getBounds(), {padding: [30, 30]});
} else if (Object.keys(markers).length > 0) {
    map.fitBounds(markerGroup.getBounds(), {padding: [50, 50]});
} else {
    map.setView([13.7563, 100.5018], 6);
}

function moveToMarker(id) { 
    var m = markers[id]; 
    if(m) { map.flyTo(m.getLatLng(), 15); m.openPopup(); } 
}
</script>
</body>
</html>
