<!DOCTYPE html>
<html lang='ja'>
<head>
<meta charset='utf-8'>
<meta property="og:title" content="2007年9月13日の地図日記">
<meta property="og:type" content="website">
<title>2007年9月13日の地図日記</title>
<link rel='stylesheet' href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css' />
<script src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'></script>
<style>
    body { display: flex; height: 100vh; margin: 0; background: #111; font-family: sans-serif; }
    #map { flex: 1; }
    #sidebar { width: 200px; overflow-y: auto; background: #111; padding: 10px; border-left: 1px solid #333; }
    .photo-thumb { margin-bottom: 10px; cursor: pointer; border: 2px solid transparent; min-height: 40px; background: #222; }
    .photo-thumb:hover { border-color: #007bff; }
    .photo-thumb img { width: 100%; border-radius: 4px; display: block; }
    .thumb-label { color: #ccc; font-size: 12px; text-align: center; padding: 4px 2px; word-break: break-word; }
</style>
</head>
<body>
<div id='map'></div>
<div id='sidebar'><div style='color:white; text-align:center; margin-bottom:15px;'>2007年9月13日</div><div class='photo-thumb'><img src='https://lek3map.github.io/thailand/picture/kuruma.jpg' title='交通手段' alt='交通手段' onerror="this.style.display='none'"></div><div class='photo-thumb' onclick='moveToMarker(0)'><img src='https://lek3map.github.io/thailand/map/2007/thumbs/07091315.jpg' title='Drum' alt='Drum' onerror="this.style.display='none'"><div class='thumb-label'>Drum</div></div><div class='photo-thumb' onclick='moveToMarker(1)'><img src='https://lek3map.github.io/thailand/map/2007/thumbs/07091319.jpg' title='Wat Wang Manao' alt='Wat Wang Manao' onerror="this.style.display='none'"><div class='thumb-label'>Wat Wang Manao</div></div><div class='photo-thumb' onclick='moveToMarker(2)'><img src='https://lek3map.github.io/thailand/map/2007/thumbs/07091342.jpg' title='Kao Takiab' alt='Kao Takiab' onerror="this.style.display='none'"><div class='thumb-label'>Kao Takiab</div></div><div class='photo-thumb' onclick='moveToMarker(3)'><img src='https://lek3map.github.io/thailand/map/2007/thumbs/07091359.jpg' title='Road signs' alt='Road signs' onerror="this.style.display='none'"><div class='thumb-label'>Road signs</div></div></div>
<script>
var map = L.map('map');
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

var markers = {};
var markerGroup = L.featureGroup().addTo(map);
var pathPoints = [];

var icon_hyoushiki_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/hyoushiki.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
var icon_starr_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/starr.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
var icon_tera_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/tera.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
markers[0] = L.marker([13.399608, 100.008888], {icon: icon_starr_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Drum</h3><a href='https://lek3map.github.io/thailand/map/2007/picture/07091315.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2007/thumbs/07091315.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>サムットソンクラム</div><div style='text-align:left; margin-top:8px;'>サムットソンクラムのシンボルはタイコなのです</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=13.399608,100.008888' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=13.399608,100.008888&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[1] = L.marker([13.335591, 99.835918], {icon: icon_tera_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Wat Wang Manao<br>วัดวังมะนาว</h3><a href='https://lek3map.github.io/thailand/map/2007/picture/07091319.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2007/thumbs/07091319.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>ラチャブリ</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=13.335591,99.835918' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=13.335591,99.835918&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[2] = L.marker([12.518746, 99.97918], {icon: icon_tera_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Kao Takiab<br>เขาตะเกียบ</h3><a href='https://lek3map.github.io/thailand/map/2007/picture/07091342.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2007/thumbs/07091342.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>パチュアップキリカン</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=12.518746,99.97918' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=12.518746,99.97918&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[3] = L.marker([12.56779, 99.954815], {icon: icon_hyoushiki_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Road signs</h3><a href='https://lek3map.github.io/thailand/map/2007/picture/07091359.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2007/thumbs/07091359.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>パチュアップキリカン</div><div style='text-align:left; margin-top:8px;'>道路標識</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=12.56779,99.954815' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=12.56779,99.954815&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");

if (pathPoints.length > 0) {
    var polyline = L.polyline(pathPoints, {color: '#ff0000', weight: 4, opacity: 0.8}).addTo(map);
    map.fitBounds(polyline.getBounds(), {padding: [30, 30]});
} else if (Object.keys(markers).length > 0) {
    map.fitBounds(markerGroup.getBounds(), {padding: [50, 50]});
} else {
    map.setView([13.7563, 100.5018], 6);
}

function moveToMarker(id) { 
    var m = markers[id]; 
    if(m) { map.flyTo(m.getLatLng(), 15); m.openPopup(); } 
}
</script>
</body>
</html>
