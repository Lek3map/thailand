<!DOCTYPE html>
<html lang='ja'>
<head>
<meta charset='utf-8'>
<meta property="og:title" content="2007年9月10日の地図日記">
<meta property="og:type" content="website">
<title>2007年9月10日の地図日記</title>
<link rel='stylesheet' href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css' />
<script src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'></script>
<style>
    body { display: flex; height: 100vh; margin: 0; background: #111; font-family: sans-serif; }
    #map { flex: 1; }
    #sidebar { width: 200px; overflow-y: auto; background: #111; padding: 10px; border-left: 1px solid #333; }
    .photo-thumb { margin-bottom: 10px; cursor: pointer; border: 2px solid transparent; min-height: 40px; background: #222; }
    .photo-thumb:hover { border-color: #007bff; }
    .photo-thumb img { width: 100%; border-radius: 4px; display: block; }
    .thumb-label { color: #ccc; font-size: 12px; text-align: center; padding: 4px 2px; word-break: break-word; }
</style>
</head>
<body>
<div id='map'></div>
<div id='sidebar'><div style='color:white; text-align:center; margin-bottom:15px;'>2007年9月10日</div><div class='photo-thumb'><img src='https://lek3map.github.io/thailand/picture/kuruma.jpg' title='交通手段' alt='交通手段' onerror="this.style.display='none'"></div><div class='photo-thumb' onclick='moveToMarker(0)'><img src='https://lek3map.github.io/thailand/map/2007/thumbs/070910003.jpg' title='King Naresuan Monument' alt='King Naresuan Monument' onerror="this.style.display='none'"><div class='thumb-label'>King Naresuan Monument</div></div><div class='photo-thumb' onclick='moveToMarker(1)'><img src='https://lek3map.github.io/thailand/map/2007/thumbs/070910028.jpg' title='Post Office' alt='Post Office' onerror="this.style.display='none'"><div class='thumb-label'>Post Office</div></div><div class='photo-thumb' onclick='moveToMarker(2)'><img src='https://lek3map.github.io/thailand/map/2007/thumbs/070910084.jpg' title='Wat Tham Khao Chakan' alt='Wat Tham Khao Chakan' onerror="this.style.display='none'"><div class='thumb-label'>Wat Tham Khao Chakan</div></div><div class='photo-thumb' onclick='moveToMarker(3)'><img src='https://lek3map.github.io/thailand/map/2007/thumbs/070910103.jpg' title='Thai-Cambodia Border' alt='Thai-Cambodia Border' onerror="this.style.display='none'"><div class='thumb-label'>Thai-Cambodia Border</div></div></div>
<script>
var map = L.map('map');
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

var markers = {};
var markerGroup = L.featureGroup().addTo(map);
var pathPoints = [];

var icon_border_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/border.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
var icon_parks_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/parks.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
var icon_postbox_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/postbox.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
var icon_tera_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/tera.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
markers[0] = L.marker([13.750349, 102.305589], {icon: icon_parks_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>King Naresuan Monument<br>ศาลสมเด็จพระนเรศวรมหาราช</h3><a href='https://goo.gl/photos/AqZT6T74WcEwvhCk6' target='_blank'><img src='https://lek3map.github.io/thailand/map/2007/thumbs/070910003.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>サケーオ</div><div style='text-align:left; margin-top:8px;'>象に誰も乗っていないのは変じゃないか？ナレスワン大王落馬じゃなくて落象しちゃったか？</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=13.750349,102.305589' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=13.750349,102.305589&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[1] = L.marker([13.816015, 102.071636], {icon: icon_postbox_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Post Office</h3><a href='https://lek3map.github.io/thailand/map/2007/picture/070910028.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2007/thumbs/070910028.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>サケーオ</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=13.816015,102.071636' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=13.816015,102.071636&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[2] = L.marker([13.660812, 102.085218], {icon: icon_tera_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Wat Tham Khao Chakan<br>วัดถ้ำเขาฉกรรจ์</h3><a href='https://photos.app.goo.gl/qgKfNCfGnCzDvBZB7' target='_blank'><img src='https://lek3map.github.io/thailand/map/2007/thumbs/070910084.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>サケーオ</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=13.660812,102.085218' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=13.660812,102.085218&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[3] = L.marker([12.927528, 102.495119], {icon: icon_border_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Thai-Cambodia Border</h3><a href='https://lek3map.github.io/thailand/map/2007/picture/070910103.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2007/thumbs/070910103.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>チャンタブリ</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=12.927528,102.495119' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=12.927528,102.495119&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");

if (pathPoints.length > 0) {
    var polyline = L.polyline(pathPoints, {color: '#ff0000', weight: 4, opacity: 0.8}).addTo(map);
    map.fitBounds(polyline.getBounds(), {padding: [30, 30]});
} else if (Object.keys(markers).length > 0) {
    map.fitBounds(markerGroup.getBounds(), {padding: [50, 50]});
} else {
    map.setView([13.7563, 100.5018], 6);
}

function moveToMarker(id) { 
    var m = markers[id]; 
    if(m) { map.flyTo(m.getLatLng(), 15); m.openPopup(); } 
}
</script>
</body>
</html>
