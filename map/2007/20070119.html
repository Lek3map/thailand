<!DOCTYPE html>
<html lang='ja'>
<head>
<meta charset='utf-8'>
<meta property="og:title" content="2007年1月19日の地図日記">
<meta property="og:type" content="website">
<title>2007年1月19日の地図日記</title>
<link rel='stylesheet' href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css' />
<script src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'></script>
<style>
    body { display: flex; height: 100vh; margin: 0; background: #111; font-family: sans-serif; }
    #map { flex: 1; }
    #sidebar { width: 200px; overflow-y: auto; background: #111; padding: 10px; border-left: 1px solid #333; }
    .photo-thumb { margin-bottom: 10px; cursor: pointer; border: 2px solid transparent; min-height: 40px; background: #222; }
    .photo-thumb:hover { border-color: #007bff; }
    .photo-thumb img { width: 100%; border-radius: 4px; display: block; }
    .thumb-label { color: #ccc; font-size: 12px; text-align: center; padding: 4px 2px; word-break: break-word; }
</style>
</head>
<body>
<div id='map'></div>
<div id='sidebar'><div style='color:white; text-align:center; margin-bottom:15px;'>2007年1月19日</div><div class='photo-thumb'><img src='https://lek3map.github.io/thailand/picture/kuruma.jpg' title='交通手段' alt='交通手段' onerror="this.style.display='none'"></div><div class='photo-thumb' onclick='moveToMarker(0)'><img src='https://lek3map.github.io/thailand/map/2007/thumbs/07011910.jpg' title='Yong Star Cape' alt='Yong Star Cape' onerror="this.style.display='none'"><div class='thumb-label'>Yong Star Cape</div></div><div class='photo-thumb' onclick='moveToMarker(1)'><img src='https://lek3map.github.io/thailand/map/2007/thumbs/07011931.jpg' title='Palian Post Office' alt='Palian Post Office' onerror="this.style.display='none'"><div class='thumb-label'>Palian Post Office</div></div><div class='photo-thumb' onclick='moveToMarker(2)'><img src='https://lek3map.github.io/thailand/map/2007/thumbs/07011955.jpg' title='Khao Ting Cave' alt='Khao Ting Cave' onerror="this.style.display='none'"><div class='thumb-label'>Khao Ting Cave</div></div><div class='photo-thumb' onclick='moveToMarker(3)'><img src='https://lek3map.github.io/thailand/map/2007/thumbs/07011968.jpg' title='Thung Yao Post Office' alt='Thung Yao Post Office' onerror="this.style.display='none'"><div class='thumb-label'>Thung Yao Post Office</div></div></div>
<script>
var map = L.map('map');
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

var markers = {};
var markerGroup = L.featureGroup().addTo(map);
var pathPoints = [];

var icon_fune_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/fune.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
var icon_postbox_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/postbox.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
var icon_tam_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/tam.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
markers[0] = L.marker([7.116522, 99.666091], {icon: icon_fune_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Yong Star Cape<br>แหลมหยงสตาร์</h3><a href='https://lek3map.github.io/thailand/map/2007/picture/07011910.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2007/thumbs/07011910.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>トラン</div><div style='text-align:left; margin-top:8px;'>桟橋とこの写真の家があるだけ</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=7.116522,99.666091' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=7.116522,99.666091&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[1] = L.marker([7.170218, 99.684534], {icon: icon_postbox_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Palian Post Office</h3><a href='https://lek3map.github.io/thailand/map/2007/picture/07011931.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2007/thumbs/07011931.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>トラン</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=7.170218,99.684534' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=7.170218,99.684534&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[2] = L.marker([7.158583, 99.802079], {icon: icon_tam_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Khao Ting Cave<br>ถ้ำเขาติง</h3><a href='https://photos.app.goo.gl/kTt5hvG729YbHLk9A' target='_blank'><img src='https://lek3map.github.io/thailand/map/2007/thumbs/07011955.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>トラン</div><div style='text-align:left; margin-top:8px;'>ジャブジャブと小川を渡ると洞窟への入り口がある</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=7.158583,99.802079' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=7.158583,99.802079&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[3] = L.marker([7.208091, 99.715669], {icon: icon_postbox_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Thung Yao Post Office</h3><a href='https://lek3map.github.io/thailand/map/2007/picture/07011968.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2007/thumbs/07011968.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>トラン</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=7.208091,99.715669' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=7.208091,99.715669&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");

if (pathPoints.length > 0) {
    var polyline = L.polyline(pathPoints, {color: '#ff0000', weight: 4, opacity: 0.8}).addTo(map);
    map.fitBounds(polyline.getBounds(), {padding: [30, 30]});
} else if (Object.keys(markers).length > 0) {
    map.fitBounds(markerGroup.getBounds(), {padding: [50, 50]});
} else {
    map.setView([13.7563, 100.5018], 6);
}

function moveToMarker(id) { 
    var m = markers[id]; 
    if(m) { map.flyTo(m.getLatLng(), 15); m.openPopup(); } 
}
</script>
</body>
</html>
