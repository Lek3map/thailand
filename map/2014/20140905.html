<!DOCTYPE html>
<html lang='ja'>
<head>
<meta charset='utf-8'>
<meta property="og:title" content="2014年09月05日の地図日記">
<meta property="og:image" content="https://lek3map.github.io/thailand/picture/hyoushi_note.png">
<meta property="og:type" content="website">
<title>2014年09月05日の地図日記</title>
<link rel='stylesheet' href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css' />
<script src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'></script>
<style>
    body { display: flex; height: 100vh; margin: 0; background: #111; font-family: sans-serif; }
    #map { flex: 1; }
    #sidebar { width: 200px; overflow-y: auto; background: #111; padding: 10px; border-left: 1px solid #333; }
    .photo-thumb { margin-bottom: 10px; cursor: pointer; border: 2px solid transparent; }
    .photo-thumb:hover { border-color: #007bff; }
    .photo-thumb img { width: 100%; border-radius: 4px; display: block; }
</style>
</head>
<body>
<div id='map'></div>
<div id='sidebar'><div style='color:white; text-align:center; margin-bottom:15px;'>2014年09月05日</div><div class='photo-thumb' onclick='moveToMarker(0)'><img src='https://lh6.googleusercontent.com/-ML7lZlFbius/VAlSbVsrOlI/AAAAAAAAYjk/TjXK44KMT5Y/s680/140905039.JPG' title='Wat Phun Kasem'></div>
<div class='photo-thumb' onclick='moveToMarker(1)'><img src='https://lh4.googleusercontent.com/-vwRwVfxEd5U/VAlQfga4q3I/AAAAAAAAYfM/W9FothWb39I/s680/140905006.JPG' title='Wat Ban Changhan'></div>
</div>
<script>
var map = L.map('map');
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

var markers = {};
var markerGroup = L.featureGroup().addTo(map);
var pathPoints = [];


                var icon_tera_png = L.icon({
                    iconUrl: 'https://lek3map.github.io/thailand/icon/tera.png',
                    iconSize: [30, 30],
                    iconAnchor: [15, 30],
                    popupAnchor: [0, -30]
                });
markers[0] = L.marker([16.112988, 103.631838], {icon: icon_tera_png}).addTo(markerGroup).bindPopup("<div style='width:250px;'><a href='https://photos.app.goo.gl/zPYoAVEoW3F2bMgS8' target='_blank'><img src='https://lh6.googleusercontent.com/-ML7lZlFbius/VAlSbVsrOlI/AAAAAAAAYjk/TjXK44KMT5Y/s680/140905039.JPG' style='width:100%; border-radius:4px;'></a><h3 style='margin:10px 0 5px 0;'>Wat Phun Kasem</h3><div style='color:#666; font-size:1.1em;'>ロイエット</div><div style='font-size:1.1em; color:#333; margin:10px 0;'>地獄絵あり</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=16.112988,103.631838' target='_blank' style='font-weight:bold;'>📍 Google Maps</a></div>");
markers[1] = L.marker([16.13927, 103.60341], {icon: icon_tera_png}).addTo(markerGroup).bindPopup("<div style='width:250px;'><a href='https://photos.app.goo.gl/KReBX6y37k3LajuB8' target='_blank'><img src='https://lh4.googleusercontent.com/-vwRwVfxEd5U/VAlQfga4q3I/AAAAAAAAYfM/W9FothWb39I/s680/140905006.JPG' style='width:100%; border-radius:4px;'></a><h3 style='margin:10px 0 5px 0;'>Wat Ban Changhan</h3><div style='color:#666; font-size:1.1em;'>ロイエット</div><div style='font-size:1.1em; color:#333; margin:10px 0;'>太鼓台 (หอกลอง)？鐘台 (หอระฆัง)？いずれにせよ古いものらしい</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=16.13927,103.60341' target='_blank' style='font-weight:bold;'>📍 Google Maps</a></div>");


if (pathPoints.length > 0) {
    var polyline = L.polyline(pathPoints, {color: '#ff0000', weight: 4, opacity: 0.8}).addTo(map);
    map.fitBounds(polyline.getBounds(), {padding: [30, 30]});
} else if (Object.keys(markers).length > 0) {
    map.fitBounds(markerGroup.getBounds(), {padding: [50, 50]});
} else {
    map.setView([13.7563, 100.5018], 6);
}

function moveToMarker(id) { 
    var m = markers[id]; 
    if(m) { map.flyTo(m.getLatLng(), 15); m.openPopup(); } 
}
</script>
</body>
</html>
