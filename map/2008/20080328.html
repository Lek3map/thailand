<!DOCTYPE html>
<html lang='ja'>
<head>
<meta charset='utf-8'>
<meta property="og:title" content="2008年3月28日の地図日記">
<meta property="og:type" content="website">
<title>2008年3月28日の地図日記</title>
<link rel='stylesheet' href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css' />
<script src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'></script>
<style>
    body { display: flex; height: 100vh; margin: 0; background: #111; font-family: sans-serif; }
    #map { flex: 1; }
    #sidebar { width: 200px; overflow-y: auto; background: #111; padding: 10px; border-left: 1px solid #333; }
    .photo-thumb { margin-bottom: 10px; cursor: pointer; border: 2px solid transparent; min-height: 40px; background: #222; }
    .photo-thumb:hover { border-color: #007bff; }
    .photo-thumb img { width: 100%; border-radius: 4px; display: block; }
    .thumb-label { color: #ccc; font-size: 12px; text-align: center; padding: 4px 2px; word-break: break-word; }
</style>
</head>
<body>
<div id='map'></div>
<div id='sidebar'><div style='color:white; text-align:center; margin-bottom:15px;'>2008年3月28日</div><div class='photo-thumb'><img src='https://lek3map.github.io/thailand/picture/kuruma.jpg' title='交通手段' alt='交通手段' onerror="this.style.display='none'"></div><div class='photo-thumb' onclick='moveToMarker(0)'><img src='https://lek3map.github.io/thailand/map/2008/thumbs/080328030.jpg' title='Lak Muang@Mae Sai' alt='Lak Muang@Mae Sai' onerror="this.style.display='none'"><div class='thumb-label'>Lak Muang@Mae Sai</div></div><div class='photo-thumb' onclick='moveToMarker(1)'><img src='https://lek3map.github.io/thailand/map/2008/thumbs/080328046.jpg' title='Thai-Laos Border' alt='Thai-Laos Border' onerror="this.style.display='none'"><div class='thumb-label'>Thai-Laos Border</div></div><div class='photo-thumb' onclick='moveToMarker(2)'><img src='https://lek3map.github.io/thailand/map/2008/thumbs/080328059.jpg' title='Maechan Post Office' alt='Maechan Post Office' onerror="this.style.display='none'"><div class='thumb-label'>Maechan Post Office</div></div><div class='photo-thumb' onclick='moveToMarker(3)'><img src='https://lek3map.github.io/thailand/map/2008/thumbs/080328064.jpg' title='Big Dipper' alt='Big Dipper' onerror="this.style.display='none'"><div class='thumb-label'>Big Dipper</div></div><div class='photo-thumb' onclick='moveToMarker(4)'><img src='https://lek3map.github.io/thailand/map/2008/thumbs/080328083.jpg' title='Road signs' alt='Road signs' onerror="this.style.display='none'"><div class='thumb-label'>Road signs</div></div><div class='photo-thumb' onclick='moveToMarker(5)'><img src='https://lek3map.github.io/thailand/map/2008/thumbs/080328096.jpg' title='Lak Muang' alt='Lak Muang' onerror="this.style.display='none'"><div class='thumb-label'>Lak Muang</div></div></div>
<script>
var map = L.map('map');
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

var markers = {};
var markerGroup = L.featureGroup().addTo(map);
var pathPoints = [];

var icon_border_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/border.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
var icon_hyoushiki_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/hyoushiki.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
var icon_lakmuang_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/lakmuang.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
var icon_postbox_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/postbox.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
var icon_starr_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/starr.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
markers[0] = L.marker([20.428305, 99.88409], {icon: icon_lakmuang_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Lak Muang@Mae Sai</h3><a href='https://lek3map.github.io/thailand/map/2008/picture/080328030.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2008/thumbs/080328030.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>チェンライ</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=20.428305,99.88409' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=20.428305,99.88409&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[1] = L.marker([20.275039, 100.08841], {icon: icon_border_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Thai-Laos Border</h3><a href='https://lek3map.github.io/thailand/map/2008/picture/080328046.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2008/thumbs/080328046.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>チェンライ</div><div style='text-align:left; margin-top:8px;'>外国人の通行不可</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=20.275039,100.08841' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=20.275039,100.08841&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[2] = L.marker([20.146936, 99.857129], {icon: icon_postbox_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Maechan Post Office</h3><a href='https://lek3map.github.io/thailand/map/2008/picture/080328059.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2008/thumbs/080328059.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>チェンライ</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=20.146936,99.857129' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=20.146936,99.857129&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[3] = L.marker([19.936812, 99.845451], {icon: icon_starr_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Big Dipper</h3><a href='https://lek3map.github.io/thailand/map/2008/picture/080328064.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2008/thumbs/080328064.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>チェンライ</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=19.936812,99.845451' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=19.936812,99.845451&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[4] = L.marker([19.191622, 99.880872], {icon: icon_hyoushiki_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Road signs</h3><a href='https://lek3map.github.io/thailand/map/2008/picture/080328083.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2008/thumbs/080328083.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>パヤオ</div><div style='text-align:left; margin-top:8px;'>道路標識</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=19.191622,99.880872' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=19.191622,99.880872&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[5] = L.marker([19.166491, 99.901928], {icon: icon_lakmuang_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Lak Muang</h3><a href='https://lek3map.github.io/thailand/map/2008/picture/080328096.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2008/thumbs/080328096.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>パヤオ</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=19.166491,99.901928' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=19.166491,99.901928&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");

if (pathPoints.length > 0) {
    var polyline = L.polyline(pathPoints, {color: '#ff0000', weight: 4, opacity: 0.8}).addTo(map);
    map.fitBounds(polyline.getBounds(), {padding: [30, 30]});
} else if (Object.keys(markers).length > 0) {
    map.fitBounds(markerGroup.getBounds(), {padding: [50, 50]});
} else {
    map.setView([13.7563, 100.5018], 6);
}

function moveToMarker(id) { 
    var m = markers[id]; 
    if(m) { map.flyTo(m.getLatLng(), 15); m.openPopup(); } 
}
</script>
</body>
</html>
