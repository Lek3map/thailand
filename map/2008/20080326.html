<!DOCTYPE html>
<html lang='ja'>
<head>
<meta charset='utf-8'>
<meta property="og:title" content="2008年3月26日の地図日記">
<meta property="og:type" content="website">
<title>2008年3月26日の地図日記</title>
<link rel='stylesheet' href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css' />
<script src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'></script>
<style>
    body { display: flex; height: 100vh; margin: 0; background: #111; font-family: sans-serif; }
    #map { flex: 1; }
    #sidebar { width: 200px; overflow-y: auto; background: #111; padding: 10px; border-left: 1px solid #333; }
    .photo-thumb { margin-bottom: 10px; cursor: pointer; border: 2px solid transparent; min-height: 40px; background: #222; }
    .photo-thumb:hover { border-color: #007bff; }
    .photo-thumb img { width: 100%; border-radius: 4px; display: block; }
    .thumb-label { color: #ccc; font-size: 12px; text-align: center; padding: 4px 2px; word-break: break-word; }
</style>
</head>
<body>
<div id='map'></div>
<div id='sidebar'><div style='color:white; text-align:center; margin-bottom:15px;'>2008年3月26日</div><div class='photo-thumb'><img src='https://lek3map.github.io/thailand/picture/kuruma.jpg' title='交通手段' alt='交通手段' onerror="this.style.display='none'"></div><div class='photo-thumb' onclick='moveToMarker(0)'><img src='https://lek3map.github.io/thailand/map/2008/thumbs/080326114.jpg' title='Rattanakosin 200 Year Anniversary Bridge' alt='Rattanakosin 200 Year Anniversary Bridge' onerror="this.style.display='none'"><div class='thumb-label'>Rattanakosin 200 Year Anniversary Bridge</div></div><div class='photo-thumb' onclick='moveToMarker(1)'><img src='https://lek3map.github.io/thailand/map/2008/thumbs/080326120.jpg' title='Clock Tower' alt='Clock Tower' onerror="this.style.display='none'"><div class='thumb-label'>Clock Tower</div></div><div class='photo-thumb' onclick='moveToMarker(2)'><img src='https://lek3map.github.io/thailand/map/2008/thumbs/080326153.jpg' title='Lampan’s Specialty Carriage' alt='Lampan’s Specialty Carriage' onerror="this.style.display='none'"><div class='thumb-label'>Lampan’s Specialty Carriage</div></div><div class='photo-thumb' onclick='moveToMarker(3)'><img src='https://lek3map.github.io/thailand/map/2008/thumbs/080326155.jpg' title='Pottery Monument' alt='Pottery Monument' onerror="this.style.display='none'"><div class='thumb-label'>Pottery Monument</div></div><div class='photo-thumb' onclick='moveToMarker(4)'><img src='https://lek3map.github.io/thailand/map/2008/thumbs/080326174.jpg' title='Fountain' alt='Fountain' onerror="this.style.display='none'"><div class='thumb-label'>Fountain</div></div></div>
<script>
var map = L.map('map');
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

var markers = {};
var markerGroup = L.featureGroup().addTo(map);
var pathPoints = [];

var icon_clock_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/clock.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
var icon_funsui_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/funsui.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
var icon_starr_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/starr.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
markers[0] = L.marker([16.878091, 99.120503], {icon: icon_starr_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Rattanakosin 200 Year Anniversary Bridge</h3><a href='https://lek3map.github.io/thailand/map/2008/picture/080326114.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2008/thumbs/080326114.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>ターク</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=16.878091,99.120503' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=16.878091,99.120503&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[1] = L.marker([16.877557, 99.120777], {icon: icon_clock_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Clock Tower<br>หอนาฬิกา</h3><a href='https://lek3map.github.io/thailand/map/2008/picture/080326120.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2008/thumbs/080326120.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>ターク</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=16.877557,99.120777' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=16.877557,99.120777&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[2] = L.marker([18.19082, 99.406415], {icon: icon_starr_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Lampan’s Specialty Carriage</h3><a href='https://lek3map.github.io/thailand/map/2008/picture/080326153.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2008/thumbs/080326153.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>ランパン</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=18.19082,99.406415' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=18.19082,99.406415&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[3] = L.marker([18.253333, 99.455162], {icon: icon_starr_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Pottery Monument</h3><a href='https://lek3map.github.io/thailand/map/2008/picture/080326155.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2008/thumbs/080326155.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>ランパン</div><div style='text-align:left; margin-top:8px;'>タイでよく見るニワトリ柄の焼き物の産地はここ</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=18.253333,99.455162' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=18.253333,99.455162&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[4] = L.marker([18.280469, 99.473278], {icon: icon_funsui_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Fountain</h3><a href='https://lek3map.github.io/thailand/map/2008/picture/080326174.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2008/thumbs/080326174.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>ランパン</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=18.280469,99.473278' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=18.280469,99.473278&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");

if (pathPoints.length > 0) {
    var polyline = L.polyline(pathPoints, {color: '#ff0000', weight: 4, opacity: 0.8}).addTo(map);
    map.fitBounds(polyline.getBounds(), {padding: [30, 30]});
} else if (Object.keys(markers).length > 0) {
    map.fitBounds(markerGroup.getBounds(), {padding: [50, 50]});
} else {
    map.setView([13.7563, 100.5018], 6);
}

function moveToMarker(id) { 
    var m = markers[id]; 
    if(m) { map.flyTo(m.getLatLng(), 15); m.openPopup(); } 
}
</script>
</body>
</html>
