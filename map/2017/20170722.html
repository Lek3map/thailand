<!DOCTYPE html>
<html lang='ja'>
<head>
<meta charset='utf-8'>
<meta property="og:title" content="2017年07月22日の地図日記">
<meta property="og:image" content="https://lek3map.github.io/thailand/picture/hyoushi_note.png">
<meta property="og:type" content="website">
<title>2017年07月22日の地図日記</title>
<link rel='stylesheet' href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css' />
<script src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'></script>
<style>
    body { display: flex; height: 100vh; margin: 0; background: #111; font-family: sans-serif; }
    #map { flex: 1; }
    #sidebar { width: 200px; overflow-y: auto; background: #111; padding: 10px; border-left: 1px solid #333; }
    .photo-thumb { margin-bottom: 10px; cursor: pointer; border: 2px solid transparent; }
    .photo-thumb:hover { border-color: #007bff; }
    .photo-thumb img { width: 100%; border-radius: 4px; display: block; }
</style>
</head>
<body>
<div id='map'></div>
<div id='sidebar'><div style='color:white; text-align:center; margin-bottom:15px;'>2017年07月22日</div><div class='photo-thumb' onclick='moveToMarker(0)'><img src='https://lek3map.github.io/thailand/picture/hyoushi_note.png' title='日付変更線'></div>
<div class='photo-thumb' onclick='moveToMarker(1)'><img src='https://lh3.googleusercontent.com/pw/AP1GczNZS-JcRKXnNjQUxzB85i1IA8ts7vWMkCkDZNCjmVrfVdMO_ARxiR9h4cX44LuXpNYX9sOCCTe8tW7YN3wEeaT55KmxbNSYMzkmrfas1lGpXN-BqVa3A0q66xS2YBngysTQNUDFjHwfgk_TCJKNzR7C1g=w1159-h869-s-no-gm?authuser=0' title='バンクーバー ⇒ 羽田'></div>
<div class='photo-thumb' onclick='moveToMarker(2)'><img src='https://photos.fife.usercontent.google.com/pw/AP1GczP-NkBKsQaZtM8zHATHqCq-brE9_fJvXo9DrTXo-GkaWXRNe5bVYMqBGw=w1159-h869-s-no-gm?authuser=0' title='羽田'></div>
</div>
<script>
var map = L.map('map');
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

var markers = {};
var markerGroup = L.featureGroup().addTo(map);
var pathPoints = [[53.0, 180.0000001], [53.0, 179.0], [50.0, 165.0], [45.0, 160.0], [39.0, 145.0], [35.530944, 139.808056]];


                var icon_end_png = L.icon({
                    iconUrl: 'https://lek3map.github.io/thailand/icon/end.png',
                    iconSize: [30, 30],
                    iconAnchor: [15, 30],
                    popupAnchor: [0, -30]
                });
                var icon_starr_png = L.icon({
                    iconUrl: 'https://lek3map.github.io/thailand/icon/starr.png',
                    iconSize: [30, 30],
                    iconAnchor: [15, 30],
                    popupAnchor: [0, -30]
                });
                var icon_plane_png = L.icon({
                    iconUrl: 'https://lek3map.github.io/thailand/icon/plane.png',
                    iconSize: [30, 30],
                    iconAnchor: [15, 30],
                    popupAnchor: [0, -30]
                });
markers[0] = L.marker([53.0, 180.0], {icon: icon_end_png}).addTo(markerGroup).bindPopup("<div style='width:250px;'><a href='#' target='_blank'><img src='https://lek3map.github.io/thailand/picture/hyoushi_note.png' style='width:100%; border-radius:4px;'></a><h3 style='margin:10px 0 5px 0;'>日付変更線</h3><div style='font-size:1.1em; color:#333; margin:10px 0;'>太平洋上 NH115</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=53.0,180.0' target='_blank' style='font-weight:bold;'>📍 Google Maps</a></div>");
markers[1] = L.marker([45.0, 160.0], {icon: icon_starr_png}).addTo(markerGroup).bindPopup("<div style='width:250px;'><a href='https://photos.app.goo.gl/Rq0CLmArrffF1cFn2' target='_blank'><img src='https://lh3.googleusercontent.com/pw/AP1GczNZS-JcRKXnNjQUxzB85i1IA8ts7vWMkCkDZNCjmVrfVdMO_ARxiR9h4cX44LuXpNYX9sOCCTe8tW7YN3wEeaT55KmxbNSYMzkmrfas1lGpXN-BqVa3A0q66xS2YBngysTQNUDFjHwfgk_TCJKNzR7C1g=w1159-h869-s-no-gm?authuser=0' style='width:100%; border-radius:4px;'></a><h3 style='margin:10px 0 5px 0;'>バンクーバー ⇒ 羽田</h3><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=45.0,160.0' target='_blank' style='font-weight:bold;'>📍 Google Maps</a></div>");
markers[2] = L.marker([35.548417, 139.777887], {icon: icon_plane_png}).addTo(markerGroup).bindPopup("<div style='width:250px;'><a href='https://photos.app.goo.gl/jCEB7fAq1kicq7tu6' target='_blank'><img src='https://photos.fife.usercontent.google.com/pw/AP1GczP-NkBKsQaZtM8zHATHqCq-brE9_fJvXo9DrTXo-GkaWXRNe5bVYMqBGw=w1159-h869-s-no-gm?authuser=0' style='width:100%; border-radius:4px;'></a><h3 style='margin:10px 0 5px 0;'>羽田</h3><div style='color:#666; font-size:1.1em;'>大田区、東京都</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=35.548417,139.777887' target='_blank' style='font-weight:bold;'>📍 Google Maps</a></div>");


if (pathPoints.length > 0) {
    var polyline = L.polyline(pathPoints, {color: '#ff0000', weight: 4, opacity: 0.8}).addTo(map);
    map.fitBounds(polyline.getBounds(), {padding: [30, 30]});
} else if (Object.keys(markers).length > 0) {
    map.fitBounds(markerGroup.getBounds(), {padding: [50, 50]});
} else {
    map.setView([13.7563, 100.5018], 6);
}

function moveToMarker(id) { 
    var m = markers[id]; 
    if(m) { map.flyTo(m.getLatLng(), 15); m.openPopup(); } 
}
</script>
</body>
</html>
