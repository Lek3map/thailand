<!DOCTYPE html>
<html lang='ja'>
<head>
<meta charset='utf-8'>
<meta property="og:title" content="2006年4月1日の地図日記">
<meta property="og:type" content="website">
<title>2006年4月1日の地図日記</title>
<link rel='stylesheet' href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css' />
<script src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'></script>
<style>
    body { display: flex; height: 100vh; margin: 0; background: #111; font-family: sans-serif; }
    #map { flex: 1; }
    #sidebar { width: 200px; overflow-y: auto; background: #111; padding: 10px; border-left: 1px solid #333; }
    .photo-thumb { margin-bottom: 10px; cursor: pointer; border: 2px solid transparent; min-height: 40px; background: #222; }
    .photo-thumb:hover { border-color: #007bff; }
    .photo-thumb img { width: 100%; border-radius: 4px; display: block; }
    .thumb-label { color: #ccc; font-size: 12px; text-align: center; padding: 4px 2px; word-break: break-word; }
</style>
</head>
<body>
<div id='map'></div>
<div id='sidebar'><div style='color:white; text-align:center; margin-bottom:15px;'>2006年4月1日</div><div class='photo-thumb'><img src='https://lek3map.github.io/thailand/picture/aruki.jpg' title='交通手段' alt='交通手段' onerror="this.style.display='none'"></div><div class='photo-thumb' onclick='moveToMarker(0)'><img src='https://lek3map.github.io/thailand/map/2006/thumbs/06040117.jpg' title='Hua Hin Station' alt='Hua Hin Station' onerror="this.style.display='none'"><div class='thumb-label'>Hua Hin Station</div></div><div class='photo-thumb' onclick='moveToMarker(1)'><img src='https://lek3map.github.io/thailand/map/2006/thumbs/06040121.jpg' title='Phon King Phet' alt='Phon King Phet' onerror="this.style.display='none'"><div class='thumb-label'>Phon King Phet</div></div><div class='photo-thumb' onclick='moveToMarker(2)'><img src='https://lek3map.github.io/thailand/map/2006/thumbs/06040127.jpg' title='Clock Tower' alt='Clock Tower' onerror="this.style.display='none'"><div class='thumb-label'>Clock Tower</div></div><div class='photo-thumb' onclick='moveToMarker(3)'><img src='https://lek3map.github.io/thailand/map/2006/thumbs/06040134.jpg' title='Ratchaburi Station' alt='Ratchaburi Station' onerror="this.style.display='none'"><div class='thumb-label'>Ratchaburi Station</div></div><div class='photo-thumb' onclick='moveToMarker(4)'><img src='https://lek3map.github.io/thailand/map/2006/thumbs/06040142.jpg' title='Clock Tower' alt='Clock Tower' onerror="this.style.display='none'"><div class='thumb-label'>Clock Tower</div></div><div class='photo-thumb' onclick='moveToMarker(5)'><img src='https://lek3map.github.io/thailand/map/2006/thumbs/06040148.jpg' title='Lak Muang' alt='Lak Muang' onerror="this.style.display='none'"><div class='thumb-label'>Lak Muang</div></div><div class='photo-thumb' onclick='moveToMarker(6)'><img src='https://lek3map.github.io/thailand/map/2006/thumbs/06040152.jpg' title='Thanarat Bridge' alt='Thanarat Bridge' onerror="this.style.display='none'"><div class='thumb-label'>Thanarat Bridge</div></div><div class='photo-thumb' onclick='moveToMarker(7)'><img src='https://lek3map.github.io/thailand/map/2006/thumbs/06040153.jpg' title='Monument' alt='Monument' onerror="this.style.display='none'"><div class='thumb-label'>Monument</div></div></div>
<script>
var map = L.map('map');
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

var markers = {};
var markerGroup = L.featureGroup().addTo(map);
var pathPoints = [];

var icon_clock_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/clock.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
var icon_lakmuang_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/lakmuang.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
var icon_monument_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/monument.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
var icon_starr_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/starr.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
var icon_station_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/station.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
markers[0] = L.marker([12.567329, 99.954675], {icon: icon_station_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Hua Hin Station</h3><a href='https://photos.app.goo.gl/VGLUGfCuFcvkEkPK7' target='_blank'><img src='https://lek3map.github.io/thailand/map/2006/thumbs/06040117.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>パチュアップキリカン</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=12.567329,99.954675' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=12.567329,99.954675&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[1] = L.marker([12.567915, 99.956757], {icon: icon_monument_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Phon King Phet</h3><a href='https://lek3map.github.io/thailand/map/2006/picture/06040121.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2006/thumbs/06040121.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>パチュアップキリカン</div><div style='text-align:left; margin-top:8px;'>ポ-ン・キングピッチ像 ： タイ人初のボクシング世界チャンピオン</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=12.567915,99.956757' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=12.567915,99.956757&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[2] = L.marker([12.570353, 99.957245], {icon: icon_clock_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Clock Tower<br>หอนาฬิกา</h3><a href='https://lek3map.github.io/thailand/map/2006/picture/06040127.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2006/thumbs/06040127.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>パチュアップキリカン</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=12.570353,99.957245' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=12.570353,99.957245&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[3] = L.marker([13.530851, 99.823687], {icon: icon_station_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Ratchaburi Station</h3><a href='https://lek3map.github.io/thailand/map/2006/picture/06040134.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2006/thumbs/06040134.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>ラチャブリ</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=13.530851,99.823687' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=13.530851,99.823687&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[4] = L.marker([13.531054, 99.818312], {icon: icon_clock_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Clock Tower<br>หอนาฬิกา</h3><a href='https://lek3map.github.io/thailand/map/2006/picture/06040142.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2006/thumbs/06040142.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>ラチャブリ</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=13.531054,99.818312' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=13.531054,99.818312&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[5] = L.marker([13.54416, 99.824787], {icon: icon_lakmuang_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Lak Muang</h3><a href='https://lek3map.github.io/thailand/map/2006/picture/06040148.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2006/thumbs/06040148.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>ラチャブリ</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=13.54416,99.824787' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=13.54416,99.824787&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[6] = L.marker([13.541036, 99.824181], {icon: icon_starr_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Thanarat Bridge</h3><a href='https://lek3map.github.io/thailand/map/2006/picture/06040152.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2006/thumbs/06040152.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>ラチャブリ</div><div style='text-align:left; margin-top:8px;'>チュラルンコン橋</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=13.541036,99.824181' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=13.541036,99.824181&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[7] = L.marker([13.540129, 99.82432], {icon: icon_monument_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Monument</h3><a href='https://lek3map.github.io/thailand/map/2006/picture/06040153.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2006/thumbs/06040153.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>ラチャブリ</div><div style='text-align:left; margin-top:8px;'>ラチャブリ・ゲームの物か？</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=13.540129,99.82432' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=13.540129,99.82432&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");

if (pathPoints.length > 0) {
    var polyline = L.polyline(pathPoints, {color: '#ff0000', weight: 4, opacity: 0.8}).addTo(map);
    map.fitBounds(polyline.getBounds(), {padding: [30, 30]});
} else if (Object.keys(markers).length > 0) {
    map.fitBounds(markerGroup.getBounds(), {padding: [50, 50]});
} else {
    map.setView([13.7563, 100.5018], 6);
}

function moveToMarker(id) { 
    var m = markers[id]; 
    if(m) { map.flyTo(m.getLatLng(), 15); m.openPopup(); } 
}
</script>
</body>
</html>
