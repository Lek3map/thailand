<!DOCTYPE html>
<html lang='ja'>
<head>
<meta charset='utf-8'>
<meta property="og:title" content="2006年11月7日の地図日記">
<meta property="og:type" content="website">
<title>2006年11月7日の地図日記</title>
<link rel='stylesheet' href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css' />
<script src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'></script>
<style>
    body { display: flex; height: 100vh; margin: 0; background: #111; font-family: sans-serif; }
    #map { flex: 1; }
    #sidebar { width: 200px; overflow-y: auto; background: #111; padding: 10px; border-left: 1px solid #333; }
    .photo-thumb { margin-bottom: 10px; cursor: pointer; border: 2px solid transparent; min-height: 40px; background: #222; }
    .photo-thumb:hover { border-color: #007bff; }
    .photo-thumb img { width: 100%; border-radius: 4px; display: block; }
    .thumb-label { color: #ccc; font-size: 12px; text-align: center; padding: 4px 2px; word-break: break-word; }
</style>
</head>
<body>
<div id='map'></div>
<div id='sidebar'><div style='color:white; text-align:center; margin-bottom:15px;'>2006年11月7日</div><div class='photo-thumb'><img src='https://lek3map.github.io/thailand/picture/kuruma.jpg' title='交通手段' alt='交通手段' onerror="this.style.display='none'"></div><div class='photo-thumb' onclick='moveToMarker(0)'><img src='https://lek3map.github.io/thailand/map/2006/thumbs/06110712.jpg' title='Sawi Post Office' alt='Sawi Post Office' onerror="this.style.display='none'"><div class='thumb-label'>Sawi Post Office</div></div><div class='photo-thumb' onclick='moveToMarker(1)'><img src='https://lek3map.github.io/thailand/map/2006/thumbs/06110716.jpg' title='Wat Huai Luk' alt='Wat Huai Luk' onerror="this.style.display='none'"><div class='thumb-label'>Wat Huai Luk</div></div><div class='photo-thumb' onclick='moveToMarker(2)'><img src='https://lek3map.github.io/thailand/map/2006/thumbs/06110727.jpg' title='Wat Khao Lan Thom' alt='Wat Khao Lan Thom' onerror="this.style.display='none'"><div class='thumb-label'>Wat Khao Lan Thom</div></div><div class='photo-thumb' onclick='moveToMarker(3)'><img src='https://lek3map.github.io/thailand/map/2006/thumbs/06110740.jpg' title='Mrigadayavan Palace' alt='Mrigadayavan Palace' onerror="this.style.display='none'"><div class='thumb-label'>Mrigadayavan Palace</div></div></div>
<script>
var map = L.map('map');
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

var markers = {};
var markerGroup = L.featureGroup().addTo(map);
var pathPoints = [];

var icon_postbox_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/postbox.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
var icon_tera_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/tera.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
var icon_yakata_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/yakata.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
markers[0] = L.marker([10.233474, 99.107687], {icon: icon_postbox_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Sawi Post Office</h3><a href='https://lek3map.github.io/thailand/map/2006/picture/06110712.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2006/thumbs/06110712.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>チュンポン</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=10.233474,99.107687' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=10.233474,99.107687&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[1] = L.marker([11.473527, 99.591], {icon: icon_tera_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Wat Huai Luk<br>วัดห้วยลึก</h3><a href='https://lek3map.github.io/thailand/map/2006/picture/06110716.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2006/thumbs/06110716.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>パチュアップキリカン</div><div style='text-align:left; margin-top:8px;'>タイ最大のホン</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=11.473527,99.591' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=11.473527,99.591&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[2] = L.marker([12.517363, 99.974985], {icon: icon_tera_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Wat Khao Lan Thom<br>วัดเขาลั่นทมธรรมาธิปไตย</h3><a href='https://lek3map.github.io/thailand/map/2006/picture/06110727.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2006/thumbs/06110727.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>パチュアップキリカン</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=12.517363,99.974985' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=12.517363,99.974985&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[3] = L.marker([12.697701, 99.963731], {icon: icon_yakata_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Mrigadayavan Palace<br>พระราชวังมฤคทายวัน</h3><a href='https://goo.gl/photos/tYcgzJhcfeMQjd5S6' target='_blank'><img src='https://lek3map.github.io/thailand/map/2006/thumbs/06110740.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>ペチャブリ</div><div style='text-align:left; margin-top:8px;'>マルカタイヤワン宮殿</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=12.697701,99.963731' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=12.697701,99.963731&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");

if (pathPoints.length > 0) {
    var polyline = L.polyline(pathPoints, {color: '#ff0000', weight: 4, opacity: 0.8}).addTo(map);
    map.fitBounds(polyline.getBounds(), {padding: [30, 30]});
} else if (Object.keys(markers).length > 0) {
    map.fitBounds(markerGroup.getBounds(), {padding: [50, 50]});
} else {
    map.setView([13.7563, 100.5018], 6);
}

function moveToMarker(id) { 
    var m = markers[id]; 
    if(m) { map.flyTo(m.getLatLng(), 15); m.openPopup(); } 
}
</script>
</body>
</html>
