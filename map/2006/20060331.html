<!DOCTYPE html>
<html lang='ja'>
<head>
<meta charset='utf-8'>
<meta property="og:title" content="2006年3月31日の地図日記">
<meta property="og:type" content="website">
<title>2006年3月31日の地図日記</title>
<link rel='stylesheet' href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css' />
<script src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'></script>
<style>
    body { display: flex; height: 100vh; margin: 0; background: #111; font-family: sans-serif; }
    #map { flex: 1; }
    #sidebar { width: 200px; overflow-y: auto; background: #111; padding: 10px; border-left: 1px solid #333; }
    .photo-thumb { margin-bottom: 10px; cursor: pointer; border: 2px solid transparent; min-height: 40px; background: #222; }
    .photo-thumb:hover { border-color: #007bff; }
    .photo-thumb img { width: 100%; border-radius: 4px; display: block; }
    .thumb-label { color: #ccc; font-size: 12px; text-align: center; padding: 4px 2px; word-break: break-word; }
</style>
</head>
<body>
<div id='map'></div>
<div id='sidebar'><div style='color:white; text-align:center; margin-bottom:15px;'>2006年3月31日</div><div class='photo-thumb'><img src='https://lek3map.github.io/thailand/picture/aruki.jpg' title='交通手段' alt='交通手段' onerror="this.style.display='none'"></div><div class='photo-thumb' onclick='moveToMarker(0)'><img src='https://lek3map.github.io/thailand/map/2006/thumbs/06033106.jpg' title='Wat Phra Borommathat' alt='Wat Phra Borommathat' onerror="this.style.display='none'"><div class='thumb-label'>Wat Phra Borommathat</div></div><div class='photo-thumb' onclick='moveToMarker(1)'><img src='https://lek3map.github.io/thailand/map/2006/thumbs/06033128.jpg' title='Suratthani Station' alt='Suratthani Station' onerror="this.style.display='none'"><div class='thumb-label'>Suratthani Station</div></div><div class='photo-thumb' onclick='moveToMarker(2)'><img src='https://lek3map.github.io/thailand/map/2006/thumbs/06033135.jpg' title='Bus Terminal' alt='Bus Terminal' onerror="this.style.display='none'"><div class='thumb-label'>Bus Terminal</div></div><div class='photo-thumb' onclick='moveToMarker(3)'><img src='https://lek3map.github.io/thailand/map/2006/thumbs/06033140.jpg' title='Pathomporn Post Office' alt='Pathomporn Post Office' onerror="this.style.display='none'"><div class='thumb-label'>Pathomporn Post Office</div></div><div class='photo-thumb' onclick='moveToMarker(4)'><img src='https://lek3map.github.io/thailand/map/2006/thumbs/06033146.jpg' title='Clock Tower' alt='Clock Tower' onerror="this.style.display='none'"><div class='thumb-label'>Clock Tower</div></div><div class='photo-thumb' onclick='moveToMarker(5)'><img src='https://lek3map.github.io/thailand/map/2006/thumbs/06033149.jpg' title='Kra Buri Post Office' alt='Kra Buri Post Office' onerror="this.style.display='none'"><div class='thumb-label'>Kra Buri Post Office</div></div><div class='photo-thumb' onclick='moveToMarker(6)'><img src='https://lek3map.github.io/thailand/map/2006/thumbs/06033165.jpg' title='Kra Isthmus' alt='Kra Isthmus' onerror="this.style.display='none'"><div class='thumb-label'>Kra Isthmus</div></div><div class='photo-thumb' onclick='moveToMarker(7)'><img src='https://lek3map.github.io/thailand/map/2006/thumbs/06033179.jpg' title='Bus Terminal' alt='Bus Terminal' onerror="this.style.display='none'"><div class='thumb-label'>Bus Terminal</div></div></div>
<script>
var map = L.map('map');
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

var markers = {};
var markerGroup = L.featureGroup().addTo(map);
var pathPoints = [];

var icon_bus_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/bus.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
var icon_clock_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/clock.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
var icon_postbox_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/postbox.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
var icon_starr_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/starr.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
var icon_station_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/station.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
var icon_tera_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/tera.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
markers[0] = L.marker([9.385112, 99.184978], {icon: icon_tera_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Wat Phra Borommathat<br>วัดพระบรมธาตุไชยาราชวรวิหาร</h3><a href='https://goo.gl/photos/6cHc38NkNwK7CaeSA' target='_blank'><img src='https://lek3map.github.io/thailand/map/2006/thumbs/06033106.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>スラタニ</div><div style='text-align:left; margin-top:8px;'>第一級王室仏教寺院 県章元のお寺</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=9.385112,99.184978' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=9.385112,99.184978&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[1] = L.marker([9.104035, 99.230586], {icon: icon_station_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Suratthani Station</h3><a href='https://lek3map.github.io/thailand/map/2006/picture/06033128.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2006/thumbs/06033128.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>スラタニ</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=9.104035,99.230586' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=9.104035,99.230586&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[2] = L.marker([9.111181, 99.29835], {icon: icon_bus_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Bus Terminal</h3><a href='https://lek3map.github.io/thailand/map/2006/picture/06033135.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2006/thumbs/06033135.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>スラタニ</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=9.111181,99.29835' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=9.111181,99.29835&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[3] = L.marker([10.511347, 99.117284], {icon: icon_postbox_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Pathomporn Post Office</h3><a href='https://lek3map.github.io/thailand/map/2006/picture/06033140.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2006/thumbs/06033140.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>チュンポン</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=10.511347,99.117284' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=10.511347,99.117284&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[4] = L.marker([10.43182, 98.791165], {icon: icon_clock_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Clock Tower<br>หอนาฬิกา</h3><a href='https://lek3map.github.io/thailand/map/2006/picture/06033146.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2006/thumbs/06033146.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>ラノン</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=10.43182,98.791165' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=10.43182,98.791165&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[5] = L.marker([10.401673, 98.776097], {icon: icon_postbox_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Kra Buri Post Office</h3><a href='https://lek3map.github.io/thailand/map/2006/picture/06033149.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2006/thumbs/06033149.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>ラノン</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=10.401673,98.776097' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=10.401673,98.776097&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[6] = L.marker([10.468653, 98.809104], {icon: icon_starr_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Kra Isthmus<br>คอคอดกระ</h3><a href='https://goo.gl/photos/bnmQkd4W9zBuzXwz5' target='_blank'><img src='https://lek3map.github.io/thailand/map/2006/thumbs/06033165.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>ラノン</div><div style='text-align:left; margin-top:8px;'>クラ地峡：マレー半島の最狭部</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=10.468653,98.809104' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=10.468653,98.809104&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[7] = L.marker([10.486942, 99.120696], {icon: icon_bus_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Bus Terminal</h3><a href='https://lek3map.github.io/thailand/map/2006/picture/06033179.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2006/thumbs/06033179.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>チュンポン</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=10.486942,99.120696' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=10.486942,99.120696&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");

if (pathPoints.length > 0) {
    var polyline = L.polyline(pathPoints, {color: '#ff0000', weight: 4, opacity: 0.8}).addTo(map);
    map.fitBounds(polyline.getBounds(), {padding: [30, 30]});
} else if (Object.keys(markers).length > 0) {
    map.fitBounds(markerGroup.getBounds(), {padding: [50, 50]});
} else {
    map.setView([13.7563, 100.5018], 6);
}

function moveToMarker(id) { 
    var m = markers[id]; 
    if(m) { map.flyTo(m.getLatLng(), 15); m.openPopup(); } 
}
</script>
</body>
</html>
