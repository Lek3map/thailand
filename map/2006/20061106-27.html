
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { margin:0; display:flex; height:100vh; font-family:sans-serif; }
        #map { flex:1; }
        #side { width:240px; background:#2c3e50; color:white; overflow-y:auto; border-left:1px solid #000; }
        .map-title { background:#1a252f; padding:15px 10px; font-size:16px; font-weight:bold; color:#fff; border-bottom:2px solid #3498db; }   #タイトル文字 18
        .section-title { background:#34495e; padding:8px 10px; font-size:18px; font-weight:bold; color:#bdc3c7; border-top:1px solid #1a252f; }
        .row { padding:2px 12px; border-bottom:1px solid #3e5871; font-size:16px; cursor:pointer; display:flex; align-items:center; }
        .row:hover { background:#3e5871; }
        .popup-box { width:300px; }
        .popup-top { border-bottom:1px solid #ccc; padding-bottom:5px; margin-bottom:5px; }
        .name-ja { font-size:20px; font-weight:bold; color:#000; display:block; }
        .name-th { font-size:18px; color:#666; display:block; }
        .popup-img { width:100%; height:auto; margin:5px 0; border:1px solid #ddd; display:block; }
        .popup-bottom { font-size:16px; color:#333; line-height:1.5; }
        .geo-info { font-size:14px; color:#888; margin-top:5px; border-top:1px dotted #ccc; padding-top:5px; }
        .map-link { color: #3498db; text-decoration: none; font-weight: bold; }
        .map-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div id="map"></div>
    <div id="side">
        <div class="map-title">トラン ⇔ ロイエット GPSなし</div>
        <div class="section-title">📅 日付別地点を表示</div>
        <div id="date-list"></div>
        <div class="section-title">🚙 走行軌跡を表示</div>
        <div id="gpx-list"></div>
    </div>
    <script>
        const map = L.map('map').setView([13.7, 100.5], 6);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        
        const rData = [{"name":"2006年11月06日～28日","pts":[[7.572366,99.612741],[10.233474,99.107687],[11.473527,99.591],[12.517363,99.974985],[12.697701,99.963731],[16.130283,103.465129],[15.806206,102.60745],[11.818125,99.782306],[7.572366,99.612742]]}];
        const pData = [{"date":"2006年11月06日","name":"出発地","tname":"","img":"https://lek3map.github.io/thailand/picture/kuruma.jpg","pref":"トラン","des":"当時GPSロガーがなかったので訪問地の座標でルートとしました。","cat":"スタート","lat":7.572366,"lng":99.612741,"album_url":"https://lek3map.github.io/thailand/picture/kuruma.jpg"},{"date":"2006年11月07日","name":"Sawi Post Office","tname":"","img":"http://lh3.ggpht.com/_M674G_dhxK8/S_kgR-GqVgI/AAAAAAAAAUY/oQgMvzRufII/s680/06110712.jpg","pref":"チュンポン","des":"","cat":"郵便局","lat":10.233474,"lng":99.107687,"album_url":"http://lh3.ggpht.com/_M674G_dhxK8/S_kgR-GqVgI/AAAAAAAAAUY/oQgMvzRufII/s1600/06110712.jpg"},{"date":"2006年11月07日","name":"Wat Huai Luk","tname":"วัดห้วยลึก","img":"http://lh4.ggpht.com/_M674G_dhxK8/S_9cv9HJroI/AAAAAAAABJY/r-YhLGQwgA0/s680/06110716.jpg","pref":"パチュアップキリカン","des":"タイ最大のホン","cat":"仏教寺院","lat":11.473527,"lng":99.591,"album_url":"http://lh4.ggpht.com/_M674G_dhxK8/S_9cv9HJroI/AAAAAAAABJY/r-YhLGQwgA0/s1600/06110716.jpg"},{"date":"2006年11月07日","name":"Wat Khao Lan Thom","tname":"วัดเขาลั่นทมธรรมาธิปไตย","img":"http://lh3.ggpht.com/_M674G_dhxK8/S_9hbsBJgQI/AAAAAAAABJ0/gVovEfBGo1U/s680/06110727.jpg","pref":"パチュアップキリカン","des":"","cat":"仏教寺院","lat":12.517363,"lng":99.974985,"album_url":"http://lh3.ggpht.com/_M674G_dhxK8/S_9hbsBJgQI/AAAAAAAABJ0/gVovEfBGo1U/s1600/06110727.jpg"},{"date":"2006年11月07日","name":"Mrigadayavan Palace","tname":"พระราชวังมฤคทายวัน","img":"http://lh6.ggpht.com/_JL1uVzI-Zzc/S3CV3uZTvPI/AAAAAAAAF_U/gQpkgfnNXsE/s680/06110740.jpg","pref":"ペチャブリ","des":"マルカタイヤワン宮殿","cat":"博物館、～館","lat":12.697701,"lng":99.963731,"album_url":"https://goo.gl/photos/tYcgzJhcfeMQjd5S6"},{"date":"2006年11月08日","name":"Welcome Gate","tname":"","img":"https://1.bp.blogspot.com/-2M6jEzcSk-Q/XzfZrQZkBGI/AAAAAAAFOew/8VV0eXoYbEo-9g_ASbObNg8xRj0mZAZxACLcBGAsYHQ/s680/06110840.jpg","pref":"ロイエット","des":"","cat":"ウエルカムゲート","lat":16.130283,"lng":103.465129,"album_url":"https://1.bp.blogspot.com/-2M6jEzcSk-Q/XzfZrQZkBGI/AAAAAAAFOew/8VV0eXoYbEo-9g_ASbObNg8xRj0mZAZxACLcBGAsYHQ/s1600/06110840.jpg"},{"date":"2006年11月26日","name":"Road signs","tname":"","img":"http://lh3.ggpht.com/_89ENQ2jU1c4/SqIXdZ4DbPI/AAAAAAAADqc/x9vw0UTJUqw/s680/06112605.jpg","pref":"コンケン","des":"道路標識","cat":"道路標識","lat":15.806206,"lng":102.60745,"album_url":"http://lh3.ggpht.com/_89ENQ2jU1c4/SqIXdZ4DbPI/AAAAAAAADqc/x9vw0UTJUqw/s1600/06112605.jpg"},{"date":"2006年11月27日","name":"Prachuap Entrance Gate","tname":"","img":"http://lh6.ggpht.com/_M674G_dhxK8/S_8tWmdA6qI/AAAAAAAABGo/Vc6TPiOsmsg/s680/06112658.jpg","pref":"パチュアップキリカン","des":"","cat":"景勝地・物","lat":11.818125,"lng":99.782306,"album_url":"http://lh6.ggpht.com/_M674G_dhxK8/S_8tWmdA6qI/AAAAAAAABGo/Vc6TPiOsmsg/s1600/06112658.jpg"},{"date":"2006年11月28日","name":"到着地","tname":"","img":"https://lek3map.github.io/thailand/picture/kuruma.jpg","pref":"トラン","des":"無事帰宅","cat":"ゴール","lat":7.572366,"lng":99.612742,"album_url":"https://lek3map.github.io/thailand/picture/kuruma.jpg"}];
        const categoryMap = {"仏教寺院":"tera.png","中華寺院":"ctemp.png","回教寺院":"mosk.png","ヒンドゥ寺院":"hind.png","教会":"charch.png","ラク・ムアン":"lak.png","祈り・社・廟":"inori.png","空港":"plane.png","駅":"station.png","バスターミナル":"bus.png","桟橋":"fune.png","ウエルカムゲート":"gate.png","碑・石碑":"sekihi.png","慰霊碑":"irei.png","博物館、～館":"yakata.png","遺跡":"iseki.png","洞窟":"tam.png","ダム":"dam.png","温泉":"onsen.png","郵便局":"postbox.png","モニュメント":"monument.png","時計台":"clock.png","街灯":"gaitou.png","道路標識":"hyoushiki.png","公園・～園":"parks.png","祭り・イベント":"matsuri.png","海・海岸":"beach.png","景勝地・物":"starr.png","市場":"market.png","国境":"border.png","噴水":"funsui.png","その他":"other.png","スタート":"start.png","バイク":"bikered.png","墓":"hakab.png","寺院":"jiin.png","城・城址":"shiro.png","神社":"jinjya.png","さざれ石":"sazare.png","トンネル":"zuidou.png","庚申塔・塚":"koushintou.png","馬頭観音":"batou.png","道祖神・地蔵":"jizou.png","マンホール":"futa.png","灯台":"toudai.png","ポスト":"post.png","ゴール":"end.png"};
        const ICON_BASE = "https://lek3map.github.io/thailand/icon/";
        const IMAGE_BASE = "https://lek3map.github.io/thailand/photo/";
        
        let fg = L.featureGroup().addTo(map);

        function refresh() {
            fg.clearLayers();
            const checked = Array.from(document.querySelectorAll('.cb:checked')).map(c => c.value);
            rData.forEach(r => { if(checked.includes("GPX_" + r.name)) L.polyline(r.pts, {color:'red', weight:3, opacity:0.7}).addTo(fg); });
            pData.forEach(p => {
                if(checked.includes("DATE_" + p.date)) {
                    let iconFile = "";
                    for(let k in categoryMap) { if((p.cat||"").includes(k) || (p.name||"").includes(k)) { iconFile=categoryMap[k]; break; } }
                    let opt = iconFile ? { icon: L.icon({ iconUrl: ICON_BASE + iconFile, iconSize:[32,32], iconAnchor:[16,32], popupAnchor:[0,-32] }) } : {};
                    
                    let imgHtml = "";
                    if(p.img) {
                        const imgPath = (String(p.img).startsWith('http')) ? p.img : IMAGE_BASE + p.img;
                        // アルバムURL(Excelの最後列の値)があればそちらを。なければ画像へ。
                        const linkUrl = p.album_url || imgPath;
                        imgHtml = '<a href="' + linkUrl + '" target="_blank"><img src="' + imgPath + '" class="popup-img" onerror="this.style.display=\'none\'"></a>';
                    }

                    const gmapUrl = "https://www.google.com/maps?q=" + p.lat + "," + p.lng;
                    let html = '<div class="popup-box">' +
                               '<div class="popup-top"><span class="name-ja">' + (p.name||"") + '</span>' + (p.tname ? '<span class="name-th">' + p.tname + '</span>' : '') + '</div>' +
                               imgHtml +
                               '<div class="popup-bottom">' + (p.pref ? '<b>県名:</b> ' + p.pref + '<br>' : '') + '<b>説明:</b> ' + (p.des || "-") + '</div>' +
                               '<div class="geo-info"><a href="' + gmapUrl + '" target="_blank" class="map-link">📍 ' + p.lat.toFixed(5) + ', ' + p.lng.toFixed(5) + ' (Googleマップ)</a></div></div>';
                    L.marker([p.lat, p.lng], opt).addTo(fg).bindPopup(html);
                }
            });
            if(fg.getLayers().length > 0) map.fitBounds(fg.getBounds(), {padding:[30,30]});
        }
        const sortedDates = [...new Set(pData.map(p => p.date))].sort();
        function addRow(container, id, label, isFirst) {
            const d = document.createElement('div'); d.className='row';
            const checked = isFirst ? 'checked' : '';
            d.innerHTML = '<input type="checkbox" class="cb" value="'+id+'" '+checked+' style="margin-right:10px;"> <span>' + label + '</span>';
            d.onclick = (e) => { if(e.target.tagName !== "INPUT") { const c=d.querySelector('.cb'); c.checked=!c.checked; } refresh(); };
            container.appendChild(d);
        }
        sortedDates.forEach((d, i) => addRow(document.getElementById('date-list'), "DATE_"+d, d, i===0));
        rData.forEach((r, i) => addRow(document.getElementById('gpx-list'), "GPX_"+r.name, r.name, i===0));
        refresh();
    </script>
</body>
</html>
