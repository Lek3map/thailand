markers[0] = L.marker([16.055795, 103.65942], {icon: icon_start_png}).addTo(markerGroup).bindPopup("<div style='width:250px;'><a href='https://note.com/raplom/n/nb5faf62f66ea' target='_blank'><img src='https://assets.st-note.com/production/uploads/images/252977086/rectangle_large_type_2_782191cf14f13d37a99cf2f0eda6c5dc.jpeg?width=1280' style='width:100%; border-radius:4px;'></a><h3 style='margin:10px 0 5px 0;'>出発</h3><div style='color:#666; font-size:1.1em;'>ロイエット</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=16.055795,103.65942' target='_blank' style='font-weight:bold;'>📍 Google Maps</a></div>");


if (pathPoints.length > 0) {
    var polyline = L.polyline(pathPoints, {color: '#ff0000', weight: 4, opacity: 0.8}).addTo(map);
    map.fitBounds(polyline.getBounds(), {padding: [30, 30]});
} else if (Object.keys(markers).length > 0) {
    map.fitBounds(markerGroup.getBounds(), {padding: [50, 50]});
} else {

}

function moveToMarker(id) { 
    var m = markers[id]; 
    if(m) { map.flyTo(m.getLatLng(), 15); m.openPopup(); }
