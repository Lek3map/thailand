<!DOCTYPE html>
<html lang='ja'>
<head>
<meta charset='utf-8'>
<meta property="og:title" content="2012年06月07日の地図日記">
<meta property="og:image" content="https://lek3map.github.io/thailand/picture/hyoushi_note.png">
<meta property="og:type" content="website">
<title>2012年06月07日の地図日記</title>
<link rel='stylesheet' href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css' />
<script src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'></script>
<style>
    body { display: flex; height: 100vh; margin: 0; background: #111; font-family: sans-serif; }
    #map { flex: 1; }
    #sidebar { width: 200px; overflow-y: auto; background: #111; padding: 10px; border-left: 1px solid #333; }
    .photo-thumb { margin-bottom: 10px; cursor: pointer; border: 2px solid transparent; }
    .photo-thumb:hover { border-color: #007bff; }
    .photo-thumb img { width: 100%; border-radius: 4px; display: block; }
</style>
</head>
<body>
<div id='map'></div>
<div id='sidebar'><div style='color:white; text-align:center; margin-bottom:15px;'>2012年06月07日</div><div class='photo-thumb' onclick='moveToMarker(0)'><img src='https://lh6.googleusercontent.com/-aBEZUDcYvEM/T9fK81tHX1I/AAAAAAAAHMk/s6tNFUs1NxA/s680/DSC03421.JPG' title='Plau Pantai Surin'></div>
<div class='photo-thumb' onclick='moveToMarker(1)'><img src='https://1.bp.blogspot.com/-TY6HICtH70A/YSItzxZQORI/AAAAAAAH220/3-oen1NMYxYO_B6CnrIQHWSPOm7EPb9rACLcBGAsYHQ/s680/120607066.jpg' title='影絵'></div>
<div class='photo-thumb' onclick='moveToMarker(2)'><img src='https://lh4.googleusercontent.com/--9dc4XSoeRc/T9fWszxZjII/AAAAAAAAHY0/P9p2q6Oove0/s680/DSC03503.JPG' title='シティ・カテジャ・マーケット'></div>
<div class='photo-thumb' onclick='moveToMarker(3)'><img src='https://lh5.googleusercontent.com/-jZ3SCIgD6wM/T9fbA8O--gI/AAAAAAAAHXk/Bkc8MiNpUSE/s680/DSC03515.JPG' title='機織'></div>
<div class='photo-thumb' onclick='moveToMarker(4)'><img src='https://1.bp.blogspot.com/-Rp2nPayZoPA/YSIouvTSmhI/AAAAAAAH20Q/DuG_9wRupqMXNJSTtDGb2S_3A95DifNdgCLcBGAsYHQ/s680/120607102.jpg' title='Pantai Cahaya Bulan'></div>
</div>
<script>
var map = L.map('map');
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

var markers = {};
var markerGroup = L.featureGroup().addTo(map);
var pathPoints = [];


                var icon_starr_png = L.icon({
                    iconUrl: 'https://lek3map.github.io/thailand/icon/starr.png',
                    iconSize: [30, 30],
                    iconAnchor: [15, 30],
                    popupAnchor: [0, -30]
                });
                var icon_market_png = L.icon({
                    iconUrl: 'https://lek3map.github.io/thailand/icon/market.png',
                    iconSize: [30, 30],
                    iconAnchor: [15, 30],
                    popupAnchor: [0, -30]
                });
                var icon_other_png = L.icon({
                    iconUrl: 'https://lek3map.github.io/thailand/icon/other.png',
                    iconSize: [30, 30],
                    iconAnchor: [15, 30],
                    popupAnchor: [0, -30]
                });
markers[0] = L.marker([6.18727, 102.228577], {icon: icon_starr_png}).addTo(markerGroup).bindPopup("<div style='width:250px;'><a href='https://photos.app.goo.gl/9dhDvqbwLgRvN17G7' target='_blank'><img src='https://lh6.googleusercontent.com/-aBEZUDcYvEM/T9fK81tHX1I/AAAAAAAAHMk/s6tNFUs1NxA/s680/DSC03421.JPG' style='width:100%; border-radius:4px;'></a><h3 style='margin:10px 0 5px 0;'>Plau Pantai Surin</h3><div style='color:#666; font-size:1.1em;'>コタバル</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=6.18727,102.228577' target='_blank' style='font-weight:bold;'>📍 Google Maps</a></div>");
markers[1] = L.marker([6.156048, 102.230917], {icon: icon_starr_png}).addTo(markerGroup).bindPopup("<div style='width:250px;'><a href='https://photos.app.goo.gl/dzEh5ES6vT3wWBJj8' target='_blank'><img src='https://1.bp.blogspot.com/-TY6HICtH70A/YSItzxZQORI/AAAAAAAH220/3-oen1NMYxYO_B6CnrIQHWSPOm7EPb9rACLcBGAsYHQ/s680/120607066.jpg' style='width:100%; border-radius:4px;'></a><h3 style='margin:10px 0 5px 0;'>影絵</h3><div style='color:#666; font-size:1.1em;'>コタバル</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=6.156048,102.230917' target='_blank' style='font-weight:bold;'>📍 Google Maps</a></div>");
markers[2] = L.marker([6.130018, 102.239263], {icon: icon_market_png}).addTo(markerGroup).bindPopup("<div style='width:250px;'><a href='https://photos.app.goo.gl/ayUTvHJE1CWFZwxV9' target='_blank'><img src='https://lh4.googleusercontent.com/--9dc4XSoeRc/T9fWszxZjII/AAAAAAAAHY0/P9p2q6Oove0/s680/DSC03503.JPG' style='width:100%; border-radius:4px;'></a><h3 style='margin:10px 0 5px 0;'>シティ・カテジャ・マーケット</h3><div style='color:#666; font-size:1.1em;'>コタバル</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=6.130018,102.239263' target='_blank' style='font-weight:bold;'>📍 Google Maps</a></div>");
markers[3] = L.marker([6.145185, 102.237152], {icon: icon_other_png}).addTo(markerGroup).bindPopup("<div style='width:250px;'><a href='https://photos.app.goo.gl/xsX8pav6cGJnRty5A' target='_blank'><img src='https://lh5.googleusercontent.com/-jZ3SCIgD6wM/T9fbA8O--gI/AAAAAAAAHXk/Bkc8MiNpUSE/s680/DSC03515.JPG' style='width:100%; border-radius:4px;'></a><h3 style='margin:10px 0 5px 0;'>機織</h3><div style='color:#666; font-size:1.1em;'>コタバル</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=6.145185,102.237152' target='_blank' style='font-weight:bold;'>📍 Google Maps</a></div>");
markers[4] = L.marker([6.196536, 102.27376], {icon: icon_starr_png}).addTo(markerGroup).bindPopup("<div style='width:250px;'><a href='https://photos.app.goo.gl/5oKv2s5tQBE3yFiX8' target='_blank'><img src='https://1.bp.blogspot.com/-Rp2nPayZoPA/YSIouvTSmhI/AAAAAAAH20Q/DuG_9wRupqMXNJSTtDGb2S_3A95DifNdgCLcBGAsYHQ/s680/120607102.jpg' style='width:100%; border-radius:4px;'></a><h3 style='margin:10px 0 5px 0;'>Pantai Cahaya Bulan</h3><div style='color:#666; font-size:1.1em;'>コタバル</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=6.196536,102.27376' target='_blank' style='font-weight:bold;'>📍 Google Maps</a></div>");


if (pathPoints.length > 0) {
    var polyline = L.polyline(pathPoints, {color: '#ff0000', weight: 4, opacity: 0.8}).addTo(map);
    map.fitBounds(polyline.getBounds(), {padding: [30, 30]});
} else if (Object.keys(markers).length > 0) {
    map.fitBounds(markerGroup.getBounds(), {padding: [50, 50]});
} else {
    map.setView([13.7563, 100.5018], 6);
}

function moveToMarker(id) { 
    var m = markers[id]; 
    if(m) { map.flyTo(m.getLatLng(), 15); m.openPopup(); } 
}
</script>
</body>
</html>
