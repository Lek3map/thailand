<!DOCTYPE html>
<html lang='ja'>
<head>
<meta charset='utf-8'>
<meta property="og:title" content="2012年12月27日の地図日記">
<meta property="og:image" content="https://lek3map.github.io/thailand/picture/hyoushi_note.png">
<meta property="og:type" content="website">
<title>2012年12月27日の地図日記</title>
<link rel='stylesheet' href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css' />
<script src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'></script>
<style>
    body { display: flex; height: 100vh; margin: 0; background: #111; font-family: sans-serif; }
    #map { flex: 1; }
    #sidebar { width: 200px; overflow-y: auto; background: #111; padding: 10px; border-left: 1px solid #333; }
    .photo-thumb { margin-bottom: 10px; cursor: pointer; border: 2px solid transparent; }
    .photo-thumb:hover { border-color: #007bff; }
    .photo-thumb img { width: 100%; border-radius: 4px; display: block; }
</style>
</head>
<body>
<div id='map'></div>
<div id='sidebar'><div style='color:white; text-align:center; margin-bottom:15px;'>2012年12月27日</div><div class='photo-thumb' onclick='moveToMarker(0)'><img src='https://lek3map.github.io/thailand/picture/kuruma.jpg' title='出発地'></div>
</div>
<script>
var map = L.map('map');
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

var markers = {};
var markerGroup = L.featureGroup().addTo(map);
var pathPoints = [[15.1428683, 98.4435267], [15.1421, 98.4450683], [15.14242, 98.445165], [15.142525, 98.44517], [15.146675, 98.4454783], [15.1482133, 98.4463383], [15.1500733, 98.4459217], [15.1521133, 98.4452317], [15.15382, 98.4451767], [15.1544983, 98.44706], [15.1552217, 98.4480633], [15.1560833, 98.449395], [15.155625, 98.4498817], [15.1552733, 98.4501617], [15.1542483, 98.45088], [15.1538917, 98.4505183], [15.1525333, 98.4501583], [15.1512333, 98.4503017], [15.1501183, 98.4503083], [15.148575, 98.4502617], [15.1476167, 98.450215], [15.1473567, 98.4498867], [15.1546383, 98.4506], [15.15453, 98.4506433], [15.1552083, 98.4501483], [15.1557633, 98.4497083], [15.156095, 98.449285], [15.155455, 98.44843], [15.1543833, 98.4472467], [15.153925, 98.44578], [15.153755, 98.4450583], [15.1523483, 98.445205]];


                var icon_start_png = L.icon({
                    iconUrl: 'https://lek3map.github.io/thailand/icon/start.png',
                    iconSize: [30, 30],
                    iconAnchor: [15, 30],
                    popupAnchor: [0, -30]
                });
markers[0] = L.marker([15.142868, 98.443527], {icon: icon_start_png}).addTo(markerGroup).bindPopup("<div style='width:250px;'><a href='https://lek3map.github.io/thailand/picture/kuruma.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/picture/kuruma.jpg' style='width:100%; border-radius:4px;'></a><h3 style='margin:10px 0 5px 0;'>出発地</h3><div style='color:#666; font-size:1.1em;'>カンチャナブリ</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=15.142868,98.443527' target='_blank' style='font-weight:bold;'>📍 Google Maps</a></div>");


if (pathPoints.length > 0) {
    var polyline = L.polyline(pathPoints, {color: '#ff0000', weight: 4, opacity: 0.8}).addTo(map);
    map.fitBounds(polyline.getBounds(), {padding: [30, 30]});
} else if (Object.keys(markers).length > 0) {
    map.fitBounds(markerGroup.getBounds(), {padding: [50, 50]});
} else {
    map.setView([13.7563, 100.5018], 6);
}

function moveToMarker(id) { 
    var m = markers[id]; 
    if(m) { map.flyTo(m.getLatLng(), 15); m.openPopup(); } 
}
</script>
</body>
</html>
