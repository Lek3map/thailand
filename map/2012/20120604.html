                    iconUrl: 'https://lek3map.github.io/thailand/icon/plane.png',
                    iconSize: [30, 30],
                    iconAnchor: [15, 30],
                    popupAnchor: [0, -30]
                });
markers[0] = L.marker([5.446793, 101.134987], {icon: icon_start_png}).addTo(markerGroup).bindPopup("<div style='width:250px;'><a href='https://lek3map.github.io/thailand/picture/bike.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/picture/bike.jpg' style='width:100%; border-radius:4px;'></a><h3 style='margin:10px 0 5px 0;'>出発地</h3><div style='color:#666; font-size:1.1em;'>ゲリック</div><div style='font-size:1.1em; color:#333; margin:10px 0;'>マレーシアのコタバルで開かれる国際凧揚げ大会に行きます</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=5.446793,101.134987' target='_blank' style='font-weight:bold;'>📍 Google Maps</a></div>");
markers[1] = L.marker([5.543726, 101.330432], {icon: icon_monument_png}).addTo(markerGroup).bindPopup("<div style='width:250px;'><a href='https://photos.app.goo.gl/QzSBkqnwP46VVt2b9' target='_blank'><img src='https://lh6.googleusercontent.com/-bUn3CBT1sw0/T80d7uS6_WI/AAAAAAAAGfY/aab1KvQGwCc/s680/DSCN7062.JPG' style='width:100%; border-radius:4px;'></a><h3 style='margin:10px 0 5px 0;'>モニュメント</h3><div style='color:#666; font-size:1.1em;'>ゲリック</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=5.543726,101.330432' target='_blank' style='font-weight:bold;'>📍 Google Maps</a></div>");
markers[2] = L.marker([6.171257, 102.290521], {icon: icon_plane_png}).addTo(markerGroup).bindPopup("<div style='width:250px;'><a href='https://photos.app.goo.gl/ovHJTZDvLxQB1cqX6' target='_blank'><img src='https://lh3.googleusercontent.com/-i8zbMxcWmLg/T80rRDOBOWI/AAAAAAAAbZA/EC236EUvMtk/s680/120604009.jpg' style='width:100%; border-radius:4px;'></a><h3 style='margin:10px 0 5px 0;'>コタバル空港</h3><div style='color:#666; font-size:1.1em;'>コタバル</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=6.171257,102.290521' target='_blank' style='font-weight:bold;'>📍 Google Maps</a></div>");


if (pathPoints.length > 0) {
    var polyline = L.polyline(pathPoints, {color: '#ff0000', weight: 4, opacity: 0.8}).addTo(map);
    map.fitBounds(polyline.getBounds(), {padding: [30, 30]});
} else if (Object.keys(markers).length > 0) {
    map.fitBounds(markerGroup.getBounds(), {padding: [50, 50]});
} else {
    map.setView([13.7563, 100.5018], 6);
}

function moveToMarker(id) { 
    var m = markers[id]; 
    if(m) { map.flyTo(m.getLatLng(), 15); m.openPopup(); } 
}
</script>
