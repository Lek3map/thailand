<!DOCTYPE html>
<html lang='ja'>
<head>
<meta charset='utf-8'>
<meta property="og:title" content="2010年09月03日の地図日記">
<meta property="og:image" content="https://lek3map.github.io/thailand/picture/hyoushi_note.png">
<meta property="og:type" content="website">
<title>2010年09月03日の地図日記</title>
<link rel='stylesheet' href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css' />
<script src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'></script>
<style>
    body { display: flex; height: 100vh; margin: 0; background: #111; font-family: sans-serif; }
    #map { flex: 1; }
    #sidebar { width: 200px; overflow-y: auto; background: #111; padding: 10px; border-left: 1px solid #333; }
    .photo-thumb { margin-bottom: 10px; cursor: pointer; border: 2px solid transparent; }
    .photo-thumb:hover { border-color: #007bff; }
    .photo-thumb img { width: 100%; border-radius: 4px; display: block; }
</style>
</head>
<body>
<div id='map'></div>
<div id='sidebar'><div style='color:white; text-align:center; margin-bottom:15px;'>2010年09月03日</div><div class='photo-thumb' onclick='moveToMarker(0)'><img src='http://lh5.ggpht.com/_5jLw98T_xQ4/TINttFKx3wI/AAAAAAAABEs/Oh_hqbdLoFI/s680/100903004.jpg' title='King Rama Ⅵ Monument'></div>
<div class='photo-thumb' onclick='moveToMarker(1)'><img src='https://lh6.googleusercontent.com/-QdxxQVx9V_U/TINtrLL2VlI/AAAAAAAABEk/ZMmxIwfsNSE/s680/100903001.jpg' title='Lumphini Park'></div>
<div class='photo-thumb' onclick='moveToMarker(2)'><img src='http://lh5.ggpht.com/_M674G_dhxK8/TIYecUfhx5I/AAAAAAAAB_k/6OHN_CkIS1c/s680/100903013.jpg' title='Embassy of Japan'></div>
</div>
<script>
var map = L.map('map');
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

var markers = {};
var markerGroup = L.featureGroup().addTo(map);
var pathPoints = [];


                var icon_monument_png = L.icon({
                    iconUrl: 'https://lek3map.github.io/thailand/icon/monument.png',
                    iconSize: [30, 30],
                    iconAnchor: [15, 30],
                    popupAnchor: [0, -30]
                });
                var icon_parks_png = L.icon({
                    iconUrl: 'https://lek3map.github.io/thailand/icon/parks.png',
                    iconSize: [30, 30],
                    iconAnchor: [15, 30],
                    popupAnchor: [0, -30]
                });
                var icon_yakata_png = L.icon({
                    iconUrl: 'https://lek3map.github.io/thailand/icon/yakata.png',
                    iconSize: [30, 30],
                    iconAnchor: [15, 30],
                    popupAnchor: [0, -30]
                });
markers[0] = L.marker([13.729974, 100.537648], {icon: icon_monument_png}).addTo(markerGroup).bindPopup("<div style='width:250px;'><a href='http://lh5.ggpht.com/_5jLw98T_xQ4/TINttFKx3wI/AAAAAAAABEs/Oh_hqbdLoFI/s1600/100903004.jpg' target='_blank'><img src='http://lh5.ggpht.com/_5jLw98T_xQ4/TINttFKx3wI/AAAAAAAABEs/Oh_hqbdLoFI/s680/100903004.jpg' style='width:100%; border-radius:4px;'></a><h3 style='margin:10px 0 5px 0;'>King Rama Ⅵ Monument</h3><div style='color:#666; font-size:1.1em;'>バンコク</div><div style='font-size:1.1em; color:#333; margin:10px 0;'>ラーマⅥ世像:プラ・モンクットクラオ 1881年-1925年  王位：1910年-1925年</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=13.729974,100.537648' target='_blank' style='font-weight:bold;'>📍 Google Maps</a></div>");
markers[1] = L.marker([13.730797, 100.541403], {icon: icon_parks_png}).addTo(markerGroup).bindPopup("<div style='width:250px;'><a href='https://goo.gl/photos/VPrtXze9R8UMGpg97' target='_blank'><img src='https://lh6.googleusercontent.com/-QdxxQVx9V_U/TINtrLL2VlI/AAAAAAAABEk/ZMmxIwfsNSE/s680/100903001.jpg' style='width:100%; border-radius:4px;'></a><h3 style='margin:10px 0 5px 0;'>Lumphini Park</h3><div style='color:#666; font-size:1.1em;'>バンコク</div><div style='font-size:1.1em; color:#333; margin:10px 0;'>ルンピニ公園</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=13.730797,100.541403' target='_blank' style='font-weight:bold;'>📍 Google Maps</a></div>");
markers[2] = L.marker([13.729453, 100.545684], {icon: icon_yakata_png}).addTo(markerGroup).bindPopup("<div style='width:250px;'><a href='http://lh5.ggpht.com/_M674G_dhxK8/TIYecUfhx5I/AAAAAAAAB_k/6OHN_CkIS1c/s1600/100903013.jpg' target='_blank'><img src='http://lh5.ggpht.com/_M674G_dhxK8/TIYecUfhx5I/AAAAAAAAB_k/6OHN_CkIS1c/s680/100903013.jpg' style='width:100%; border-radius:4px;'></a><h3 style='margin:10px 0 5px 0;'>Embassy of Japan</h3><div style='color:#666; font-size:1.1em;'>バンコク</div><div style='font-size:1.1em; color:#333; margin:10px 0;'>日本大使館</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=13.729453,100.545684' target='_blank' style='font-weight:bold;'>📍 Google Maps</a></div>");


if (pathPoints.length > 0) {
    var polyline = L.polyline(pathPoints, {color: '#ff0000', weight: 4, opacity: 0.8}).addTo(map);
    map.fitBounds(polyline.getBounds(), {padding: [30, 30]});
} else if (Object.keys(markers).length > 0) {
    map.fitBounds(markerGroup.getBounds(), {padding: [50, 50]});
} else {
    map.setView([13.7563, 100.5018], 6);
}

function moveToMarker(id) { 
    var m = markers[id]; 
    if(m) { map.flyTo(m.getLatLng(), 15); m.openPopup(); } 
}
</script>
</body>
</html>
