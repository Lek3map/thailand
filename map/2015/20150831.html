<!DOCTYPE html>
<html lang='ja'>
<head>
<meta charset='utf-8'>
<meta property="og:title" content="2015年08月31日の地図日記">
<meta property="og:image" content="https://lek3map.github.io/thailand/picture/hyoushi_note.png">
<meta property="og:type" content="website">
<title>2015年08月31日の地図日記</title>
<link rel='stylesheet' href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css' />
<script src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'></script>
<style>
    body { display: flex; height: 100vh; margin: 0; background: #111; font-family: sans-serif; }
    #map { flex: 1; }
    #sidebar { width: 200px; overflow-y: auto; background: #111; padding: 10px; border-left: 1px solid #333; }
    .photo-thumb { margin-bottom: 10px; cursor: pointer; border: 2px solid transparent; }
    .photo-thumb:hover { border-color: #007bff; }
    .photo-thumb img { width: 100%; border-radius: 4px; display: block; }
</style>
</head>
<body>
<div id='map'></div>
<div id='sidebar'><div style='color:white; text-align:center; margin-bottom:15px;'>2015年08月31日</div><div class='photo-thumb' onclick='moveToMarker(0)'><img src='https://lek3map.github.io/thailand/picture/aruki.png' title='出発地'></div>
</div>
<script>
var map = L.map('map');
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

var markers = {};
var markerGroup = L.featureGroup().addTo(map);
var pathPoints = [[35.23235666666667, 139.103595], [35.23197666666667, 139.10342666666668], [35.232625, 139.10458333333332], [35.23266, 139.10439333333332], [35.23279333333333, 139.104425], [35.23276166666667, 139.10435833333332], [35.23287833333333, 139.10429166666665], [35.232855, 139.10438], [35.23262666666667, 139.10455], [35.232796666666665, 139.10455333333334], [35.232836666666664, 139.104555], [35.232665, 139.10463666666666], [35.232705, 139.10464166666668], [35.23267166666667, 139.10465666666667], [35.232713333333336, 139.10481833333333], [35.2327, 139.10479], [35.232705, 139.10478666666666], [35.232695, 139.10486833333334]];


                var icon_start_png = L.icon({
                    iconUrl: 'https://lek3map.github.io/thailand/icon/start.png',
                    iconSize: [30, 30],
                    iconAnchor: [15, 30],
                    popupAnchor: [0, -30]
                });
markers[0] = L.marker([35.232357, 139.103595], {icon: icon_start_png}).addTo(markerGroup).bindPopup("<div style='width:250px;'><a href='https://lek3map.github.io/thailand/picture/aruki.png' target='_blank'><img src='https://lek3map.github.io/thailand/picture/aruki.png' style='width:100%; border-radius:4px;'></a><h3 style='margin:10px 0 5px 0;'>出発地</h3><div style='color:#666; font-size:1.1em;'>箱根</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=35.232357,139.103595' target='_blank' style='font-weight:bold;'>📍 Google Maps</a></div>");


if (pathPoints.length > 0) {
    var polyline = L.polyline(pathPoints, {color: '#ff0000', weight: 4, opacity: 0.8}).addTo(map);
    map.fitBounds(polyline.getBounds(), {padding: [30, 30]});
} else if (Object.keys(markers).length > 0) {
    map.fitBounds(markerGroup.getBounds(), {padding: [50, 50]});
} else {
    map.setView([13.7563, 100.5018], 6);
}

function moveToMarker(id) { 
    var m = markers[id]; 
    if(m) { map.flyTo(m.getLatLng(), 15); m.openPopup(); } 
}
</script>
</body>
</html>
