<!DOCTYPE html>
<html lang='ja'>
<head>
<meta charset='utf-8'>
<meta property="og:title" content="2015年08月19日の地図日記">
<meta property="og:image" content="https://lek3map.github.io/thailand/picture/hyoushi_note.png">
<meta property="og:type" content="website">
<title>2015年08月19日の地図日記</title>
<link rel='stylesheet' href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css' />
<script src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'></script>
<style>
    body { display: flex; height: 100vh; margin: 0; background: #111; font-family: sans-serif; }
    #map { flex: 1; }
    #sidebar { width: 200px; overflow-y: auto; background: #111; padding: 10px; border-left: 1px solid #333; }
    .photo-thumb { margin-bottom: 10px; cursor: pointer; border: 2px solid transparent; }
    .photo-thumb:hover { border-color: #007bff; }
    .photo-thumb img { width: 100%; border-radius: 4px; display: block; }
</style>
</head>
<body>
<div id='map'></div>
<div id='sidebar'><div style='color:white; text-align:center; margin-bottom:15px;'>2015年08月19日</div><div class='photo-thumb' onclick='moveToMarker(0)'><img src='https://lek3map.github.io/thailand/picture/kuruma.jpg' title='出発地'></div>
</div>
<script>
var map = L.map('map');
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

var markers = {};
var markerGroup = L.featureGroup().addTo(map);
var pathPoints = [[15.884065, 104.07508666666666], [15.886725, 104.073775], [15.889793333333333, 104.07228833333333], [15.89298, 104.07084833333333], [15.895665, 104.06962833333333], [15.897761666666666, 104.06866], [15.901071666666667, 104.06714], [15.902713333333333, 104.06641333333333], [15.904813333333333, 104.065455], [15.906096666666667, 104.06488666666667], [15.90703, 104.06437333333334], [15.907171666666667, 104.06443333333333], [15.907133333333332, 104.06448166666667], [15.90718, 104.06451], [15.907258333333333, 104.06458333333333], [15.907225, 104.06459166666667], [15.907246666666667, 104.06470166666666], [15.907376666666666, 104.06496666666666], [15.90753, 104.06529], [15.907656666666666, 104.06565333333333], [15.907708333333334, 104.065845], [15.907833333333333, 104.06552333333333], [15.907328333333334, 104.06508], [15.907273333333332, 104.06452666666667], [15.908705, 104.06376333333333]];


                var icon_start_png = L.icon({
                    iconUrl: 'https://lek3map.github.io/thailand/icon/start.png',
                    iconSize: [30, 30],
                    iconAnchor: [15, 30],
                    popupAnchor: [0, -30]
                });
markers[0] = L.marker([15.884065, 104.075087], {icon: icon_start_png}).addTo(markerGroup).bindPopup("<div style='width:250px;'><a href='https://lek3map.github.io/thailand/picture/kuruma.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/picture/kuruma.jpg' style='width:100%; border-radius:4px;'></a><h3 style='margin:10px 0 5px 0;'>出発地</h3><div style='color:#666; font-size:1.1em;'>ヤソートン</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=15.884065,104.075087' target='_blank' style='font-weight:bold;'>📍 Google Maps</a></div>");


if (pathPoints.length > 0) {
    var polyline = L.polyline(pathPoints, {color: '#ff0000', weight: 4, opacity: 0.8}).addTo(map);
    map.fitBounds(polyline.getBounds(), {padding: [30, 30]});
} else if (Object.keys(markers).length > 0) {
    map.fitBounds(markerGroup.getBounds(), {padding: [50, 50]});
} else {
    map.setView([13.7563, 100.5018], 6);
}

function moveToMarker(id) { 
    var m = markers[id]; 
    if(m) { map.flyTo(m.getLatLng(), 15); m.openPopup(); } 
}
</script>
</body>
</html>
