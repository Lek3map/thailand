<!DOCTYPE html>
<html lang='ja'>
<head>
<meta charset='utf-8'>
<meta property="og:title" content="2015年12月26日の地図日記">
<meta property="og:image" content="https://lek3map.github.io/thailand/picture/hyoushi_note.png">
<meta property="og:type" content="website">
<title>2015年12月26日の地図日記</title>
<link rel='stylesheet' href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css' />
<script src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'></script>
<style>
    body { display: flex; height: 100vh; margin: 0; background: #111; font-family: sans-serif; }
    #map { flex: 1; }
    #sidebar { width: 200px; overflow-y: auto; background: #111; padding: 10px; border-left: 1px solid #333; }
    .photo-thumb { margin-bottom: 10px; cursor: pointer; border: 2px solid transparent; }
    .photo-thumb:hover { border-color: #007bff; }
    .photo-thumb img { width: 100%; border-radius: 4px; display: block; }
</style>
</head>
<body>
<div id='map'></div>
<div id='sidebar'><div style='color:white; text-align:center; margin-bottom:15px;'>2015年12月26日</div><div class='photo-thumb' onclick='moveToMarker(0)'><img src='https://lek3map.github.io/thailand/picture/aruki.png' title='出発地'></div>
</div>
<script>
var map = L.map('map');
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

var markers = {};
var markerGroup = L.featureGroup().addTo(map);
var pathPoints = [[35.32630666666667, 139.58089833333332], [35.32632, 139.580915], [35.32628, 139.58089166666667], [35.32626333333333, 139.58088], [35.32640833333333, 139.5809], [35.326418333333336, 139.58091], [35.32639666666667, 139.58089666666666], [35.326386666666664, 139.58090166666668], [35.32633166666667, 139.58089166666667], [35.32637666666667, 139.580885], [35.326275, 139.58088166666667], [35.326145, 139.58087], [35.32601833333333, 139.58092166666665], [35.326526666666666, 139.580925], [35.32631833333333, 139.58091666666667], [35.32628, 139.58092166666665], [35.326295, 139.58091333333334], [35.32637166666667, 139.580915], [35.32635333333333, 139.58090833333333], [35.32623, 139.58088333333333], [35.32622666666666, 139.58087], [35.326146666666666, 139.58086166666666], [35.32632, 139.58088], [35.326295, 139.58089], [35.32622833333333, 139.5809], [35.32628166666667, 139.58087666666665], [35.326296666666664, 139.58089], [35.326296666666664, 139.580885], [35.326213333333335, 139.58091], [35.326033333333335, 139.58087], [35.326096666666665, 139.58079833333332], [35.326045, 139.58074333333334]];


                var icon_start_png = L.icon({
                    iconUrl: 'https://lek3map.github.io/thailand/icon/start.png',
                    iconSize: [30, 30],
                    iconAnchor: [15, 30],
                    popupAnchor: [0, -30]
                });
markers[0] = L.marker([35.326307, 139.580898], {icon: icon_start_png}).addTo(markerGroup).bindPopup("<div style='width:250px;'><a href='https://lek3map.github.io/thailand/picture/aruki.png' target='_blank'><img src='https://lek3map.github.io/thailand/picture/aruki.png' style='width:100%; border-radius:4px;'></a><h3 style='margin:10px 0 5px 0;'>出発地</h3><div style='color:#666; font-size:1.1em;'>鎌倉</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=35.326307,139.580898' target='_blank' style='font-weight:bold;'>📍 Google Maps</a></div>");


if (pathPoints.length > 0) {
    var polyline = L.polyline(pathPoints, {color: '#ff0000', weight: 4, opacity: 0.8}).addTo(map);
    map.fitBounds(polyline.getBounds(), {padding: [30, 30]});
} else if (Object.keys(markers).length > 0) {
    map.fitBounds(markerGroup.getBounds(), {padding: [50, 50]});
} else {
    map.setView([13.7563, 100.5018], 6);
}

function moveToMarker(id) { 
    var m = markers[id]; 
    if(m) { map.flyTo(m.getLatLng(), 15); m.openPopup(); } 
}
</script>
</body>
</html>
