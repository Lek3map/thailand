<!DOCTYPE html>
<html lang='ja'>
<head>
<meta charset='utf-8'>
<meta property="og:title" content="2015年05月28日の地図日記">
<meta property="og:image" content="https://lek3map.github.io/thailand/picture/hyoushi_note.png">
<meta property="og:type" content="website">
<title>2015年05月28日の地図日記</title>
<link rel='stylesheet' href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css' />
<script src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'></script>
<style>
    body { display: flex; height: 100vh; margin: 0; background: #111; font-family: sans-serif; }
    #map { flex: 1; }
    #sidebar { width: 200px; overflow-y: auto; background: #111; padding: 10px; border-left: 1px solid #333; }
    .photo-thumb { margin-bottom: 10px; cursor: pointer; border: 2px solid transparent; }
    .photo-thumb:hover { border-color: #007bff; }
    .photo-thumb img { width: 100%; border-radius: 4px; display: block; }
</style>
</head>
<body>
<div id='map'></div>
<div id='sidebar'><div style='color:white; text-align:center; margin-bottom:15px;'>2015年05月28日</div><div class='photo-thumb' onclick='moveToMarker(0)'><img src='https://1.bp.blogspot.com/-KwzBKirnW_U/YKzJ7VYvnrI/AAAAAAAGhCk/oimP-HDO4r8DrDK2VoKNS2DqAH-v-6PcgCLcBGAsYHQ/s680/150528001.jpg' title='電話交換創始之地'></div>
<div class='photo-thumb' onclick='moveToMarker(1)'><img src='https://1.bp.blogspot.com/-5rvXyj0Fgzs/YMfB_BIsV-I/AAAAAAAGn-U/PFCA_6q67OAtWf3AC4h4k1ZzQH3azgT8ACLcBGAsYHQ/s680/150528003.jpg' title='旧居留地消防隊地下貯水槽遺構'></div>
<div class='photo-thumb' onclick='moveToMarker(2)'><img src='https://1.bp.blogspot.com/-H08RRnSBUFg/YMfFxWlnvtI/AAAAAAAGn_A/1nMQC7oLDAsSRqdng_SfV_OOJHaTcBjxgCLcBGAsYHQ/s680/150528010.jpg' title='横浜公園の碑'></div>
<div class='photo-thumb' onclick='moveToMarker(3)'><img src='https://1.bp.blogspot.com/-H08RRnSBUFg/YMfFxWlnvtI/AAAAAAAGn_A/1nMQC7oLDAsSRqdng_SfV_OOJHaTcBjxgCLcBGAsYHQ/s680/150528010.jpg' title='岩亀楼の石灯篭'></div>
</div>
<script>
var map = L.map('map');
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

var markers = {};
var markerGroup = L.featureGroup().addTo(map);
var pathPoints = [];


                var icon_sekihi_png = L.icon({
                    iconUrl: 'https://lek3map.github.io/thailand/icon/sekihi.png',
                    iconSize: [30, 30],
                    iconAnchor: [15, 30],
                    popupAnchor: [0, -30]
                });
                var icon_starr_png = L.icon({
                    iconUrl: 'https://lek3map.github.io/thailand/icon/starr.png',
                    iconSize: [30, 30],
                    iconAnchor: [15, 30],
                    popupAnchor: [0, -30]
                });
markers[0] = L.marker([35.4465, 139.643875], {icon: icon_sekihi_png}).addTo(markerGroup).bindPopup("<div style='width:250px;'><a href='https://1.bp.blogspot.com/-KwzBKirnW_U/YKzJ7VYvnrI/AAAAAAAGhCk/oimP-HDO4r8DrDK2VoKNS2DqAH-v-6PcgCLcBGAsYHQ/s2048/150528001.jpg' target='_blank'><img src='https://1.bp.blogspot.com/-KwzBKirnW_U/YKzJ7VYvnrI/AAAAAAAGhCk/oimP-HDO4r8DrDK2VoKNS2DqAH-v-6PcgCLcBGAsYHQ/s680/150528001.jpg' style='width:100%; border-radius:4px;'></a><h3 style='margin:10px 0 5px 0;'>電話交換創始之地</h3><div style='color:#666; font-size:1.1em;'>神奈川県横浜市中区日本大通</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=35.4465,139.643875' target='_blank' style='font-weight:bold;'>📍 Google Maps</a></div>");
markers[1] = L.marker([35.444758, 139.642533], {icon: icon_sekihi_png}).addTo(markerGroup).bindPopup("<div style='width:250px;'><a href='https://photos.app.goo.gl/iTMVGuHJDcbbSqKd6' target='_blank'><img src='https://1.bp.blogspot.com/-5rvXyj0Fgzs/YMfB_BIsV-I/AAAAAAAGn-U/PFCA_6q67OAtWf3AC4h4k1ZzQH3azgT8ACLcBGAsYHQ/s680/150528003.jpg' style='width:100%; border-radius:4px;'></a><h3 style='margin:10px 0 5px 0;'>旧居留地消防隊地下貯水槽遺構</h3><div style='color:#666; font-size:1.1em;'>神奈川県横浜市中区日本大通</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=35.444758,139.642533' target='_blank' style='font-weight:bold;'>📍 Google Maps</a></div>");
markers[2] = L.marker([35.444125, 139.641372], {icon: icon_sekihi_png}).addTo(markerGroup).bindPopup("<div style='width:250px;'><a href='https://photos.app.goo.gl/uHMDb7Ggio3zhVDX6' target='_blank'><img src='https://1.bp.blogspot.com/-H08RRnSBUFg/YMfFxWlnvtI/AAAAAAAGn_A/1nMQC7oLDAsSRqdng_SfV_OOJHaTcBjxgCLcBGAsYHQ/s680/150528010.jpg' style='width:100%; border-radius:4px;'></a><h3 style='margin:10px 0 5px 0;'>横浜公園の碑</h3><div style='color:#666; font-size:1.1em;'>神奈川県横浜市中区横浜公園</div><div style='font-size:1.1em; color:#333; margin:10px 0;'>日本最古の公園</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=35.444125,139.641372' target='_blank' style='font-weight:bold;'>📍 Google Maps</a></div>");
markers[3] = L.marker([35.444142, 139.641128], {icon: icon_starr_png}).addTo(markerGroup).bindPopup("<div style='width:250px;'><a href='https://photos.app.goo.gl/WmJkKW1U26Bcbqmo6' target='_blank'><img src='https://1.bp.blogspot.com/-H08RRnSBUFg/YMfFxWlnvtI/AAAAAAAGn_A/1nMQC7oLDAsSRqdng_SfV_OOJHaTcBjxgCLcBGAsYHQ/s680/150528010.jpg' style='width:100%; border-radius:4px;'></a><h3 style='margin:10px 0 5px 0;'>岩亀楼の石灯篭</h3><div style='color:#666; font-size:1.1em;'>神奈川県横浜市中区横浜公園</div><div style='font-size:1.1em; color:#333; margin:10px 0;'>妙音寺から横浜市に寄贈された灯篭で、岩亀楼の文字から明治十七年に廃業した岩亀楼由来のものと思われ、震災、戦火で多くの文明開化期の遺物を失った横浜の貴重な文化財の一つ。</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=35.444142,139.641128' target='_blank' style='font-weight:bold;'>📍 Google Maps</a></div>");


if (pathPoints.length > 0) {
    var polyline = L.polyline(pathPoints, {color: '#ff0000', weight: 4, opacity: 0.8}).addTo(map);
    map.fitBounds(polyline.getBounds(), {padding: [30, 30]});
} else if (Object.keys(markers).length > 0) {
    map.fitBounds(markerGroup.getBounds(), {padding: [50, 50]});
} else {
    map.setView([13.7563, 100.5018], 6);
}

function moveToMarker(id) { 
    var m = markers[id]; 
    if(m) { map.flyTo(m.getLatLng(), 15); m.openPopup(); } 
}
</script>
</body>
</html>
