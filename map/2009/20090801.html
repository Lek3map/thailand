<!DOCTYPE html>
<html lang='ja'>
<head>
<meta charset='utf-8'>
<meta property="og:title" content="2009年8月1日の地図日記">
<meta property="og:type" content="website">
<title>2009年8月1日の地図日記</title>
<link rel='stylesheet' href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css' />
<script src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'></script>
<style>
    body { display: flex; height: 100vh; margin: 0; background: #111; font-family: sans-serif; }
    #map { flex: 1; }
    #sidebar { width: 200px; overflow-y: auto; background: #111; padding: 10px; border-left: 1px solid #333; }
    .photo-thumb { margin-bottom: 10px; cursor: pointer; border: 2px solid transparent; min-height: 40px; background: #222; }
    .photo-thumb:hover { border-color: #007bff; }
    .photo-thumb img { width: 100%; border-radius: 4px; display: block; }
    .thumb-label { color: #ccc; font-size: 12px; text-align: center; padding: 4px 2px; word-break: break-word; }
</style>
</head>
<body>
<div id='map'></div>
<div id='sidebar'><div style='color:white; text-align:center; margin-bottom:15px;'>2009年8月1日</div><div class='photo-thumb'><img src='https://lek3map.github.io/thailand/picture/kuruma.jpg' title='交通手段' alt='交通手段' onerror="this.style.display='none'"></div><div class='photo-thumb' onclick='moveToMarker(0)'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/090801004.jpg' title='Wat Suan Dok' alt='Wat Suan Dok' onerror="this.style.display='none'"><div class='thumb-label'>Wat Suan Dok</div></div><div class='photo-thumb' onclick='moveToMarker(1)'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/090801054.jpg' title='Wat Ched Yot' alt='Wat Ched Yot' onerror="this.style.display='none'"><div class='thumb-label'>Wat Ched Yot</div></div><div class='photo-thumb' onclick='moveToMarker(2)'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/090801079.jpg' title='Wat Ku Tao' alt='Wat Ku Tao' onerror="this.style.display='none'"><div class='thumb-label'>Wat Ku Tao</div></div><div class='photo-thumb' onclick='moveToMarker(3)'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/090801156.jpg' title='Road signs' alt='Road signs' onerror="this.style.display='none'"><div class='thumb-label'>Road signs</div></div></div>
<script>
var map = L.map('map');
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

var markers = {};
var markerGroup = L.featureGroup().addTo(map);
var pathPoints = [];

var icon_hyoushiki_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/hyoushiki.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
var icon_tera_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/tera.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
markers[0] = L.marker([18.788718, 98.967172], {icon: icon_tera_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Wat Suan Dok<br>วัดสวนดอก</h3><a href='https://goo.gl/photos/ajWqeY8R1EGmiMf8A' target='_blank'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/090801004.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>チェンマイ</div><div style='text-align:left; margin-top:8px;'>第三級王室仏教寺院</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=18.788718,98.967172' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=18.788718,98.967172&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[1] = L.marker([18.808818, 98.972011], {icon: icon_tera_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Wat Ched Yot<br>วัดเจ็ดยอด</h3><a href='https://photos.app.goo.gl/GV9EjnRcwGHvwpZi6' target='_blank'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/090801054.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>チェンマイ</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=18.808818,98.972011' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=18.808818,98.972011&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[2] = L.marker([18.80243, 98.988383], {icon: icon_tera_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Wat Ku Tao<br>วัดกู่เต้า</h3><a href='https://goo.gl/photos/Cae7vtjxUa99oxHs6' target='_blank'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/090801079.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>チェンマイ</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=18.80243,98.988383' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=18.80243,98.988383&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[3] = L.marker([18.795381, 98.98635], {icon: icon_hyoushiki_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Road signs</h3><a href='https://lek3map.github.io/thailand/map/2009/picture/090801156.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/090801156.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>チェンマイ</div><div style='text-align:left; margin-top:8px;'>道路標識</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=18.795381,98.98635' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=18.795381,98.98635&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");

if (pathPoints.length > 0) {
    var polyline = L.polyline(pathPoints, {color: '#ff0000', weight: 4, opacity: 0.8}).addTo(map);
    map.fitBounds(polyline.getBounds(), {padding: [30, 30]});
} else if (Object.keys(markers).length > 0) {
    map.fitBounds(markerGroup.getBounds(), {padding: [50, 50]});
} else {
    map.setView([13.7563, 100.5018], 6);
}

function moveToMarker(id) { 
    var m = markers[id]; 
    if(m) { map.flyTo(m.getLatLng(), 15); m.openPopup(); } 
}
</script>
</body>
</html>
