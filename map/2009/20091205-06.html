        const categoryMap = {"仏教寺院":"tera.png","中華寺院":"ctemp.png","回教寺院":"mosk.png","ヒンドゥ寺院":"hind.png","教会":"charch.png","ラク・ムアン":"lak.png","祈り・社・廟":"inori.png","空港":"plane.png","駅":"station.png","バスターミナル":"bus.png","桟橋":"fune.png","ウエルカムゲート":"gate.png","碑・石碑":"sekihi.png","博物館、～館":"yakata.png","遺跡":"iseki.png","洞窟":"tam.png","ダム":"dam.png","温泉":"onsen.png","郵便局":"postbox.png","モニュメント":"monument.png","時計台":"clock.png","街灯":"gaitou.png","道路標識":"hyoushiki.png","公園・～園":"parks.png","祭り・イベント":"matsuri.png","海・海岸":"beach.png","景勝地・物":"starr.png","市場":"market.png","国境":"border.png","噴水":"funsui.png","その他":"other.png","スタート":"start.png","墓":"hakab.png","ゴール":"end.png"};
        const ICON_BASE = "https://lek3map.github.io/thailand/icon/";
        const IMAGE_BASE = "https://lek3map.github.io/thailand/photo/";
        
        let fg = L.featureGroup().addTo(map);

        function refresh() {
            fg.clearLayers();
            const checked = Array.from(document.querySelectorAll('.cb:checked')).map(c => c.value);
            rData.forEach(r => { if(checked.includes("GPX_" + r.name)) L.polyline(r.pts, {color:'red', weight:3, opacity:0.7}).addTo(fg); });
            pData.forEach(p => {
                if(checked.includes("DATE_" + p.date)) {
                    let iconFile = "";
                    for(let k in categoryMap) { if((p.cat||"").includes(k) || (p.name||"").includes(k)) { iconFile=categoryMap[k]; break; } }
                    let opt = iconFile ? { icon: L.icon({ iconUrl: ICON_BASE + iconFile, iconSize:[32,32], iconAnchor:[16,32], popupAnchor:[0,-32] }) } : {};
                    
                    let imgHtml = "";
                    if(p.img) {
                        const imgPath = (String(p.img).startsWith('http')) ? p.img : IMAGE_BASE + p.img;
                        // アルバムURL(Excelの最後列の値)があればそちらを。なければ画像へ。
                        const linkUrl = p.album_url || imgPath;
                        imgHtml = '<a href="' + linkUrl + '" target="_blank"><img src="' + imgPath + '" class="popup-img" onerror="this.style.display=\'none\'"></a>';
                    }

                    const gmapUrl = "https://www.google.com/maps?q=" + p.lat + "," + p.lng;
                    let html = '<div class="popup-box">' +
                               '<div class="popup-top"><span class="name-ja">' + (p.name||"") + '</span>' + (p.tname ? '<span class="name-th">' + p.tname + '</span>' : '') + '</div>' +
                               imgHtml +
                               '<div class="popup-bottom">' + (p.pref ? '<b>県名:</b> ' + p.pref + '<br>' : '') + '<b>説明:</b> ' + (p.des || "-") + '</div>' +
                               '<div class="geo-info"><a href="' + gmapUrl + '" target="_blank" class="map-link">📍 ' + p.lat.toFixed(5) + ', ' + p.lng.toFixed(5) + ' (Googleマップ)</a></div></div>';
                    L.marker([p.lat, p.lng], opt).addTo(fg).bindPopup(html);
                }
            });
            if(fg.getLayers().length > 0) map.fitBounds(fg.getBounds(), {padding:[30,30]});
        }
        const sortedDates = [...new Set(pData.map(p => p.date))].sort();
        function addRow(container, id, label, isFirst) {
            const d = document.createElement('div'); d.className='row';
            const checked = isFirst ? 'checked' : '';
            d.innerHTML = '<input type="checkbox" class="cb" value="'+id+'" '+checked+' style="margin-right:10px;"> <span>' + label + '</span>';
            d.onclick = (e) => { if(e.target.tagName !== "INPUT") { const c=d.querySelector('.cb'); c.checked=!c.checked; } refresh(); };
            container.appendChild(d);
        }
        sortedDates.forEach((d, i) => addRow(document.getElementById('date-list'), "DATE_"+d, d, i===0));
        rData.forEach((r, i) => addRow(document.getElementById('gpx-list'), "GPX_"+r.name, r.name, i===0));
        refresh();
    </script>
