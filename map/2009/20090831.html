<!DOCTYPE html>
<html lang='ja'>
<head>
<meta charset='utf-8'>
<meta property="og:title" content="2009年8月31日の地図日記">
<meta property="og:type" content="website">
<title>2009年8月31日の地図日記</title>
<link rel='stylesheet' href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css' />
<script src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'></script>
<style>
    body { display: flex; height: 100vh; margin: 0; background: #111; font-family: sans-serif; }
    #map { flex: 1; }
    #sidebar { width: 200px; overflow-y: auto; background: #111; padding: 10px; border-left: 1px solid #333; }
    .photo-thumb { margin-bottom: 10px; cursor: pointer; border: 2px solid transparent; min-height: 40px; background: #222; }
    .photo-thumb:hover { border-color: #007bff; }
    .photo-thumb img { width: 100%; border-radius: 4px; display: block; }
    .thumb-label { color: #ccc; font-size: 12px; text-align: center; padding: 4px 2px; word-break: break-word; }
</style>
</head>
<body>
<div id='map'></div>
<div id='sidebar'><div style='color:white; text-align:center; margin-bottom:15px;'>2009年8月31日</div><div class='photo-thumb'><img src='https://lek3map.github.io/thailand/picture/aruki.jpg' title='交通手段' alt='交通手段' onerror="this.style.display='none'"></div><div class='photo-thumb' onclick='moveToMarker(0)'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/09083105.jpg' title='Road signs' alt='Road signs' onerror="this.style.display='none'"><div class='thumb-label'>Road signs</div></div><div class='photo-thumb' onclick='moveToMarker(1)'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/09083112.jpg' title='Naga Tail' alt='Naga Tail' onerror="this.style.display='none'"><div class='thumb-label'>Naga Tail</div></div><div class='photo-thumb' onclick='moveToMarker(2)'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/09083116.jpg' title='Reading Image' alt='Reading Image' onerror="this.style.display='none'"><div class='thumb-label'>Reading Image</div></div><div class='photo-thumb' onclick='moveToMarker(3)'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/09083127.jpg' title='Tourist Information' alt='Tourist Information' onerror="this.style.display='none'"><div class='thumb-label'>Tourist Information</div></div><div class='photo-thumb' onclick='moveToMarker(4)'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/09083150.jpg' title='Royal Pagoda' alt='Royal Pagoda' onerror="this.style.display='none'"><div class='thumb-label'>Royal Pagoda</div></div><div class='photo-thumb' onclick='moveToMarker(5)'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/09083158.jpg' title='Naga Torso' alt='Naga Torso' onerror="this.style.display='none'"><div class='thumb-label'>Naga Torso</div></div><div class='photo-thumb' onclick='moveToMarker(6)'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/09083172.jpg' title='Chumphon Monument' alt='Chumphon Monument' onerror="this.style.display='none'"><div class='thumb-label'>Chumphon Monument</div></div></div>
<script>
var map = L.map('map');
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

var markers = {};
var markerGroup = L.featureGroup().addTo(map);
var pathPoints = [];

var icon_hyoushiki_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/hyoushiki.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
var icon_monument_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/monument.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
var icon_starr_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/starr.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
markers[0] = L.marker([7.202694, 100.592], {icon: icon_hyoushiki_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Road signs</h3><a href='https://lek3map.github.io/thailand/map/2009/picture/09083105.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/09083105.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>ソンクラー</div><div style='text-align:left; margin-top:8px;'>道路標識</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=7.202694,100.592' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=7.202694,100.592&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[1] = L.marker([7.209506, 100.599367], {icon: icon_starr_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Naga Tail</h3><a href='https://lek3map.github.io/thailand/map/2009/picture/09083112.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/09083112.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>ソンクラー</div><div style='text-align:left; margin-top:8px;'>多分世界一長い（とは言っていないようだが）とは思うが、大部分が地中というのがチョット反則かなァ</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=7.209506,100.599367' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=7.209506,100.599367&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[2] = L.marker([7.21386, 100.597306], {icon: icon_monument_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Reading Image</h3><a href='https://lek3map.github.io/thailand/map/2009/picture/09083116.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/09083116.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>ソンクラー</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=7.21386,100.597306' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=7.21386,100.597306&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[3] = L.marker([7.205579, 100.601742], {icon: icon_starr_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Tourist Information</h3><a href='https://lek3map.github.io/thailand/map/2009/picture/09083127.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/09083127.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>ソンクラー</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=7.205579,100.601742' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=7.205579,100.601742&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[4] = L.marker([7.210209, 100.589211], {icon: icon_starr_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Royal Pagoda</h3><a href='https://lek3map.github.io/thailand/map/2009/picture/09083150.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/09083150.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>ソンクラー</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=7.210209,100.589211' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=7.210209,100.589211&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[5] = L.marker([7.214247, 100.588186], {icon: icon_starr_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Naga Torso</h3><a href='https://lek3map.github.io/thailand/map/2009/picture/09083158.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/09083158.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>ソンクラー</div><div style='text-align:left; margin-top:8px;'>多分世界一長い（とは言っていないようだが）とは思うが、大部分が地中というのがチョット反則かなァ</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=7.214247,100.588186' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=7.214247,100.588186&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[6] = L.marker([7.228107, 100.578289], {icon: icon_monument_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Chumphon Monument</h3><a href='https://lek3map.github.io/thailand/map/2009/picture/09083172.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/09083172.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>ソンクラー</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=7.228107,100.578289' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=7.228107,100.578289&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");

if (pathPoints.length > 0) {
    var polyline = L.polyline(pathPoints, {color: '#ff0000', weight: 4, opacity: 0.8}).addTo(map);
    map.fitBounds(polyline.getBounds(), {padding: [30, 30]});
} else if (Object.keys(markers).length > 0) {
    map.fitBounds(markerGroup.getBounds(), {padding: [50, 50]});
} else {
    map.setView([13.7563, 100.5018], 6);
}

function moveToMarker(id) { 
    var m = markers[id]; 
    if(m) { map.flyTo(m.getLatLng(), 15); m.openPopup(); } 
}
</script>
</body>
</html>
