<!DOCTYPE html>
<html lang='ja'>
<head>
<meta charset='utf-8'>
<meta property="og:title" content="2009年10月08日の地図日記">
<meta property="og:image" content="https://lek3map.github.io/thailand/picture/hyoushi_note.png">
<meta property="og:type" content="website">
<title>2009年10月08日の地図日記</title>
<link rel='stylesheet' href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css' />
<script src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'></script>
<style>
    body { display: flex; height: 100vh; margin: 0; background: #111; font-family: sans-serif; }
    #map { flex: 1; }
    #sidebar { width: 200px; overflow-y: auto; background: #111; padding: 10px; border-left: 1px solid #333; }
    .photo-thumb { margin-bottom: 10px; cursor: pointer; border: 2px solid transparent; }
    .photo-thumb:hover { border-color: #007bff; }
    .photo-thumb img { width: 100%; border-radius: 4px; display: block; }
</style>
</head>
<body>
<div id='map'></div>
<div id='sidebar'><div style='color:white; text-align:center; margin-bottom:15px;'>2009年10月08日</div><div class='photo-thumb' onclick='moveToMarker(0)'><img src='http://lh6.ggpht.com/_M674G_dhxK8/S_92itDAG5I/AAAAAAAABLY/2uMnK7MjnPo/s680/091008002.jpg' title='The Original Cannon For The Pattani District Chapter'></div>
<div class='photo-thumb' onclick='moveToMarker(1)'><img src='http://lh5.ggpht.com/_M674G_dhxK8/S_92gyUyJLI/AAAAAAAABLQ/8zmSZtlDkCw/091008005.jpg' title='Ministry Of Defence'></div>
</div>
<script>
var map = L.map('map');
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

var markers = {};
var markerGroup = L.featureGroup().addTo(map);
var pathPoints = [];


                var icon_starr_png = L.icon({
                    iconUrl: 'https://lek3map.github.io/thailand/icon/starr.png',
                    iconSize: [30, 30],
                    iconAnchor: [15, 30],
                    popupAnchor: [0, -30]
                });
                var icon_yakata_png = L.icon({
                    iconUrl: 'https://lek3map.github.io/thailand/icon/yakata.png',
                    iconSize: [30, 30],
                    iconAnchor: [15, 30],
                    popupAnchor: [0, -30]
                });
markers[0] = L.marker([13.751651, 100.493842], {icon: icon_starr_png}).addTo(markerGroup).bindPopup("<div style='width:250px;'><a href='http://lh6.ggpht.com/_M674G_dhxK8/S_92itDAG5I/AAAAAAAABLY/2uMnK7MjnPo/s1600/091008002.jpg' target='_blank'><img src='http://lh6.ggpht.com/_M674G_dhxK8/S_92itDAG5I/AAAAAAAABLY/2uMnK7MjnPo/s680/091008002.jpg' style='width:100%; border-radius:4px;'></a><h3 style='margin:10px 0 5px 0;'>The Original Cannon For The Pattani District Chapter</h3><div style='color:#666; font-size:1.1em;'>バンコク</div><div style='font-size:1.1em; color:#333; margin:10px 0;'>パタニ県の県章にデザインされている大砲はパタニ王国の官吏・林道乾によって制作されたパヤー・ターニー（マレー語ではスリ・パタニ）である。以前パタニに設置されていたものであるが、1785年（タイ仏暦2328年）、バンコクに移された。</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=13.751651,100.493842' target='_blank' style='font-weight:bold;'>📍 Google Maps</a></div>");
markers[1] = L.marker([13.751724, 100.494314], {icon: icon_yakata_png}).addTo(markerGroup).bindPopup("<div style='width:250px;'><a href='http://lh5.ggpht.com/_M674G_dhxK8/S_92gyUyJLI/AAAAAAAABLQ/8zmSZtlDkCw/091008005.jpg' target='_blank'><img src='http://lh5.ggpht.com/_M674G_dhxK8/S_92gyUyJLI/AAAAAAAABLQ/8zmSZtlDkCw/091008005.jpg' style='width:100%; border-radius:4px;'></a><h3 style='margin:10px 0 5px 0;'>Ministry Of Defence</h3><div style='color:#666; font-size:1.1em;'>バンコク</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=13.751724,100.494314' target='_blank' style='font-weight:bold;'>📍 Google Maps</a></div>");


if (pathPoints.length > 0) {
    var polyline = L.polyline(pathPoints, {color: '#ff0000', weight: 4, opacity: 0.8}).addTo(map);
    map.fitBounds(polyline.getBounds(), {padding: [30, 30]});
} else if (Object.keys(markers).length > 0) {
    map.fitBounds(markerGroup.getBounds(), {padding: [50, 50]});
} else {
    map.setView([13.7563, 100.5018], 6);
}

function moveToMarker(id) { 
    var m = markers[id]; 
    if(m) { map.flyTo(m.getLatLng(), 15); m.openPopup(); } 
}
</script>
</body>
</html>
