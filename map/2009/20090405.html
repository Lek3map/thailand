<!DOCTYPE html>
<html lang='ja'>
<head>
<meta charset='utf-8'>
<meta property="og:title" content="2009年4月5日の地図日記">
<meta property="og:type" content="website">
<title>2009年4月5日の地図日記</title>
<link rel='stylesheet' href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css' />
<script src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'></script>
<style>
    body { display: flex; height: 100vh; margin: 0; background: #111; font-family: sans-serif; }
    #map { flex: 1; }
    #sidebar { width: 200px; overflow-y: auto; background: #111; padding: 10px; border-left: 1px solid #333; }
    .photo-thumb { margin-bottom: 10px; cursor: pointer; border: 2px solid transparent; min-height: 40px; background: #222; }
    .photo-thumb:hover { border-color: #007bff; }
    .photo-thumb img { width: 100%; border-radius: 4px; display: block; }
    .thumb-label { color: #ccc; font-size: 12px; text-align: center; padding: 4px 2px; word-break: break-word; }
</style>
</head>
<body>
<div id='map'></div>
<div id='sidebar'><div style='color:white; text-align:center; margin-bottom:15px;'>2009年4月5日</div><div class='photo-thumb'><img src='https://lek3map.github.io/thailand/picture/bike.jpg' title='交通手段' alt='交通手段' onerror="this.style.display='none'"></div><div class='photo-thumb' onclick='moveToMarker(0)'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/09040504.jpg' title='Market' alt='Market' onerror="this.style.display='none'"><div class='thumb-label'>Market</div></div><div class='photo-thumb' onclick='moveToMarker(1)'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/09040511.jpg' title='Thale Ban National Park' alt='Thale Ban National Park' onerror="this.style.display='none'"><div class='thumb-label'>Thale Ban National Park</div></div><div class='photo-thumb' onclick='moveToMarker(2)'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/09040520.jpg' title='ワンプラチャン国境' alt='ワンプラチャン国境' onerror="this.style.display='none'"><div class='thumb-label'>ワンプラチャン国境</div></div><div class='photo-thumb' onclick='moveToMarker(3)'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/09040520.jpg' title='Thai-Malaysia Border' alt='Thai-Malaysia Border' onerror="this.style.display='none'"><div class='thumb-label'>Thai-Malaysia Border</div></div><div class='photo-thumb' onclick='moveToMarker(4)'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/09040555.jpg' title='Khantipon Cave' alt='Khantipon Cave' onerror="this.style.display='none'"><div class='thumb-label'>Khantipon Cave</div></div></div>
<script>
var map = L.map('map');
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

var markers = {};
var markerGroup = L.featureGroup().addTo(map);
var pathPoints = [];

var icon_bikered_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/bikered.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
var icon_border_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/border.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
var icon_market_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/market.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
var icon_parks_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/parks.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
var icon_tam_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/tam.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
markers[0] = L.marker([6.61299, 100.061754], {icon: icon_market_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Market</h3><a href='https://photos.app.goo.gl/71cAvXEkPvTjMTfE7' target='_blank'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/09040504.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>サトゥン</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=6.61299,100.061754' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=6.61299,100.061754&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[1] = L.marker([6.707476, 100.166849], {icon: icon_parks_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Thale Ban National Park<br>อุทยานแห่งชาติทะเลบัน</h3><a href='https://lek3map.github.io/thailand/map/2009/picture/09040511.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/09040511.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>サトゥン</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=6.707476,100.166849' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=6.707476,100.166849&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[2] = L.marker([6.696667, 100.178556], {icon: icon_bikered_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>ワンプラチャン国境</h3><a href='https://photos.app.goo.gl/tt1NJNNjSHcYUq2e7' target='_blank'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/09040520.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>サトゥン</div><div style='text-align:left; margin-top:8px;'>マレー側にはお店も何もなかった、自前の交通手段を持たないとこの国境は越えられそうにない。</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=6.696667,100.178556' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=6.696667,100.178556&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[3] = L.marker([6.69656, 100.178991], {icon: icon_border_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Thai-Malaysia Border</h3><a href='https://lek3map.github.io/thailand/map/2009/picture/09040520.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/09040520.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>サトゥン</div><div style='text-align:left; margin-top:8px;'>タイ・マレーシア国境、週末には国境を挟んだ両側で市が開かれ、タイ・マレーシア人は自由に行き来出来る。２０１１年１１月マレーシアから超えた、マレー側にはお店も全くなかった、タイ側は常設のお店がかなり出来ていた、しかし、両側共公共交通機関はなさそうなので自前の移動手段を持たずにこの国境を越えるのは難しい。</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=6.69656,100.178991' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=6.69656,100.178991&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[4] = L.marker([7.085561, 99.798431], {icon: icon_tam_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Khantipon Cave<br>ถ้ำขันติพล</h3><a href='https://photos.app.goo.gl/iA6NUaeoBVQuym4c6' target='_blank'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/09040555.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>サトゥン</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=7.085561,99.798431' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=7.085561,99.798431&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");

if (pathPoints.length > 0) {
    var polyline = L.polyline(pathPoints, {color: '#ff0000', weight: 4, opacity: 0.8}).addTo(map);
    map.fitBounds(polyline.getBounds(), {padding: [30, 30]});
} else if (Object.keys(markers).length > 0) {
    map.fitBounds(markerGroup.getBounds(), {padding: [50, 50]});
} else {
    map.setView([13.7563, 100.5018], 6);
}

function moveToMarker(id) { 
    var m = markers[id]; 
    if(m) { map.flyTo(m.getLatLng(), 15); m.openPopup(); } 
}
</script>
</body>
</html>
