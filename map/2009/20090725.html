<!DOCTYPE html>
<html lang='ja'>
<head>
<meta charset='utf-8'>
<meta property="og:title" content="2009年7月25日の地図日記">
<meta property="og:type" content="website">
<title>2009年7月25日の地図日記</title>
<link rel='stylesheet' href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css' />
<script src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'></script>
<style>
    body { display: flex; height: 100vh; margin: 0; background: #111; font-family: sans-serif; }
    #map { flex: 1; }
    #sidebar { width: 200px; overflow-y: auto; background: #111; padding: 10px; border-left: 1px solid #333; }
    .photo-thumb { margin-bottom: 10px; cursor: pointer; border: 2px solid transparent; min-height: 40px; background: #222; }
    .photo-thumb:hover { border-color: #007bff; }
    .photo-thumb img { width: 100%; border-radius: 4px; display: block; }
    .thumb-label { color: #ccc; font-size: 12px; text-align: center; padding: 4px 2px; word-break: break-word; }
</style>
</head>
<body>
<div id='map'></div>
<div id='sidebar'><div style='color:white; text-align:center; margin-bottom:15px;'>2009年7月25日</div><div class='photo-thumb'><img src='https://lek3map.github.io/thailand/picture/kuruma.jpg' title='交通手段' alt='交通手段' onerror="this.style.display='none'"></div><div class='photo-thumb' onclick='moveToMarker(0)'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/09072503.jpg' title='Clock Tower' alt='Clock Tower' onerror="this.style.display='none'"><div class='thumb-label'>Clock Tower</div></div><div class='photo-thumb' onclick='moveToMarker(1)'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/09072507.jpg' title='Monument' alt='Monument' onerror="this.style.display='none'"><div class='thumb-label'>Monument</div></div><div class='photo-thumb' onclick='moveToMarker(2)'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/09072510.jpg' title='Wat Khao Wang' alt='Wat Khao Wang' onerror="this.style.display='none'"><div class='thumb-label'>Wat Khao Wang</div></div><div class='photo-thumb' onclick='moveToMarker(3)'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/09072514.jpg' title='What Statue?' alt='What Statue?' onerror="this.style.display='none'"><div class='thumb-label'>What Statue?</div></div><div class='photo-thumb' onclick='moveToMarker(4)'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/09072519.jpg' title='Street Lamp' alt='Street Lamp' onerror="this.style.display='none'"><div class='thumb-label'>Street Lamp</div></div><div class='photo-thumb' onclick='moveToMarker(5)'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/09072523.jpg' title='Wat Samphran' alt='Wat Samphran' onerror="this.style.display='none'"><div class='thumb-label'>Wat Samphran</div></div></div>
<script>
var map = L.map('map');
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

var markers = {};
var markerGroup = L.featureGroup().addTo(map);
var pathPoints = [];

var icon_clock_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/clock.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
var icon_gaitou_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/gaitou.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
var icon_monument_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/monument.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
var icon_starr_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/starr.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
var icon_tera_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/tera.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
markers[0] = L.marker([13.524024, 99.788851], {icon: icon_clock_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Clock Tower<br>หอนาฬิกา</h3><a href='https://lek3map.github.io/thailand/map/2009/picture/09072503.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/09072503.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>ラチャブリ</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=13.524024,99.788851' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=13.524024,99.788851&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[1] = L.marker([13.52732, 99.792257], {icon: icon_monument_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Monument</h3><a href='https://lek3map.github.io/thailand/map/2009/picture/09072507.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/09072507.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>ラチャブリ</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=13.52732,99.792257' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=13.52732,99.792257&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[2] = L.marker([13.529886, 99.794902], {icon: icon_tera_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Wat Khao Wang<br>วัดเขาวังราชบุรี</h3><a href='https://lek3map.github.io/thailand/map/2009/picture/09072510.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/09072510.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>ラチャブリ</div><div style='text-align:left; margin-top:8px;'>第三級王室仏教寺院</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=13.529886,99.794902' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=13.529886,99.794902&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[3] = L.marker([13.743846, 100.214608], {icon: icon_starr_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>What Statue?</h3><a href='https://lek3map.github.io/thailand/map/2009/picture/09072514.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/09072514.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>ナコンパトム</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=13.743846,100.214608' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=13.743846,100.214608&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[4] = L.marker([13.743543, 100.214903], {icon: icon_gaitou_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Street Lamp</h3><a href='https://lek3map.github.io/thailand/map/2009/picture/09072519.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/09072519.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>ナコンパトム</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=13.743543,100.214903' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=13.743543,100.214903&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[5] = L.marker([13.736217, 100.215054], {icon: icon_tera_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Wat Samphran<br>วัดสามพราน</h3><a href='https://photos.app.goo.gl/YZo7QETx8XiHinex6' target='_blank'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/09072523.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>ナコンパトム</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=13.736217,100.215054' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=13.736217,100.215054&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");

if (pathPoints.length > 0) {
    var polyline = L.polyline(pathPoints, {color: '#ff0000', weight: 4, opacity: 0.8}).addTo(map);
    map.fitBounds(polyline.getBounds(), {padding: [30, 30]});
} else if (Object.keys(markers).length > 0) {
    map.fitBounds(markerGroup.getBounds(), {padding: [50, 50]});
} else {
    map.setView([13.7563, 100.5018], 6);
}

function moveToMarker(id) { 
    var m = markers[id]; 
    if(m) { map.flyTo(m.getLatLng(), 15); m.openPopup(); } 
}
</script>
</body>
</html>
