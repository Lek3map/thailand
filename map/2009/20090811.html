<!DOCTYPE html>
<html lang='ja'>
<head>
<meta charset='utf-8'>
<meta property="og:title" content="2009年8月11日の地図日記">
<meta property="og:type" content="website">
<title>2009年8月11日の地図日記</title>
<link rel='stylesheet' href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css' />
<script src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'></script>
<style>
    body { display: flex; height: 100vh; margin: 0; background: #111; font-family: sans-serif; }
    #map { flex: 1; }
    #sidebar { width: 200px; overflow-y: auto; background: #111; padding: 10px; border-left: 1px solid #333; }
    .photo-thumb { margin-bottom: 10px; cursor: pointer; border: 2px solid transparent; min-height: 40px; background: #222; }
    .photo-thumb:hover { border-color: #007bff; }
    .photo-thumb img { width: 100%; border-radius: 4px; display: block; }
    .thumb-label { color: #ccc; font-size: 12px; text-align: center; padding: 4px 2px; word-break: break-word; }
</style>
</head>
<body>
<div id='map'></div>
<div id='sidebar'><div style='color:white; text-align:center; margin-bottom:15px;'>2009年8月11日</div><div class='photo-thumb'><img src='https://lek3map.github.io/thailand/picture/kuruma.jpg' title='交通手段' alt='交通手段' onerror="this.style.display='none'"></div><div class='photo-thumb' onclick='moveToMarker(0)'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/090811025.jpg' title='Wat Yi Pa' alt='Wat Yi Pa' onerror="this.style.display='none'"><div class='thumb-label'>Wat Yi Pa</div></div><div class='photo-thumb' onclick='moveToMarker(1)'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/090811035.jpg' title='Wat Thasung Thaksinaram' alt='Wat Thasung Thaksinaram' onerror="this.style.display='none'"><div class='thumb-label'>Wat Thasung Thaksinaram</div></div><div class='photo-thumb' onclick='moveToMarker(2)'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/090811101.jpg' title='Khao Luang Cave' alt='Khao Luang Cave' onerror="this.style.display='none'"><div class='thumb-label'>Khao Luang Cave</div></div><div class='photo-thumb' onclick='moveToMarker(3)'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/090811112.jpg' title='Puk Tian Beach' alt='Puk Tian Beach' onerror="this.style.display='none'"><div class='thumb-label'>Puk Tian Beach</div></div></div>
<script>
var map = L.map('map');
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

var markers = {};
var markerGroup = L.featureGroup().addTo(map);
var pathPoints = [];

var icon_beach_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/beach.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
var icon_tam_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/tam.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
var icon_tera_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/tera.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
markers[0] = L.marker([14.199615, 100.498424], {icon: icon_tera_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Wat Yi Pa<br>วัดยี่ป่า</h3><a href='https://goo.gl/photos/cPQ2KkFd53tdc4JCA' target='_blank'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/090811025.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>アユタヤ</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=14.199615,100.498424' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=14.199615,100.498424&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[1] = L.marker([14.153554, 100.504346], {icon: icon_tera_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Wat Thasung Thaksinaram<br>วัดท่าซุงทักษิณาราม</h3><a href='https://goo.gl/photos/Pi8zZx3kVS7pevMw8' target='_blank'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/090811035.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>アユタヤ</div><div style='text-align:left; margin-top:8px;'>コーモリ寺、地獄の浮彫あり</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=14.153554,100.504346' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=14.153554,100.504346&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[2] = L.marker([13.135612, 99.933357], {icon: icon_tam_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Khao Luang Cave</h3><a href='https://goo.gl/photos/ALjbCQX1N1Scz2oy5' target='_blank'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/090811101.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>ペチャブリ</div><div style='text-align:left; margin-top:8px;'>カオルアン洞窟</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=13.135612,99.933357' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=13.135612,99.933357&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[3] = L.marker([12.94624, 100.033672], {icon: icon_beach_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Puk Tian Beach<br>หาดปึกเตียน</h3><a href='https://goo.gl/photos/H9sTG8iPeszodP4H7' target='_blank'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/090811112.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>ペチャブリ</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=12.94624,100.033672' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=12.94624,100.033672&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");

if (pathPoints.length > 0) {
    var polyline = L.polyline(pathPoints, {color: '#ff0000', weight: 4, opacity: 0.8}).addTo(map);
    map.fitBounds(polyline.getBounds(), {padding: [30, 30]});
} else if (Object.keys(markers).length > 0) {
    map.fitBounds(markerGroup.getBounds(), {padding: [50, 50]});
} else {
    map.setView([13.7563, 100.5018], 6);
}

function moveToMarker(id) { 
    var m = markers[id]; 
    if(m) { map.flyTo(m.getLatLng(), 15); m.openPopup(); } 
}
</script>
</body>
</html>
