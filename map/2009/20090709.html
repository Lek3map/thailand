<!DOCTYPE html>
<html lang='ja'>
<head>
<meta charset='utf-8'>
<meta property="og:title" content="2009年7月9日の地図日記">
<meta property="og:type" content="website">
<title>2009年7月9日の地図日記</title>
<link rel='stylesheet' href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css' />
<script src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'></script>
<style>
    body { display: flex; height: 100vh; margin: 0; background: #111; font-family: sans-serif; }
    #map { flex: 1; }
    #sidebar { width: 200px; overflow-y: auto; background: #111; padding: 10px; border-left: 1px solid #333; }
    .photo-thumb { margin-bottom: 10px; cursor: pointer; border: 2px solid transparent; min-height: 40px; background: #222; }
    .photo-thumb:hover { border-color: #007bff; }
    .photo-thumb img { width: 100%; border-radius: 4px; display: block; }
    .thumb-label { color: #ccc; font-size: 12px; text-align: center; padding: 4px 2px; word-break: break-word; }
</style>
</head>
<body>
<div id='map'></div>
<div id='sidebar'><div style='color:white; text-align:center; margin-bottom:15px;'>2009年7月9日</div><div class='photo-thumb'><img src='https://lek3map.github.io/thailand/picture/aruki.jpg' title='交通手段' alt='交通手段' onerror="this.style.display='none'"></div><div class='photo-thumb' onclick='moveToMarker(0)'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/09070925.jpg' title='Road signs' alt='Road signs' onerror="this.style.display='none'"><div class='thumb-label'>Road signs</div></div><div class='photo-thumb' onclick='moveToMarker(1)'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/09070928.jpg' title='Lak Muang@Na Chaluai' alt='Lak Muang@Na Chaluai' onerror="this.style.display='none'"><div class='thumb-label'>Lak Muang@Na Chaluai</div></div><div class='photo-thumb' onclick='moveToMarker(2)'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/09070931.jpg' title='Street Lamp' alt='Street Lamp' onerror="this.style.display='none'"><div class='thumb-label'>Street Lamp</div></div><div class='photo-thumb' onclick='moveToMarker(3)'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/09070934.jpg' title='Emerald triangle' alt='Emerald triangle' onerror="this.style.display='none'"><div class='thumb-label'>Emerald triangle</div></div><div class='photo-thumb' onclick='moveToMarker(4)'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/09070941.jpg' title='Na Chaluai District Office' alt='Na Chaluai District Office' onerror="this.style.display='none'"><div class='thumb-label'>Na Chaluai District Office</div></div><div class='photo-thumb' onclick='moveToMarker(5)'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/09070951.jpg' title='Wat Ban Non Daeng' alt='Wat Ban Non Daeng' onerror="this.style.display='none'"><div class='thumb-label'>Wat Ban Non Daeng</div></div></div>
<script>
var map = L.map('map');
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

var markers = {};
var markerGroup = L.featureGroup().addTo(map);
var pathPoints = [];

var icon_gaitou_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/gaitou.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
var icon_hyoushiki_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/hyoushiki.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
var icon_lakmuang_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/lakmuang.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
var icon_starr_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/starr.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
var icon_tera_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/tera.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
markers[0] = L.marker([14.520715, 105.247457], {icon: icon_hyoushiki_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Road signs</h3><a href='https://lek3map.github.io/thailand/map/2009/picture/09070925.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/09070925.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>ウボンラチャタニ</div><div style='text-align:left; margin-top:8px;'>道路標識</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=14.520715,105.247457' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=14.520715,105.247457&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[1] = L.marker([14.520102, 105.247521], {icon: icon_lakmuang_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Lak Muang@Na Chaluai</h3><a href='https://lek3map.github.io/thailand/map/2009/picture/09070928.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/09070928.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>ウボンラチャタニ</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=14.520102,105.247521' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=14.520102,105.247521&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[2] = L.marker([14.519983, 105.247023], {icon: icon_gaitou_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Street Lamp</h3><a href='https://lek3map.github.io/thailand/map/2009/picture/09070931.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/09070931.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>ウボンラチャタニ</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=14.519983,105.247023' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=14.519983,105.247023&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[3] = L.marker([14.344392, 105.204727], {icon: icon_starr_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Emerald triangle<br>สามเหลี่ยมมรกต</h3><a href='https://lek3map.github.io/thailand/map/2009/picture/09070934.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/09070934.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>ウボンラチャタニ</div><div style='text-align:left; margin-top:8px;'>タイ・ラオス・カンボジアの三国国境が陸上で交わる場所、２００９年７月に行ったのだけれど、そこは軍の敷地内（？）にあり、丁度カンボジアとカオプラウィハーン遺跡の件で揉めていた時だったので、入れてはもらえなかった</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=14.344392,105.204727' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=14.344392,105.204727&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[4] = L.marker([14.521125, 105.246438], {icon: icon_starr_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Na Chaluai District Office</h3><a href='https://lek3map.github.io/thailand/map/2009/picture/09070941.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/09070941.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>ウボンラチャタニ</div><div style='text-align:left; margin-top:8px;'>ここのシンボルはリスらしい</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=14.521125,105.246438' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=14.521125,105.246438&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[5] = L.marker([14.629732, 105.221944], {icon: icon_tera_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Wat Ban Non Daeng<br>วัดบ้านโนนแดง</h3><a href='https://goo.gl/photos/tcSiifySsYmN9uPY8' target='_blank'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/09070951.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>ウボンラチャタニ</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=14.629732,105.221944' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=14.629732,105.221944&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");

if (pathPoints.length > 0) {
    var polyline = L.polyline(pathPoints, {color: '#ff0000', weight: 4, opacity: 0.8}).addTo(map);
    map.fitBounds(polyline.getBounds(), {padding: [30, 30]});
} else if (Object.keys(markers).length > 0) {
    map.fitBounds(markerGroup.getBounds(), {padding: [50, 50]});
} else {
    map.setView([13.7563, 100.5018], 6);
}

function moveToMarker(id) { 
    var m = markers[id]; 
    if(m) { map.flyTo(m.getLatLng(), 15); m.openPopup(); } 
}
</script>
</body>
</html>
