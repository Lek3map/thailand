var icon_start_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/start.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
markers[0] = L.marker([35.2993683, 139.6252833], {icon: icon_start_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>出発地</h3><a href='https://lek3map.github.io/thailand/picture/aruki.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/picture/aruki.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>ナコンパノム</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=35.2993683,139.6252833' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=35.2993683,139.6252833&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[1] = L.marker([17.405561, 104.78704], {icon: icon_matsuri_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>The Illuminated Boat Procession<br>เรือไฟ</h3><a href='https://goo.gl/photos/dHV1tdL5yCSSKzaG7' target='_blank'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/091004058.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>ナコンパノム</div><div style='text-align:left; margin-top:8px;'>一ヶ月以上前から一夜の為の用意が始まる、無数の手作りランプをセットするのにどのくらいかかるのだろうか？</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=17.405561,104.78704' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=17.405561,104.78704&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");

if (pathPoints.length > 0) {
    var polyline = L.polyline(pathPoints, {color: '#ff0000', weight: 4, opacity: 0.8}).addTo(map);
    map.fitBounds(polyline.getBounds(), {padding: [30, 30]});
} else if (Object.keys(markers).length > 0) {
    map.fitBounds(markerGroup.getBounds(), {padding: [50, 50]});
} else {
    map.setView([13.7563, 100.5018], 6);
}

function moveToMarker(id) { 
    var m = markers[id]; 
    if(m) { map.flyTo(m.getLatLng(), 15); m.openPopup(); } 
}
</script>
