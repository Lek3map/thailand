<!DOCTYPE html>
<html lang='ja'>
<head>
<meta charset='utf-8'>
<meta property="og:title" content="2009年7月29日の地図日記">
<meta property="og:type" content="website">
<title>2009年7月29日の地図日記</title>
<link rel='stylesheet' href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css' />
<script src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'></script>
<style>
    body { display: flex; height: 100vh; margin: 0; background: #111; font-family: sans-serif; }
    #map { flex: 1; }
    #sidebar { width: 200px; overflow-y: auto; background: #111; padding: 10px; border-left: 1px solid #333; }
    .photo-thumb { margin-bottom: 10px; cursor: pointer; border: 2px solid transparent; min-height: 40px; background: #222; }
    .photo-thumb:hover { border-color: #007bff; }
    .photo-thumb img { width: 100%; border-radius: 4px; display: block; }
    .thumb-label { color: #ccc; font-size: 12px; text-align: center; padding: 4px 2px; word-break: break-word; }
</style>
</head>
<body>
<div id='map'></div>
<div id='sidebar'><div style='color:white; text-align:center; margin-bottom:15px;'>2009年7月29日</div><div class='photo-thumb'><img src='https://lek3map.github.io/thailand/picture/kuruma.jpg' title='交通手段' alt='交通手段' onerror="this.style.display='none'"></div><div class='photo-thumb' onclick='moveToMarker(0)'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/090729012.jpg' title='Post Office' alt='Post Office' onerror="this.style.display='none'"><div class='thumb-label'>Post Office</div></div><div class='photo-thumb' onclick='moveToMarker(1)'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/090729002.jpg' title='Wat Tha Luang' alt='Wat Tha Luang' onerror="this.style.display='none'"><div class='thumb-label'>Wat Tha Luang</div></div><div class='photo-thumb' onclick='moveToMarker(2)'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/090729036.jpg' title='Wat Pho Prathap Chang' alt='Wat Pho Prathap Chang' onerror="this.style.display='none'"><div class='thumb-label'>Wat Pho Prathap Chang</div></div><div class='photo-thumb' onclick='moveToMarker(3)'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/090729063.jpg' title='Wat Rong Chang' alt='Wat Rong Chang' onerror="this.style.display='none'"><div class='thumb-label'>Wat Rong Chang</div></div><div class='photo-thumb' onclick='moveToMarker(4)'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/090729101.jpg' title='Alligators of Phichit' alt='Alligators of Phichit' onerror="this.style.display='none'"><div class='thumb-label'>Alligators of Phichit</div></div><div class='photo-thumb' onclick='moveToMarker(5)'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/090729119.jpg' title='Gold Textile Museum' alt='Gold Textile Museum' onerror="this.style.display='none'"><div class='thumb-label'>Gold Textile Museum</div></div><div class='photo-thumb' onclick='moveToMarker(6)'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/090729142.jpg' title='Big Milestone' alt='Big Milestone' onerror="this.style.display='none'"><div class='thumb-label'>Big Milestone</div></div></div>
<script>
var map = L.map('map');
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

var markers = {};
var markerGroup = L.featureGroup().addTo(map);
var pathPoints = [];

var icon_iseki_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/iseki.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
var icon_postbox_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/postbox.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
var icon_starr_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/starr.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
var icon_tera_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/tera.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
var icon_yakata_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/yakata.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
markers[0] = L.marker([16.439548, 100.352597], {icon: icon_postbox_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Post Office</h3><a href='https://lek3map.github.io/thailand/map/2009/picture/090729012.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/090729012.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>ピチット</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=16.439548,100.352597' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=16.439548,100.352597&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[1] = L.marker([16.440675, 100.352726], {icon: icon_tera_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Wat Tha Luang<br>วัดท่าหลวง</h3><a href='https://goo.gl/photos/Aqv828b1ruLoz4DN6' target='_blank'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/090729002.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>ピチット</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=16.440675,100.352726' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=16.440675,100.352726&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[2] = L.marker([16.302882, 100.31584], {icon: icon_iseki_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Wat Pho Prathap Chang<br>วัดโพธิ์ประทับช้าง</h3><a href='https://goo.gl/photos/P6VaTYuwJ1JtjJWt5' target='_blank'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/090729036.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>ピチット</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=16.302882,100.31584' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=16.302882,100.31584&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[3] = L.marker([16.427626, 100.288578], {icon: icon_tera_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Wat Rong Chang<br>วัดโรงช้าง</h3><a href='https://goo.gl/photos/bsgAMwCsKPTfA7we8' target='_blank'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/090729063.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>ピチット</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=16.427626,100.288578' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=16.427626,100.288578&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[4] = L.marker([16.444029, 100.348992], {icon: icon_starr_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Alligators of Phichit</h3><a href='https://photos.app.goo.gl/z3TRmFNWeTAx2k3k8' target='_blank'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/090729101.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>ピチット</div><div style='text-align:left; margin-top:8px;'>ピチットの象徴はワニ、だからあっちにもこっちにもワニがいるのだ</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=16.444029,100.348992' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=16.444029,100.348992&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[5] = L.marker([17.525052, 99.766159], {icon: icon_yakata_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Gold Textile Museum<br>สาธรพิพิธภัณฑ์ผ้าทองคำ</h3><a href='https://goo.gl/photos/18dZT6L5QFAFuwKj8' target='_blank'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/090729119.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>スコータイ</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=17.525052,99.766159' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=17.525052,99.766159&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[6] = L.marker([18.264077, 99.467533], {icon: icon_starr_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Big Milestone</h3><a href='https://lek3map.github.io/thailand/map/2009/picture/090729142.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/090729142.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>ランパン</div><div style='text-align:left; margin-top:8px;'>大きな道標</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=18.264077,99.467533' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=18.264077,99.467533&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");

if (pathPoints.length > 0) {
    var polyline = L.polyline(pathPoints, {color: '#ff0000', weight: 4, opacity: 0.8}).addTo(map);
    map.fitBounds(polyline.getBounds(), {padding: [30, 30]});
} else if (Object.keys(markers).length > 0) {
    map.fitBounds(markerGroup.getBounds(), {padding: [50, 50]});
} else {
    map.setView([13.7563, 100.5018], 6);
}

function moveToMarker(id) { 
    var m = markers[id]; 
    if(m) { map.flyTo(m.getLatLng(), 15); m.openPopup(); } 
}
</script>
</body>
</html>
