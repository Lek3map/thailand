<!DOCTYPE html>
<html lang='ja'>
<head>
<meta charset='utf-8'>
<meta property="og:title" content="2009年8月4日の地図日記">
<meta property="og:type" content="website">
<title>2009年8月4日の地図日記</title>
<link rel='stylesheet' href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css' />
<script src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'></script>
<style>
    body { display: flex; height: 100vh; margin: 0; background: #111; font-family: sans-serif; }
    #map { flex: 1; }
    #sidebar { width: 200px; overflow-y: auto; background: #111; padding: 10px; border-left: 1px solid #333; }
    .photo-thumb { margin-bottom: 10px; cursor: pointer; border: 2px solid transparent; min-height: 40px; background: #222; }
    .photo-thumb:hover { border-color: #007bff; }
    .photo-thumb img { width: 100%; border-radius: 4px; display: block; }
    .thumb-label { color: #ccc; font-size: 12px; text-align: center; padding: 4px 2px; word-break: break-word; }
</style>
</head>
<body>
<div id='map'></div>
<div id='sidebar'><div style='color:white; text-align:center; margin-bottom:15px;'>2009年8月4日</div><div class='photo-thumb'><img src='https://lek3map.github.io/thailand/picture/kuruma.jpg' title='交通手段' alt='交通手段' onerror="this.style.display='none'"></div><div class='photo-thumb' onclick='moveToMarker(0)'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/090804020.jpg' title='Wat Nan Tharam' alt='Wat Nan Tharam' onerror="this.style.display='none'"><div class='thumb-label'>Wat Nan Tharam</div></div><div class='photo-thumb' onclick='moveToMarker(1)'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/090804063.jpg' title='Clock Tower' alt='Clock Tower' onerror="this.style.display='none'"><div class='thumb-label'>Clock Tower</div></div><div class='photo-thumb' onclick='moveToMarker(2)'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/090804065.jpg' title='Fang Post Office' alt='Fang Post Office' onerror="this.style.display='none'"><div class='thumb-label'>Fang Post Office</div></div><div class='photo-thumb' onclick='moveToMarker(3)'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/090804071.jpg' title='Wat Danrung' alt='Wat Danrung' onerror="this.style.display='none'"><div class='thumb-label'>Wat Danrung</div></div><div class='photo-thumb' onclick='moveToMarker(4)'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/090804090.jpg' title='Mae Ai Post Office' alt='Mae Ai Post Office' onerror="this.style.display='none'"><div class='thumb-label'>Mae Ai Post Office</div></div><div class='photo-thumb' onclick='moveToMarker(5)'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/090804097.jpg' title='Phra Chedi Kaew' alt='Phra Chedi Kaew' onerror="this.style.display='none'"><div class='thumb-label'>Phra Chedi Kaew</div></div><div class='photo-thumb' onclick='moveToMarker(6)'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/090804181.jpg' title='Mae Fah Luang University' alt='Mae Fah Luang University' onerror="this.style.display='none'"><div class='thumb-label'>Mae Fah Luang University</div></div><div class='photo-thumb' onclick='moveToMarker(7)'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/090804217.jpg' title='Clock Tower' alt='Clock Tower' onerror="this.style.display='none'"><div class='thumb-label'>Clock Tower</div></div></div>
<script>
var map = L.map('map');
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

var markers = {};
var markerGroup = L.featureGroup().addTo(map);
var pathPoints = [];

var icon_clock_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/clock.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
var icon_postbox_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/postbox.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
var icon_starr_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/starr.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
var icon_tera_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/tera.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
markers[0] = L.marker([19.902153, 99.200513], {icon: icon_tera_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Wat Nan Tharam<br>วัดนันทาราม</h3><a href='https://goo.gl/photos/TfsnUEfF7CWrz76r6' target='_blank'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/090804020.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>チェンマイ</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=19.902153,99.200513' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=19.902153,99.200513&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[1] = L.marker([19.914248, 99.208056], {icon: icon_clock_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Clock Tower<br>หอนาฬิกา</h3><a href='https://lek3map.github.io/thailand/map/2009/picture/090804063.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/090804063.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>チェンマイ</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=19.914248,99.208056' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=19.914248,99.208056&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[2] = L.marker([19.916326, 99.210041], {icon: icon_postbox_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Fang Post Office</h3><a href='https://lek3map.github.io/thailand/map/2009/picture/090804065.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/090804065.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>チェンマイ</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=19.916326,99.210041' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=19.916326,99.210041&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[3] = L.marker([19.923175, 99.212798], {icon: icon_tera_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Wat Danrung</h3><a href='https://goo.gl/photos/5wnHrPCjZay5Wi4J8' target='_blank'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/090804071.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>チェンマイ</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=19.923175,99.212798' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=19.923175,99.212798&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[4] = L.marker([20.036106, 99.301161], {icon: icon_postbox_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Mae Ai Post Office</h3><a href='https://lek3map.github.io/thailand/map/2009/picture/090804090.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/090804090.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>チェンマイ</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=20.036106,99.301161' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=20.036106,99.301161&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[5] = L.marker([20.064534, 99.351747], {icon: icon_tera_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Phra Chedi Kaew<br>พระเจดีย์แก้ว</h3><a href='https://goo.gl/photos/DtRfrNnPhXV6tx1S6' target='_blank'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/090804097.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>チェンマイ</div><div style='text-align:left; margin-top:8px;'>第3級王室仏教寺院</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=20.064534,99.351747' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=20.064534,99.351747&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[6] = L.marker([20.045288, 99.891386], {icon: icon_starr_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Mae Fah Luang University<br>ม.แม่ฟ้าหลวง</h3><a href='https://lek3map.github.io/thailand/map/2009/picture/090804181.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/090804181.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>チェンライ</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=20.045288,99.891386' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=20.045288,99.891386&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[7] = L.marker([19.907116, 99.83102], {icon: icon_clock_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Clock Tower<br>หอนาฬิกา</h3><a href='https://photos.app.goo.gl/x5Gts6sgw6aB6eYW2' target='_blank'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/090804217.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>チェンライ</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=19.907116,99.83102' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=19.907116,99.83102&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");

if (pathPoints.length > 0) {
    var polyline = L.polyline(pathPoints, {color: '#ff0000', weight: 4, opacity: 0.8}).addTo(map);
    map.fitBounds(polyline.getBounds(), {padding: [30, 30]});
} else if (Object.keys(markers).length > 0) {
    map.fitBounds(markerGroup.getBounds(), {padding: [50, 50]});
} else {
    map.setView([13.7563, 100.5018], 6);
}

function moveToMarker(id) { 
    var m = markers[id]; 
    if(m) { map.flyTo(m.getLatLng(), 15); m.openPopup(); } 
}
</script>
</body>
</html>
