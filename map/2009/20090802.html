<!DOCTYPE html>
<html lang='ja'>
<head>
<meta charset='utf-8'>
<meta property="og:title" content="2009年8月2日の地図日記">
<meta property="og:type" content="website">
<title>2009年8月2日の地図日記</title>
<link rel='stylesheet' href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css' />
<script src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'></script>
<style>
    body { display: flex; height: 100vh; margin: 0; background: #111; font-family: sans-serif; }
    #map { flex: 1; }
    #sidebar { width: 200px; overflow-y: auto; background: #111; padding: 10px; border-left: 1px solid #333; }
    .photo-thumb { margin-bottom: 10px; cursor: pointer; border: 2px solid transparent; min-height: 40px; background: #222; }
    .photo-thumb:hover { border-color: #007bff; }
    .photo-thumb img { width: 100%; border-radius: 4px; display: block; }
    .thumb-label { color: #ccc; font-size: 12px; text-align: center; padding: 4px 2px; word-break: break-word; }
</style>
</head>
<body>
<div id='map'></div>
<div id='sidebar'><div style='color:white; text-align:center; margin-bottom:15px;'>2009年8月2日</div><div class='photo-thumb'><img src='https://lek3map.github.io/thailand/picture/kuruma.jpg' title='交通手段' alt='交通手段' onerror="this.style.display='none'"></div><div class='photo-thumb' onclick='moveToMarker(0)'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/090802012.jpg' title='Wat Doi Noi' alt='Wat Doi Noi' onerror="this.style.display='none'"><div class='thumb-label'>Wat Doi Noi</div></div><div class='photo-thumb' onclick='moveToMarker(1)'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/090802063.jpg' title='Ganesh Musium' alt='Ganesh Musium' onerror="this.style.display='none'"><div class='thumb-label'>Ganesh Musium</div></div><div class='photo-thumb' onclick='moveToMarker(2)'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/090802116.jpg' title='Wat Phra Phutthabat Takpha' alt='Wat Phra Phutthabat Takpha' onerror="this.style.display='none'"><div class='thumb-label'>Wat Phra Phutthabat Takpha</div></div><div class='photo-thumb' onclick='moveToMarker(3)'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/090802192.jpg' title='Wat Pa Caroen Tham' alt='Wat Pa Caroen Tham' onerror="this.style.display='none'"><div class='thumb-label'>Wat Pa Caroen Tham</div></div><div class='photo-thumb' onclick='moveToMarker(4)'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/090802238.jpg' title='Monument to Thai Burmese War Victims' alt='Monument to Thai Burmese War Victims' onerror="this.style.display='none'"><div class='thumb-label'>Monument to Thai Burmese War Victims</div></div><div class='photo-thumb' onclick='moveToMarker(5)'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/090802249.jpg' title='Wat Mun San' alt='Wat Mun San' onerror="this.style.display='none'"><div class='thumb-label'>Wat Mun San</div></div><div class='photo-thumb' onclick='moveToMarker(6)'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/090802264.jpg' title='Wat Sri Suphan' alt='Wat Sri Suphan' onerror="this.style.display='none'"><div class='thumb-label'>Wat Sri Suphan</div></div></div>
<script>
var map = L.map('map');
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

var markers = {};
var markerGroup = L.featureGroup().addTo(map);
var pathPoints = [];

var icon_inori_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/inori.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
var icon_tera_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/tera.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
var icon_yakata_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/yakata.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
markers[0] = L.marker([18.465179, 98.803675], {icon: icon_tera_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Wat Doi Noi<br>วัดพระธาตุดอยน้อย</h3><a href='https://goo.gl/photos/T7PcYXqS7SFBNars9' target='_blank'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/090802012.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>チェンマイ</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=18.465179,98.803675' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=18.465179,98.803675&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[1] = L.marker([18.560237, 98.825594], {icon: icon_yakata_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Ganesh Musium<br>พิพิธภัณฑ์พระพิฆเนศ</h3><a href='https://goo.gl/photos/z4cpNaw81spmZvda6' target='_blank'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/090802063.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>チェンマイ</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=18.560237,98.825594' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=18.560237,98.825594&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[2] = L.marker([18.454982, 98.922132], {icon: icon_tera_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Wat Phra Phutthabat Takpha<br>วัดพระพุทธบาทตากผ้า</h3><a href='https://goo.gl/photos/iN4gEW5yDTSeeZrh7' target='_blank'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/090802116.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>ランプン</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=18.454982,98.922132' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=18.454982,98.922132&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[3] = L.marker([18.604784, 98.890547], {icon: icon_tera_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Wat Pa Caroen Tham<br>วัดป่าเจริญธรรม</h3><a href='https://goo.gl/photos/bGGJsTAuLeCAMwXz9' target='_blank'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/090802192.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>チェンマイ</div><div style='text-align:left; margin-top:8px;'>ミニ地獄</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=18.604784,98.890547' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=18.604784,98.890547&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[4] = L.marker([18.609238, 98.813819], {icon: icon_inori_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Monument to Thai Burmese War Victims</h3><a href='https://photos.app.goo.gl/2CgzTaASwsEntHRk6' target='_blank'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/090802238.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>チェンマイ</div><div style='text-align:left; margin-top:8px;'>タイビルマ方面戦病没者追悼の碑：バンガードウィタヤーコム中高校内、メーワン</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=18.609238,98.813819' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=18.609238,98.813819&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[5] = L.marker([18.777139, 98.984542], {icon: icon_tera_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Wat Mun San<br>วัดหมื่นสาร</h3><a href='https://goo.gl/photos/1RN6HiHeBhCsF6BD9' target='_blank'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/090802249.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>チェンマイ</div><div style='text-align:left; margin-top:8px;'>銀のお寺</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=18.777139,98.984542' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=18.777139,98.984542&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[6] = L.marker([18.778718, 98.983635], {icon: icon_tera_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Wat Sri Suphan<br>วัดศรีสุพรรณ</h3><a href='https://goo.gl/photos/KXnoPh3b7wxurZe48' target='_blank'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/090802264.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>チェンマイ</div><div style='text-align:left; margin-top:8px;'>銀のお寺、チェンマイに２箇所（知ってるだけで）ある、小坊主が一生懸命細工をしていた、本当に銀かって訊いたら（やなヤツだね）上は銀だけど下の方はアルミだ、盗られちゃうからねって返事だった</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=18.778718,98.983635' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=18.778718,98.983635&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");

if (pathPoints.length > 0) {
    var polyline = L.polyline(pathPoints, {color: '#ff0000', weight: 4, opacity: 0.8}).addTo(map);
    map.fitBounds(polyline.getBounds(), {padding: [30, 30]});
} else if (Object.keys(markers).length > 0) {
    map.fitBounds(markerGroup.getBounds(), {padding: [50, 50]});
} else {
    map.setView([13.7563, 100.5018], 6);
}

function moveToMarker(id) { 
    var m = markers[id]; 
    if(m) { map.flyTo(m.getLatLng(), 15); m.openPopup(); } 
}
</script>
</body>
</html>
