<!DOCTYPE html>
<html lang='ja'>
<head>
<meta charset='utf-8'>
<meta property="og:title" content="2009年4月1日の地図日記">
<meta property="og:type" content="website">
<title>2009年4月1日の地図日記</title>
<link rel='stylesheet' href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css' />
<script src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'></script>
<style>
    body { display: flex; height: 100vh; margin: 0; background: #111; font-family: sans-serif; }
    #map { flex: 1; }
    #sidebar { width: 200px; overflow-y: auto; background: #111; padding: 10px; border-left: 1px solid #333; }
    .photo-thumb { margin-bottom: 10px; cursor: pointer; border: 2px solid transparent; min-height: 40px; background: #222; }
    .photo-thumb:hover { border-color: #007bff; }
    .photo-thumb img { width: 100%; border-radius: 4px; display: block; }
    .thumb-label { color: #ccc; font-size: 12px; text-align: center; padding: 4px 2px; word-break: break-word; }
</style>
</head>
<body>
<div id='map'></div>
<div id='sidebar'><div style='color:white; text-align:center; margin-bottom:15px;'>2009年4月1日</div><div class='photo-thumb'><img src='https://lek3map.github.io/thailand/picture/bike.jpg' title='交通手段' alt='交通手段' onerror="this.style.display='none'"></div><div class='photo-thumb' onclick='moveToMarker(0)'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/09040105.jpg' title='Thung Song Post Office' alt='Thung Song Post Office' onerror="this.style.display='none'"><div class='thumb-label'>Thung Song Post Office</div></div><div class='photo-thumb' onclick='moveToMarker(1)'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/09040107.jpg' title='Clock Tower' alt='Clock Tower' onerror="this.style.display='none'"><div class='thumb-label'>Clock Tower</div></div><div class='photo-thumb' onclick='moveToMarker(2)'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/09040118.jpg' title='Thung Song Junction' alt='Thung Song Junction' onerror="this.style.display='none'"><div class='thumb-label'>Thung Song Junction</div></div><div class='photo-thumb' onclick='moveToMarker(3)'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/09040122.jpg' title='Khlong Chang Station' alt='Khlong Chang Station' onerror="this.style.display='none'"><div class='thumb-label'>Khlong Chang Station</div></div><div class='photo-thumb' onclick='moveToMarker(4)'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/09040132.jpg' title='Na Bon Station' alt='Na Bon Station' onerror="this.style.display='none'"><div class='thumb-label'>Na Bon Station</div></div><div class='photo-thumb' onclick='moveToMarker(5)'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/09040135.jpg' title='Lak Chang Station' alt='Lak Chang Station' onerror="this.style.display='none'"><div class='thumb-label'>Lak Chang Station</div></div><div class='photo-thumb' onclick='moveToMarker(6)'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/09040147.jpg' title='Wat That Noi' alt='Wat That Noi' onerror="this.style.display='none'"><div class='thumb-label'>Wat That Noi</div></div><div class='photo-thumb' onclick='moveToMarker(7)'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/09040169.jpg' title='Old Iron Bridge' alt='Old Iron Bridge' onerror="this.style.display='none'"><div class='thumb-label'>Old Iron Bridge</div></div><div class='photo-thumb' onclick='moveToMarker(8)'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/09040173.jpg' title='Khlong Chan Di Station' alt='Khlong Chan Di Station' onerror="this.style.display='none'"><div class='thumb-label'>Khlong Chan Di Station</div></div><div class='photo-thumb' onclick='moveToMarker(9)'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/09040177.jpg' title='Street Lamp' alt='Street Lamp' onerror="this.style.display='none'"><div class='thumb-label'>Street Lamp</div></div></div>
<script>
var map = L.map('map');
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

var markers = {};
var markerGroup = L.featureGroup().addTo(map);
var pathPoints = [];

var icon_clock_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/clock.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
var icon_gaitou_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/gaitou.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
var icon_postbox_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/postbox.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
var icon_starr_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/starr.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
var icon_station_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/station.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
var icon_tera_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/tera.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
markers[0] = L.marker([8.166074, 99.679384], {icon: icon_postbox_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Thung Song Post Office</h3><a href='https://lek3map.github.io/thailand/map/2009/picture/09040105.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/09040105.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>ナコンシータマラート</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=8.166074,99.679384' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=8.166074,99.679384&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[1] = L.marker([8.168556, 99.680436], {icon: icon_clock_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Clock Tower<br>หอนาฬิกา</h3><a href='https://lek3map.github.io/thailand/map/2009/picture/09040107.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/09040107.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>ナコンシータマラート</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=8.168556,99.680436' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=8.168556,99.680436&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[2] = L.marker([8.170882, 99.679384], {icon: icon_station_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Thung Song Junction</h3><a href='https://photos.app.goo.gl/r9fqZ5AQCtgYcvn2A' target='_blank'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/09040118.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>ナコンシータマラート</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=8.170882,99.679384' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=8.170882,99.679384&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[3] = L.marker([8.240564, 99.622489], {icon: icon_station_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Khlong Chang Station</h3><a href='https://lek3map.github.io/thailand/map/2009/picture/09040122.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/09040122.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>ナコンシータマラート</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=8.240564,99.622489' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=8.240564,99.622489&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[4] = L.marker([8.265769, 99.595797], {icon: icon_station_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Na Bon Station</h3><a href='https://lek3map.github.io/thailand/map/2009/picture/09040132.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/09040132.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>ナコンシータマラート</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=8.265769,99.595797' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=8.265769,99.595797&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[5] = L.marker([8.321741, 99.547548], {icon: icon_station_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Lak Chang Station</h3><a href='https://lek3map.github.io/thailand/map/2009/picture/09040135.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/09040135.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>ナコンシータマラート</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=8.321741,99.547548' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=8.321741,99.547548&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[6] = L.marker([8.373289, 99.543161], {icon: icon_tera_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Wat That Noi<br>วัดธาตุน้อย</h3><a href='https://photos.app.goo.gl/Cyyu75UfQ3aw42RZA' target='_blank'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/09040147.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>ナコンシータマラート</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=8.373289,99.543161' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=8.373289,99.543161&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[7] = L.marker([8.379561, 99.541669], {icon: icon_starr_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Old Iron Bridge</h3><a href='https://lek3map.github.io/thailand/map/2009/picture/09040169.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/09040169.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>ナコンシータマラート</div><div style='text-align:left; margin-top:8px;'>説明がタイ語なのでよく判らないが１００年とあるのでそのくらい経った鉄橋らしい</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=8.379561,99.541669' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=8.379561,99.541669&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[8] = L.marker([8.38178, 99.540167], {icon: icon_station_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Khlong Chan Di Station</h3><a href='https://lek3map.github.io/thailand/map/2009/picture/09040173.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/09040173.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>ナコンシータマラート</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=8.38178,99.540167' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=8.38178,99.540167&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[9] = L.marker([8.382724, 99.540403], {icon: icon_gaitou_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Street Lamp</h3><a href='https://lek3map.github.io/thailand/map/2009/picture/09040177.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/09040177.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>ナコンシータマラート</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=8.382724,99.540403' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=8.382724,99.540403&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");

if (pathPoints.length > 0) {
    var polyline = L.polyline(pathPoints, {color: '#ff0000', weight: 4, opacity: 0.8}).addTo(map);
    map.fitBounds(polyline.getBounds(), {padding: [30, 30]});
} else if (Object.keys(markers).length > 0) {
    map.fitBounds(markerGroup.getBounds(), {padding: [50, 50]});
} else {
    map.setView([13.7563, 100.5018], 6);
}

function moveToMarker(id) { 
    var m = markers[id]; 
    if(m) { map.flyTo(m.getLatLng(), 15); m.openPopup(); } 
}
</script>
</body>
</html>
