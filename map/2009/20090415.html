<!DOCTYPE html>
<html lang='ja'>
<head>
<meta charset='utf-8'>
<meta property="og:title" content="2009年4月15日の地図日記">
<meta property="og:type" content="website">
<title>2009年4月15日の地図日記</title>
<link rel='stylesheet' href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css' />
<script src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'></script>
<style>
    body { display: flex; height: 100vh; margin: 0; background: #111; font-family: sans-serif; }
    #map { flex: 1; }
    #sidebar { width: 200px; overflow-y: auto; background: #111; padding: 10px; border-left: 1px solid #333; }
    .photo-thumb { margin-bottom: 10px; cursor: pointer; border: 2px solid transparent; min-height: 40px; background: #222; }
    .photo-thumb:hover { border-color: #007bff; }
    .photo-thumb img { width: 100%; border-radius: 4px; display: block; }
    .thumb-label { color: #ccc; font-size: 12px; text-align: center; padding: 4px 2px; word-break: break-word; }
</style>
</head>
<body>
<div id='map'></div>
<div id='sidebar'><div style='color:white; text-align:center; margin-bottom:15px;'>2009年4月15日</div><div class='photo-thumb'><img src='https://lek3map.github.io/thailand/picture/bike.jpg' title='交通手段' alt='交通手段' onerror="this.style.display='none'"></div><div class='photo-thumb' onclick='moveToMarker(0)'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/09041505.jpg' title='The Southernmost Monument' alt='The Southernmost Monument' onerror="this.style.display='none'"><div class='thumb-label'>The Southernmost Monument</div></div><div class='photo-thumb' onclick='moveToMarker(1)'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/09041511.jpg' title='Clock Tower' alt='Clock Tower' onerror="this.style.display='none'"><div class='thumb-label'>Clock Tower</div></div><div class='photo-thumb' onclick='moveToMarker(2)'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/09041515.jpg' title='Largest post' alt='Largest post' onerror="this.style.display='none'"><div class='thumb-label'>Largest post</div></div><div class='photo-thumb' onclick='moveToMarker(3)'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/09041535.jpg' title='Wat Kuan Im' alt='Wat Kuan Im' onerror="this.style.display='none'"><div class='thumb-label'>Wat Kuan Im</div></div></div>
<script>
var map = L.map('map');
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

var markers = {};
var markerGroup = L.featureGroup().addTo(map);
var pathPoints = [];

var icon_clock_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/clock.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
var icon_ctemp_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/ctemp.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
var icon_sekihi_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/sekihi.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
var icon_starr_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/starr.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
markers[0] = L.marker([5.747636, 101.028492], {icon: icon_sekihi_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>The Southernmost Monument</h3><a href='https://lek3map.github.io/thailand/map/2009/picture/09041505.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/09041505.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>ヤラー</div><div style='text-align:left; margin-top:8px;'>タイ最南端の碑</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=5.747636,101.028492' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=5.747636,101.028492&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[1] = L.marker([5.771859, 101.071478], {icon: icon_clock_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Clock Tower<br>หอนาฬิกา</h3><a href='https://lek3map.github.io/thailand/map/2009/picture/09041511.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/09041511.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>ヤラー</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=5.771859,101.071478' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=5.771859,101.071478&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[2] = L.marker([5.77725, 101.073135], {icon: icon_starr_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Largest post<br>ตู้ไปรษณีย์ใหญ่ที่สุดในประเทศไทย</h3><a href='https://lek3map.github.io/thailand/map/2009/picture/09041515.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/09041515.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>ヤラー</div><div style='text-align:left; margin-top:8px;'>タイ最大のポスト</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=5.77725,101.073135' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=5.77725,101.073135&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[3] = L.marker([5.770845, 101.073972], {icon: icon_ctemp_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Wat Kuan Im<br>วัดกวนอิม</h3><a href='https://photos.app.goo.gl/ZVjHXiYWvuyyXxcq5' target='_blank'><img src='https://lek3map.github.io/thailand/map/2009/thumbs/09041535.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>ヤラー</div><div style='text-align:left; margin-top:8px;'>勿洞観音寺</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=5.770845,101.073972' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=5.770845,101.073972&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");

if (pathPoints.length > 0) {
    var polyline = L.polyline(pathPoints, {color: '#ff0000', weight: 4, opacity: 0.8}).addTo(map);
    map.fitBounds(polyline.getBounds(), {padding: [30, 30]});
} else if (Object.keys(markers).length > 0) {
    map.fitBounds(markerGroup.getBounds(), {padding: [50, 50]});
} else {
    map.setView([13.7563, 100.5018], 6);
}

function moveToMarker(id) { 
    var m = markers[id]; 
    if(m) { map.flyTo(m.getLatLng(), 15); m.openPopup(); } 
}
</script>
</body>
</html>
