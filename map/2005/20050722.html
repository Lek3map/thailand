<body>
<div id='map'></div>
<div id='sidebar'><div style='color:white; text-align:center; margin-bottom:15px;'>2005年7月22日</div><div class='photo-thumb'><img src='https://lek3map.github.io/thailand/picture/aruki.jpg' title='交通手段' alt='交通手段' onerror="this.style.display='none'"></div><div class='photo-thumb' onclick='moveToMarker(0)'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/05072208.jpg' title='Lak Muang' alt='Lak Muang' onerror="this.style.display='none'"><div class='thumb-label'>Lak Muang</div></div><div class='photo-thumb' onclick='moveToMarker(1)'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/05072211.jpg' title='Post Office' alt='Post Office' onerror="this.style.display='none'"><div class='thumb-label'>Post Office</div></div><div class='photo-thumb' onclick='moveToMarker(2)'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/05072214.jpg' title='Clock Tower' alt='Clock Tower' onerror="this.style.display='none'"><div class='thumb-label'>Clock Tower</div></div><div class='photo-thumb' onclick='moveToMarker(3)'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/05072218.jpg' title='Chumphon Station' alt='Chumphon Station' onerror="this.style.display='none'"><div class='thumb-label'>Chumphon Station</div></div><div class='photo-thumb' onclick='moveToMarker(4)'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/05072238.jpg' title='Post Office' alt='Post Office' onerror="this.style.display='none'"><div class='thumb-label'>Post Office</div></div><div class='photo-thumb' onclick='moveToMarker(5)'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/05072254.jpg' title='Lak Muang' alt='Lak Muang' onerror="this.style.display='none'"><div class='thumb-label'>Lak Muang</div></div><div style='text-align:center; margin-top:12px; padding-top:8px; border-top:1px solid #333;'><a href='../../使い方.html' style='color:#66aaff; font-size:12px;'>地図の使い方</a></div></div>
<script>
var map = L.map('map');
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'

var markers = {};
var markerGroup = L.featureGroup().addTo(map);
var pathPoints = [];

    iconUrl: 'https://lek3map.github.io/thailand/icon/clock.png',

    iconUrl: 'https://lek3map.github.io/thailand/icon/postbox.png',

var icon_station_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/station.png',
    iconSize: [30, 30],

    popupAnchor: [0, -30]
});
markers[0] = L.marker([10.493292, 99.179753], {icon: icon_lakmuang_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Lak Muang</h3><a href='https://lek3map.github.io/thailand/map/2005/picture/05072208.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/05072208.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>チュンポン</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=10.493292,99.179753' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=10.493292,99.179753&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a><br><button onclick='copyPlace(0, this)' style='margin-top:8px; padding:0 8px; font-size:12px; cursor:pointer;'>コピー</button> <button onclick='downloadPlace(0)' style='margin-top:8px; padding:0 8px; font-size:12px; cursor:pointer;'>CSVで保存</button></div>");
markers[1] = L.marker([10.493044, 99.180837], {icon: icon_postbox_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Post Office</h3><a href='https://lek3map.github.io/thailand/map/2005/picture/05072211.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/05072211.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>チュンポン</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=10.493044,99.180837' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=10.493044,99.180837&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a><br><button onclick='copyPlace(1, this)' style='margin-top:8px; padding:0 8px; font-size:12px; cursor:pointer;'>コピー</button> <button onclick='downloadPlace(1)' style='margin-top:8px; padding:0 8px; font-size:12px; cursor:pointer;'>CSVで保存</button></div>");
markers[2] = L.marker([10.49143, 99.183138], {icon: icon_clock_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Clock Tower<br>หอนาฬิกา</h3><a href='https://lek3map.github.io/thailand/map/2005/picture/05072214.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/05072214.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>チュンポン</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=10.49143,99.183138' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=10.49143,99.183138&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a><br><button onclick='copyPlace(2, this)' style='margin-top:8px; padding:0 8px; font-size:12px; cursor:pointer;'>コピー</button> <button onclick='downloadPlace(2)' style='margin-top:8px; padding:0 8px; font-size:12px; cursor:pointer;'>CSVで保存</button></div>");
markers[3] = L.marker([10.503003, 99.175998], {icon: icon_station_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Chumphon Station</h3><a href='https://lek3map.github.io/thailand/map/2005/picture/05072218.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/05072218.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>チュンポン</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=10.503003,99.175998' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=10.503003,99.175998&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a><br><button onclick='copyPlace(3, this)' style='margin-top:8px; padding:0 8px; font-size:12px; cursor:pointer;'>コピー</button> <button onclick='downloadPlace(3)' style='margin-top:8px; padding:0 8px; font-size:12px; cursor:pointer;'>CSVで保存</button></div>");
markers[4] = L.marker([11.804803, 99.798619], {icon: icon_postbox_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Post Office</h3><a href='https://lek3map.github.io/thailand/map/2005/picture/05072238.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/05072238.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>パチュアップキリカン</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=11.804803,99.798619' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=11.804803,99.798619&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a><br><button onclick='copyPlace(4, this)' style='margin-top:8px; padding:0 8px; font-size:12px; cursor:pointer;'>コピー</button> <button onclick='downloadPlace(4)' style='margin-top:8px; padding:0 8px; font-size:12px; cursor:pointer;'>CSVで保存</button></div>");
markers[5] = L.marker([11.811115, 99.796575], {icon: icon_lakmuang_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Lak Muang</h3><a href='https://lek3map.github.io/thailand/map/2005/picture/05072254.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/05072254.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>パチュアップキリカン</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=11.811115,99.796575' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=11.811115,99.796575&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a><br><button onclick='copyPlace(5, this)' style='margin-top:8px; padding:0 8px; font-size:12px; cursor:pointer;'>コピー</button> <button onclick='downloadPlace(5)' style='margin-top:8px; padding:0 8px; font-size:12px; cursor:pointer;'>CSVで保存</button></div>");
var PLACES = [{"date": "2005-07-22", "name": "Lak Muang", "tname": "", "place": "チュンポン", "des": "", "lat": 10.493292, "lon": 99.179753, "maps": "https://www.google.com/maps?q=10.493292,99.179753", "thumb": "https://lek3map.github.io/thailand/map/2005/thumbs/05072208.jpg", "album": "https://lek3map.github.io/thailand/map/2005/picture/05072208.jpg"}, {"date": "2005-07-22", "name": "Post Office", "tname": "", "place": "チュンポン", "des": "", "lat": 10.493044, "lon": 99.180837, "maps": "https://www.google.com/maps?q=10.493044,99.180837", "thumb": "https://lek3map.github.io/thailand/map/2005/thumbs/05072211.jpg", "album": "https://lek3map.github.io/thailand/map/2005/picture/05072211.jpg"}, {"date": "2005-07-22", "name": "Clock Tower", "tname": "หอนาฬิกา", "place": "チュンポン", "des": "", "lat": 10.49143, "lon": 99.183138, "maps": "https://www.google.com/maps?q=10.49143,99.183138", "thumb": "https://lek3map.github.io/thailand/map/2005/thumbs/05072214.jpg", "album": "https://lek3map.github.io/thailand/map/2005/picture/05072214.jpg"}, {"date": "2005-07-22", "name": "Chumphon Station", "tname": "", "place": "チュンポン", "des": "", "lat": 10.503003, "lon": 99.175998, "maps": "https://www.google.com/maps?q=10.503003,99.175998", "thumb": "https://lek3map.github.io/thailand/map/2005/thumbs/05072218.jpg", "album": "https://lek3map.github.io/thailand/map/2005/picture/05072218.jpg"}, {"date": "2005-07-22", "name": "Post Office", "tname": "", "place": "パチュアップキリカン", "des": "", "lat": 11.804803, "lon": 99.798619, "maps": "https://www.google.com/maps?q=11.804803,99.798619", "thumb": "https://lek3map.github.io/thailand/map/2005/thumbs/05072238.jpg", "album": "https://lek3map.github.io/thailand/map/2005/picture/05072238.jpg"}, {"date": "2005-07-22", "name": "Lak Muang", "tname": "", "place": "パチュアップキリカン", "des": "", "lat": 11.811115, "lon": 99.796575, "maps": "https://www.google.com/maps?q=11.811115,99.796575", "thumb": "https://lek3map.github.io/thailand/map/2005/thumbs/05072254.jpg", "album": "https://lek3map.github.io/thailand/map/2005/picture/05072254.jpg"}];

function placeRow(p) {
    return [p.date, p.name, p.tname, p.place, p.des, p.lat, p.lon, p.maps, p.thumb].join('\t');
}
function placeCsv(p) {
    var head = ['日付', '名前', 'タイ語名', '場所', '説明', '緯度', '経度', 'Google Maps', 'サムネイル'];
    function q(v) { return '"' + String(v).replace(/"/g, '""') + '"'; }
    var vals = [p.date, p.name, p.tname, p.place, p.des, p.lat, p.lon, p.maps, p.thumb];
    return head.map(q).join(',') + '\r\n' + vals.map(q).join(',') + '\r\n';
}
function copyPlace(i, btn) {
    var text = placeRow(PLACES[i]);
    function done() { btn.textContent = 'コピーしました'; setTimeout(function() { btn.textContent = 'コピー'; }, 2000); }
    function fallback() {
        var ta = document.createElement('textarea');
        ta.value = text; document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); done(); }
        catch (e) { btn.textContent = 'コピーできませんでした'; }
        document.body.removeChild(ta);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done).catch(fallback);
    } else { fallback(); }
}
function downloadPlace(i) {
    var p = PLACES[i];
    var blob = new Blob(['\ufeff' + placeCsv(p)], {type: 'text/csv;charset=utf-8'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = p.date.replace(/-/g, '') + '-' + (i + 1) + '.csv';
    document.body.appendChild(a); a.click();
    setTimeout(function() { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}


if (pathPoints.length > 0) {
    var polyline = L.polyline(pathPoints, {color: '#ff0000', weight: 4, opacity: 0.8}).addTo(map);
    map.fitBounds(polyline.getBounds(), {padding: [30, 30]});
} else if (Object.keys(markers).length > 0) {
    map.fitBounds(markerGroup.getBounds(), {padding: [50, 50]});
} else {
    map.setView([13.7563, 100.5018], 6);
}

function moveToMarker(id) { 
    var m = markers[id]; 
    if(m) { map.flyTo(m.getLatLng(), 15); m.openPopup(); } 
}
</script>
