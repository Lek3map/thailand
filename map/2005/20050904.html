markers[5] = L.marker([16.876146, 99.121521], {icon: icon_gate_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Welcome Gate</h3><a href='https://lek3map.github.io/thailand/map/2005/picture/050904057.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/050904057.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>ターク</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=16.876146,99.121521' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=16.876146,99.121521&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a><br><button onclick='copyPlace(5, this)' style='margin-top:8px; padding:0 8px; font-size:12px; cursor:pointer;'>コピー</button> <button onclick='downloadPlace(5)' style='margin-top:8px; padding:0 8px; font-size:12px; cursor:pointer;'>CSVで保存</button></div>");
markers[6] = L.marker([16.85588, 99.121611], {icon: icon_lakmuang_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Lak Muang</h3><a href='https://lek3map.github.io/thailand/map/2005/picture/050904062.JPG' target='_blank'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/050904062.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>ターク</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=16.85588,99.121611' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=16.85588,99.121611&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a><br><button onclick='copyPlace(6, this)' style='margin-top:8px; padding:0 8px; font-size:12px; cursor:pointer;'>コピー</button> <button onclick='downloadPlace(6)' style='margin-top:8px; padding:0 8px; font-size:12px; cursor:pointer;'>CSVで保存</button></div>");
var PLACES = [{"date": "2005-09-04", "name": "Kamphaeng Phet Market", "tname": "ตลาดศูนย์การค้าเมืองกำแพงเพชร", "place": "カムペンペット", "des": "カ ム ペ ン ペ ッ ト中央市場", "lat": 16.470993, "lon": 99.532129, "maps": "https://www.google.com/maps?q=16.470993,99.532129", "thumb": "https://lek3map.github.io/thailand/map/2005/thumbs/050904009.jpg", "album": "https://photos.app.goo.gl/jHv6xciJJDT8dLKS6"}, {"date": "2005-09-04", "name": "Bus Terminal", "tname": "", "place": "ターク", "des": "", "lat": 16.883814, "lon": 99.128373, "maps": "https://www.google.com/maps?q=16.883814,99.128373", "thumb": "https://lek3map.github.io/thailand/map/2005/thumbs/050904032.jpg", "album": "https://lek3map.github.io/thailand/map/2005/picture/050904032.jpg"}, {"date": "2005-09-04", "name": "What?", "tname": "", "place": "ターク", "des": "", "lat": 16.885693, "lon": 99.123035, "maps": "https://www.google.com/maps?q=16.885693,99.123035", "thumb": "https://lek3map.github.io/thailand/map/2005/thumbs/050904035.jpg", "album": "https://lek3map.github.io/thailand/map/2005/picture/050904035.jpg"}, {"date": "2005-09-04", "name": "KingTaksin Memorial Shrine", "tname": "ศาลสมเด็จพระเจ้าตากสินมหาราช", "place": "ターク", "des": "", "lat": 16.885785, "lon": 99.120905, "maps": "https://www.google.com/maps?q=16.885785,99.120905", "thumb": "https://lek3map.github.io/thailand/map/2005/thumbs/050904042.jpg", "album": "https://photos.app.goo.gl/vyz2BxU6d5SbQAQi8"}, {"date": "2005-09-04", "name": "Welcome Gate", "tname": "", "place": "ターク", "des": "", "lat": 16.883741, "lon": 99.118004, "maps": "https://www.google.com/maps?q=16.883741,99.118004", "thumb": "https://lek3map.github.io/thailand/map/2005/thumbs/050904056.jpg", "album": "https://lek3map.github.io/thailand/map/2005/picture/050904056.jpg"}, {"date": "2005-09-04", "name": "Welcome Gate", "tname": "", "place": "ターク", "des": "", "lat": 16.876146, "lon": 99.121521, "maps": "https://www.google.com/maps?q=16.876146,99.121521", "thumb": "https://lek3map.github.io/thailand/map/2005/thumbs/050904057.jpg", "album": "https://lek3map.github.io/thailand/map/2005/picture/050904057.jpg"}, {"date": "2005-09-04", "name": "Lak Muang", "tname": "", "place": "ターク", "des": "", "lat": 16.85588, "lon": 99.121611, "maps": "https://www.google.com/maps?q=16.85588,99.121611", "thumb": "https://lek3map.github.io/thailand/map/2005/thumbs/050904062.jpg", "album": "https://lek3map.github.io/thailand/map/2005/picture/050904062.JPG"}];

function placeRow(p) {
    return [p.date, p.name, p.tname, p.place, p.des, p.lat, p.lon, p.maps, p.thumb].join('\t');
}
function placeCsv(p) {
    var head = ['日付', '名前', 'タイ語名', '場所', '説明', '緯度', '経度', 'Google Maps', 'サムネイル'];
    function q(v) { return '"' + String(v).replace(/"/g, '""') + '"'; }
    var vals = [p.date, p.name, p.tname, p.place, p.des, p.lat, p.lon, p.maps, p.thumb];
    return head.map(q).join(',') + '\r\n' + vals.map(q).join(',') + '\r\n';
}
function copyPlace(i, btn) {
    var text = placeRow(PLACES[i]);
    function done() { btn.textContent = 'コピーしました'; setTimeout(function() { btn.textContent = 'コピー'; }, 2000); }
    function fallback() {
        var ta = document.createElement('textarea');
        ta.value = text; document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); done(); }
        catch (e) { btn.textContent = 'コピーできませんでした'; }
        document.body.removeChild(ta);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done).catch(fallback);
    } else { fallback(); }
}
function downloadPlace(i) {
    var p = PLACES[i];
    var blob = new Blob(['\ufeff' + placeCsv(p)], {type: 'text/csv;charset=utf-8'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = p.date.replace(/-/g, '') + '-' + (i + 1) + '.csv';
    document.body.appendChild(a); a.click();
    setTimeout(function() { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}


if (pathPoints.length > 0) {
    var polyline = L.polyline(pathPoints, {color: '#ff0000', weight: 4, opacity: 0.8}).addTo(map);
    map.fitBounds(polyline.getBounds(), {padding: [30, 30]});
} else if (Object.keys(markers).length > 0) {
    map.fitBounds(markerGroup.getBounds(), {padding: [50, 50]});
} else {
    map.setView([13.7563, 100.5018], 6);
}

function moveToMarker(id) { 
    var m = markers[id]; 
    if(m) { map.flyTo(m.getLatLng(), 15); m.openPopup(); } 
}
