markers[1] = L.marker([16.823839, 100.26226], {icon: icon_iseki_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Wat Phra Si Rattana Mahathat<br>วัดพระศรีรัตนมหาธาตุ</h3><a href='https://goo.gl/photos/ffTrWFfomfBjYu559' target='_blank'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/050823078.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>ピサヌローク</div><div style='text-align:left; margin-top:8px;'>県章元の仏像があるお寺 クメール遺跡: タイで最も美しい仏像のあるお寺</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=16.823839,100.26226' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=16.823839,100.26226&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a><br><button onclick='copyPlace(1, this)' style='margin-top:8px; padding:0 8px; font-size:12px; cursor:pointer;'>コピー</button> <button onclick='downloadPlace(1)' style='margin-top:8px; padding:0 8px; font-size:12px; cursor:pointer;'>CSVで保存</button></div>");
markers[2] = L.marker([16.818663, 100.279266], {icon: icon_bus_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Bus Terminal</h3><a href='https://lek3map.github.io/thailand/map/2005/picture/050823046.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/050823046.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>ピサヌローク</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=16.818663,100.279266' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=16.818663,100.279266&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a><br><button onclick='copyPlace(2, this)' style='margin-top:8px; padding:0 8px; font-size:12px; cursor:pointer;'>コピー</button> <button onclick='downloadPlace(2)' style='margin-top:8px; padding:0 8px; font-size:12px; cursor:pointer;'>CSVで保存</button></div>");

markers[5] = L.marker([16.815027, 100.265388], {icon: icon_station_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Phitsanulok Station</h3><a href='https://lek3map.github.io/thailand/map/2005/picture/050823133.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/050823133.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>ピサヌローク</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=16.815027,100.265388' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=16.815027,100.265388&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a><br><button onclick='copyPlace(5, this)' style='margin-top:8px; padding:0 8px; font-size:12px; cursor:pointer;'>コピー</button> <button onclick='downloadPlace(5)' style='margin-top:8px; padding:0 8px; font-size:12px; cursor:pointer;'>CSVで保存</button></div>");
var PLACES = [{"date": "2005-08-23", "name": "Chum Phae Bus Terminal", "tname": "", "place": "コンケン", "des": "", "lat": 16.542387, "lon": 102.100191, "maps": "https://www.google.com/maps?q=16.542387,102.100191", "thumb": "https://lek3map.github.io/thailand/map/2005/thumbs/050823014.jpg", "album": "https://lek3map.github.io/thailand/map/2005/picture/050823014.jpg"}, {"date": "2005-08-23", "name": "Wat Phra Si Rattana Mahathat", "tname": "วัดพระศรีรัตนมหาธาตุ", "place": "ピサヌローク", "des": "県章元の仏像があるお寺 クメール遺跡: タイで最も美しい仏像のあるお寺", "lat": 16.823839, "lon": 100.26226, "maps": "https://www.google.com/maps?q=16.823839,100.26226", "thumb": "https://lek3map.github.io/thailand/map/2005/thumbs/050823078.jpg", "album": "https://goo.gl/photos/ffTrWFfomfBjYu559"}, {"date": "2005-08-23", "name": "Bus Terminal", "tname": "", "place": "ピサヌローク", "des": "", "lat": 16.818663, "lon": 100.279266, "maps": "https://www.google.com/maps?q=16.818663,100.279266", "thumb": "https://lek3map.github.io/thailand/map/2005/thumbs/050823046.jpg", "album": "https://lek3map.github.io/thailand/map/2005/picture/050823046.jpg"}, {"date": "2005-08-23", "name": "Clock Tower", "tname": "หอนาฬิกา", "place": "ピサヌローク", "des": "", "lat": 16.813492, "lon": 100.262754, "maps": "https://www.google.com/maps?q=16.813492,100.262754", "thumb": "https://lek3map.github.io/thailand/map/2005/thumbs/050823053.jpg", "album": "https://lek3map.github.io/thailand/map/2005/picture/050823053.jpg"}, {"date": "2005-08-23", "name": "Lak Muang", "tname": "", "place": "ピサヌローク", "des": "", "lat": 16.824686, "lon": 100.260101, "maps": "https://www.google.com/maps?q=16.824686,100.260101", "thumb": "https://lek3map.github.io/thailand/map/2005/thumbs/050823113.jpg", "album": "https://lek3map.github.io/thailand/map/2005/picture/050823113.jpg"}, {"date": "2005-08-23", "name": "Phitsanulok Station", "tname": "", "place": "ピサヌローク", "des": "", "lat": 16.815027, "lon": 100.265388, "maps": "https://www.google.com/maps?q=16.815027,100.265388", "thumb": "https://lek3map.github.io/thailand/map/2005/thumbs/050823133.jpg", "album": "https://lek3map.github.io/thailand/map/2005/picture/050823133.jpg"}];

function placeRow(p) {
    return [p.date, p.name, p.tname, p.place, p.des, p.lat, p.lon, p.maps, p.thumb].join('\t');
}
function placeCsv(p) {
    var head = ['日付', '名前', 'タイ語名', '場所', '説明', '緯度', '経度', 'Google Maps', 'サムネイル'];
    function q(v) { return '"' + String(v).replace(/"/g, '""') + '"'; }
    var vals = [p.date, p.name, p.tname, p.place, p.des, p.lat, p.lon, p.maps, p.thumb];
    return head.map(q).join(',') + '\r\n' + vals.map(q).join(',') + '\r\n';
}
function copyPlace(i, btn) {
    var text = placeRow(PLACES[i]);
    function done() { btn.textContent = 'コピーしました'; setTimeout(function() { btn.textContent = 'コピー'; }, 2000); }
    function fallback() {
        var ta = document.createElement('textarea');
        ta.value = text; document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); done(); }
        catch (e) { btn.textContent = 'コピーできませんでした'; }
        document.body.removeChild(ta);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done).catch(fallback);
    } else { fallback(); }
}
function downloadPlace(i) {
    var p = PLACES[i];
    var blob = new Blob(['\ufeff' + placeCsv(p)], {type: 'text/csv;charset=utf-8'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = p.date.replace(/-/g, '') + '-' + (i + 1) + '.csv';
    document.body.appendChild(a); a.click();
    setTimeout(function() { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}


if (pathPoints.length > 0) {
    var polyline = L.polyline(pathPoints, {color: '#ff0000', weight: 4, opacity: 0.8}).addTo(map);
    map.fitBounds(polyline.getBounds(), {padding: [30, 30]});
} else if (Object.keys(markers).length > 0) {
    map.fitBounds(markerGroup.getBounds(), {padding: [50, 50]});
} else {
    map.setView([13.7563, 100.5018], 6);
}

function moveToMarker(id) { 
    var m = markers[id]; 
    if(m) { map.flyTo(m.getLatLng(), 15); m.openPopup(); } 
}
