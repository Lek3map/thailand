<!DOCTYPE html>
<html lang='ja'>
<head>
<meta charset='utf-8'>
<meta property="og:title" content="2005年3月21日の地図日記">
<meta property="og:type" content="website">
<title>2005年3月21日の地図日記</title>
<link rel='stylesheet' href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css' />
<script src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'></script>
<style>
    body { display: flex; height: 100vh; margin: 0; background: #111; font-family: sans-serif; }
    #map { flex: 1; }
    #sidebar { width: 200px; overflow-y: auto; background: #111; padding: 10px; border-left: 1px solid #333; }
    .photo-thumb { margin-bottom: 10px; cursor: pointer; border: 2px solid transparent; min-height: 40px; background: #222; }
    .photo-thumb:hover { border-color: #007bff; }
    .photo-thumb img { width: 100%; border-radius: 4px; display: block; }
    .thumb-label { color: #ccc; font-size: 12px; text-align: center; padding: 4px 2px; word-break: break-word; }
</style>
</head>
<body>
<div id='map'></div>
<div id='sidebar'><div style='color:white; text-align:center; margin-bottom:15px;'>2005年3月21日</div><div class='photo-thumb'><img src='https://lek3map.github.io/thailand/picture/aruki.jpg' title='交通手段' alt='交通手段' onerror="this.style.display='none'"></div><div class='photo-thumb' onclick='moveToMarker(0)'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/05032140.jpg' title='Post Office' alt='Post Office' onerror="this.style.display='none'"><div class='thumb-label'>Post Office</div></div><div class='photo-thumb' onclick='moveToMarker(1)'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/05032151.jpg' title='Lak Muang' alt='Lak Muang' onerror="this.style.display='none'"><div class='thumb-label'>Lak Muang</div></div><div class='photo-thumb' onclick='moveToMarker(2)'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/05032161.jpg' title='Praya Chai Sunthorn Monument' alt='Praya Chai Sunthorn Monument' onerror="this.style.display='none'"><div class='thumb-label'>Praya Chai Sunthorn Monument</div></div><div class='photo-thumb' onclick='moveToMarker(3)'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/05032165.jpg' title='Pong Lang Roundabout' alt='Pong Lang Roundabout' onerror="this.style.display='none'"><div class='thumb-label'>Pong Lang Roundabout</div></div><div style='text-align:center; margin-top:12px; padding-top:8px; border-top:1px solid #333;'><a href='../../使い方.html' style='color:#66aaff; font-size:12px;'>地図の使い方</a></div></div>
<script>
var map = L.map('map');
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

var markers = {};
var markerGroup = L.featureGroup().addTo(map);
var pathPoints = [];

var icon_lakmuang_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/lakmuang.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
var icon_monument_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/monument.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
var icon_postbox_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/postbox.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
var icon_starr_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/starr.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
markers[0] = L.marker([16.434045, 103.503874], {icon: icon_postbox_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Post Office</h3><a href='https://lek3map.github.io/thailand/map/2005/picture/05032140.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/05032140.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>カラシン</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=16.434045,103.503874' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=16.434045,103.503874&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a><br><button onclick='copyPlace(0, this)' style='margin-top:8px; padding:0 8px; font-size:12px; cursor:pointer;'>コピー</button> <button onclick='downloadPlace(0)' style='margin-top:8px; padding:0 8px; font-size:12px; cursor:pointer;'>CSVで保存</button></div>");
markers[1] = L.marker([16.435149, 103.50076], {icon: icon_lakmuang_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Lak Muang</h3><a href='https://lek3map.github.io/thailand/map/2005/picture/05032151.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/05032151.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>カラシン</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=16.435149,103.50076' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=16.435149,103.50076&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a><br><button onclick='copyPlace(1, this)' style='margin-top:8px; padding:0 8px; font-size:12px; cursor:pointer;'>コピー</button> <button onclick='downloadPlace(1)' style='margin-top:8px; padding:0 8px; font-size:12px; cursor:pointer;'>CSVで保存</button></div>");
markers[2] = L.marker([16.434349, 103.503573], {icon: icon_monument_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Praya Chai Sunthorn Monument</h3><a href='https://lek3map.github.io/thailand/map/2005/picture/05032161.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/05032161.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>カラシン</div><div style='text-align:left; margin-top:8px;'>プラヤー・チャイヤスントーン記念碑</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=16.434349,103.503573' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=16.434349,103.503573&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a><br><button onclick='copyPlace(2, this)' style='margin-top:8px; padding:0 8px; font-size:12px; cursor:pointer;'>コピー</button> <button onclick='downloadPlace(2)' style='margin-top:8px; padding:0 8px; font-size:12px; cursor:pointer;'>CSVで保存</button></div>");
markers[3] = L.marker([16.433549, 103.508463], {icon: icon_starr_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Pong Lang Roundabout</h3><a href='https://lek3map.github.io/thailand/map/2005/picture/05032165.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/05032165.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>カラシン</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=16.433549,103.508463' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=16.433549,103.508463&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a><br><button onclick='copyPlace(3, this)' style='margin-top:8px; padding:0 8px; font-size:12px; cursor:pointer;'>コピー</button> <button onclick='downloadPlace(3)' style='margin-top:8px; padding:0 8px; font-size:12px; cursor:pointer;'>CSVで保存</button></div>");
var PLACES = [{"date": "2005-03-21", "name": "Post Office", "tname": "", "place": "カラシン", "des": "", "lat": 16.434045, "lon": 103.503874, "maps": "https://www.google.com/maps?q=16.434045,103.503874", "thumb": "https://lek3map.github.io/thailand/map/2005/thumbs/05032140.jpg", "album": "https://lek3map.github.io/thailand/map/2005/picture/05032140.jpg"}, {"date": "2005-03-21", "name": "Lak Muang", "tname": "", "place": "カラシン", "des": "", "lat": 16.435149, "lon": 103.50076, "maps": "https://www.google.com/maps?q=16.435149,103.50076", "thumb": "https://lek3map.github.io/thailand/map/2005/thumbs/05032151.jpg", "album": "https://lek3map.github.io/thailand/map/2005/picture/05032151.jpg"}, {"date": "2005-03-21", "name": "Praya Chai Sunthorn Monument", "tname": "", "place": "カラシン", "des": "プラヤー・チャイヤスントーン記念碑", "lat": 16.434349, "lon": 103.503573, "maps": "https://www.google.com/maps?q=16.434349,103.503573", "thumb": "https://lek3map.github.io/thailand/map/2005/thumbs/05032161.jpg", "album": "https://lek3map.github.io/thailand/map/2005/picture/05032161.jpg"}, {"date": "2005-03-21", "name": "Pong Lang Roundabout", "tname": "", "place": "カラシン", "des": "", "lat": 16.433549, "lon": 103.508463, "maps": "https://www.google.com/maps?q=16.433549,103.508463", "thumb": "https://lek3map.github.io/thailand/map/2005/thumbs/05032165.jpg", "album": "https://lek3map.github.io/thailand/map/2005/picture/05032165.jpg"}];

function placeRow(p) {
    return [p.date, p.name, p.tname, p.place, p.des, p.lat, p.lon, p.maps, p.thumb].join('\t');
}
function placeCsv(p) {
    var head = ['日付', '名前', 'タイ語名', '場所', '説明', '緯度', '経度', 'Google Maps', 'サムネイル'];
    function q(v) { return '"' + String(v).replace(/"/g, '""') + '"'; }
    var vals = [p.date, p.name, p.tname, p.place, p.des, p.lat, p.lon, p.maps, p.thumb];
    return head.map(q).join(',') + '\r\n' + vals.map(q).join(',') + '\r\n';
}
function copyPlace(i, btn) {
    var text = placeRow(PLACES[i]);
    function done() { btn.textContent = 'コピーしました'; setTimeout(function() { btn.textContent = 'コピー'; }, 2000); }
    function fallback() {
        var ta = document.createElement('textarea');
        ta.value = text; document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); done(); }
        catch (e) { btn.textContent = 'コピーできませんでした'; }
        document.body.removeChild(ta);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done).catch(fallback);
    } else { fallback(); }
}
function downloadPlace(i) {
    var p = PLACES[i];
    var blob = new Blob(['\ufeff' + placeCsv(p)], {type: 'text/csv;charset=utf-8'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = p.date.replace(/-/g, '') + '-' + (i + 1) + '.csv';
    document.body.appendChild(a); a.click();
    setTimeout(function() { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}


if (pathPoints.length > 0) {
    var polyline = L.polyline(pathPoints, {color: '#ff0000', weight: 4, opacity: 0.8}).addTo(map);
    map.fitBounds(polyline.getBounds(), {padding: [30, 30]});
} else if (Object.keys(markers).length > 0) {
    map.fitBounds(markerGroup.getBounds(), {padding: [50, 50]});
} else {
    map.setView([13.7563, 100.5018], 6);
}

function moveToMarker(id) { 
    var m = markers[id]; 
    if(m) { map.flyTo(m.getLatLng(), 15); m.openPopup(); } 
}
</script>
</body>
</html>
