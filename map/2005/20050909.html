<style>

    #map { flex: 1; }

<body>
<div id='map'></div>
<div id='sidebar'><div style='color:white; text-align:center; margin-bottom:15px;'>2005年9月9日</div><div class='photo-thumb'><img src='https://lek3map.github.io/thailand/picture/aruki.jpg' title='交通手段' alt='交通手段' onerror="this.style.display='none'"></div><div class='photo-thumb' onclick='moveToMarker(0)'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/05090908.jpg' title='Bus Terminal' alt='Bus Terminal' onerror="this.style.display='none'"><div class='thumb-label'>Bus Terminal</div></div><div class='photo-thumb' onclick='moveToMarker(1)'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/05090915.jpg' title='Lak Muang' alt='Lak Muang' onerror="this.style.display='none'"><div class='thumb-label'>Lak Muang</div></div><div class='photo-thumb' onclick='moveToMarker(2)'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/05090933.jpg' title='Bus Terminal' alt='Bus Terminal' onerror="this.style.display='none'"><div class='thumb-label'>Bus Terminal</div></div><div class='photo-thumb' onclick='moveToMarker(3)'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/05090938.jpg' title='Clock Tower' alt='Clock Tower' onerror="this.style.display='none'"><div class='thumb-label'>Clock Tower</div></div><div class='photo-thumb' onclick='moveToMarker(4)'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/05090948.jpg' title='Tamarind' alt='Tamarind' onerror="this.style.display='none'"><div class='thumb-label'>Tamarind</div></div><div class='photo-thumb' onclick='moveToMarker(5)'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/05090955.jpg' title='Lak Muang' alt='Lak Muang' onerror="this.style.display='none'"><div class='thumb-label'>Lak Muang</div></div><div style='text-align:center; margin-top:12px; padding-top:8px; border-top:1px solid #333;'><a href='../../使い方.html' style='color:#66aaff; font-size:12px;'>地図の使い方</a></div></div>
<script>
var map = L.map('map');
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

var markers = {};
var markerGroup = L.featureGroup().addTo(map);
var pathPoints = [];

var icon_bus_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/bus.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
var icon_clock_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/clock.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
var icon_lakmuang_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/lakmuang.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
var icon_starr_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/starr.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
markers[0] = L.marker([16.447692, 100.333468], {icon: icon_bus_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Bus Terminal</h3><a href='https://lek3map.github.io/thailand/map/2005/picture/05090908.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/05090908.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>ピチット</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=16.447692,100.333468' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=16.447692,100.333468&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a><br><button onclick='copyPlace(0, this)' style='margin-top:8px; padding:0 8px; font-size:12px; cursor:pointer;'>コピー</button> <button onclick='downloadPlace(0)' style='margin-top:8px; padding:0 8px; font-size:12px; cursor:pointer;'>CSVで保存</button></div>");
markers[1] = L.marker([16.412095, 100.292362], {icon: icon_lakmuang_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Lak Muang</h3><a href='https://lek3map.github.io/thailand/map/2005/picture/05090915.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/05090915.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>ピチット</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=16.412095,100.292362' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=16.412095,100.292362&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a><br><button onclick='copyPlace(1, this)' style='margin-top:8px; padding:0 8px; font-size:12px; cursor:pointer;'>コピー</button> <button onclick='downloadPlace(1)' style='margin-top:8px; padding:0 8px; font-size:12px; cursor:pointer;'>CSVで保存</button></div>");
markers[2] = L.marker([16.417865, 101.151627], {icon: icon_bus_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Bus Terminal</h3><a href='https://lek3map.github.io/thailand/map/2005/picture/05090933.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/05090933.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>ペチャブン</div><div style='text-align:left; margin-top:8px;'>バスターミナル前の三輪車</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=16.417865,101.151627' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=16.417865,101.151627&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a><br><button onclick='copyPlace(2, this)' style='margin-top:8px; padding:0 8px; font-size:12px; cursor:pointer;'>コピー</button> <button onclick='downloadPlace(2)' style='margin-top:8px; padding:0 8px; font-size:12px; cursor:pointer;'>CSVで保存</button></div>");
markers[3] = L.marker([16.418956, 101.155071], {icon: icon_clock_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Clock Tower<br>หอนาฬิกา</h3><a href='https://lek3map.github.io/thailand/map/2005/picture/05090938.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/05090938.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>ペチャブン</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=16.418956,101.155071' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=16.418956,101.155071&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a><br><button onclick='copyPlace(3, this)' style='margin-top:8px; padding:0 8px; font-size:12px; cursor:pointer;'>コピー</button> <button onclick='downloadPlace(3)' style='margin-top:8px; padding:0 8px; font-size:12px; cursor:pointer;'>CSVで保存</button></div>");
markers[4] = L.marker([16.420415, 101.159736], {icon: icon_starr_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Tamarind</h3><a href='https://lek3map.github.io/thailand/map/2005/picture/05090948.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/05090948.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>ペチャブン</div><div style='text-align:left; margin-top:8px;'>ペチャブンはマカムの里なんだそうです</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=16.420415,101.159736' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=16.420415,101.159736&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a><br><button onclick='copyPlace(4, this)' style='margin-top:8px; padding:0 8px; font-size:12px; cursor:pointer;'>コピー</button> <button onclick='downloadPlace(4)' style='margin-top:8px; padding:0 8px; font-size:12px; cursor:pointer;'>CSVで保存</button></div>");
markers[5] = L.marker([16.420932, 101.160167], {icon: icon_lakmuang_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Lak Muang</h3><a href='https://lek3map.github.io/thailand/map/2005/picture/05090955.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/05090955.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>ペチャブン</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=16.420932,101.160167' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=16.420932,101.160167&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a><br><button onclick='copyPlace(5, this)' style='margin-top:8px; padding:0 8px; font-size:12px; cursor:pointer;'>コピー</button> <button onclick='downloadPlace(5)' style='margin-top:8px; padding:0 8px; font-size:12px; cursor:pointer;'>CSVで保存</button></div>");
var PLACES = [{"date": "2005-09-09", "name": "Bus Terminal", "tname": "", "place": "ピチット", "des": "", "lat": 16.447692, "lon": 100.333468, "maps": "https://www.google.com/maps?q=16.447692,100.333468", "thumb": "https://lek3map.github.io/thailand/map/2005/thumbs/05090908.jpg", "album": "https://lek3map.github.io/thailand/map/2005/picture/05090908.jpg"}, {"date": "2005-09-09", "name": "Lak Muang", "tname": "", "place": "ピチット", "des": "", "lat": 16.412095, "lon": 100.292362, "maps": "https://www.google.com/maps?q=16.412095,100.292362", "thumb": "https://lek3map.github.io/thailand/map/2005/thumbs/05090915.jpg", "album": "https://lek3map.github.io/thailand/map/2005/picture/05090915.jpg"}, {"date": "2005-09-09", "name": "Bus Terminal", "tname": "", "place": "ペチャブン", "des": "バスターミナル前の三輪車", "lat": 16.417865, "lon": 101.151627, "maps": "https://www.google.com/maps?q=16.417865,101.151627", "thumb": "https://lek3map.github.io/thailand/map/2005/thumbs/05090933.jpg", "album": "https://lek3map.github.io/thailand/map/2005/picture/05090933.jpg"}, {"date": "2005-09-09", "name": "Clock Tower", "tname": "หอนาฬิกา", "place": "ペチャブン", "des": "", "lat": 16.418956, "lon": 101.155071, "maps": "https://www.google.com/maps?q=16.418956,101.155071", "thumb": "https://lek3map.github.io/thailand/map/2005/thumbs/05090938.jpg", "album": "https://lek3map.github.io/thailand/map/2005/picture/05090938.jpg"}, {"date": "2005-09-09", "name": "Tamarind", "tname": "", "place": "ペチャブン", "des": "ペチャブンはマカムの里なんだそうです", "lat": 16.420415, "lon": 101.159736, "maps": "https://www.google.com/maps?q=16.420415,101.159736", "thumb": "https://lek3map.github.io/thailand/map/2005/thumbs/05090948.jpg", "album": "https://lek3map.github.io/thailand/map/2005/picture/05090948.jpg"}, {"date": "2005-09-09", "name": "Lak Muang", "tname": "", "place": "ペチャブン", "des": "", "lat": 16.420932, "lon": 101.160167, "maps": "https://www.google.com/maps?q=16.420932,101.160167", "thumb": "https://lek3map.github.io/thailand/map/2005/thumbs/05090955.jpg", "album": "https://lek3map.github.io/thailand/map/2005/picture/05090955.jpg"}];

function placeRow(p) {
    return [p.date, p.name, p.tname, p.place, p.des, p.lat, p.lon, p.maps, p.thumb].join('\t');
}
function placeCsv(p) {
    var head = ['日付', '名前', 'タイ語名', '場所', '説明', '緯度', '経度', 'Google Maps', 'サムネイル'];
    function q(v) { return '"' + String(v).replace(/"/g, '""') + '"'; }
    var vals = [p.date, p.name, p.tname, p.place, p.des, p.lat, p.lon, p.maps, p.thumb];
    return head.map(q).join(',') + '\r\n' + vals.map(q).join(',') + '\r\n';
}
function copyPlace(i, btn) {
    var text = placeRow(PLACES[i]);
    function done() { btn.textContent = 'コピーしました'; setTimeout(function() { btn.textContent = 'コピー'; }, 2000); }
    function fallback() {
        var ta = document.createElement('textarea');
        ta.value = text; document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); done(); }
        catch (e) { btn.textContent = 'コピーできませんでした'; }
        document.body.removeChild(ta);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done).catch(fallback);
    } else { fallback(); }
}
function downloadPlace(i) {
    var p = PLACES[i];
    var blob = new Blob(['\ufeff' + placeCsv(p)], {type: 'text/csv;charset=utf-8'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = p.date.replace(/-/g, '') + '-' + (i + 1) + '.csv';
    document.body.appendChild(a); a.click();
    setTimeout(function() { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}


if (pathPoints.length > 0) {
    var polyline = L.polyline(pathPoints, {color: '#ff0000', weight: 4, opacity: 0.8}).addTo(map);
    map.fitBounds(polyline.getBounds(), {padding: [30, 30]});
} else if (Object.keys(markers).length > 0) {
    map.fitBounds(markerGroup.getBounds(), {padding: [50, 50]});
} else {
    map.setView([13.7563, 100.5018], 6);
}

function moveToMarker(id) { 
    var m = markers[id]; 
    if(m) { map.flyTo(m.getLatLng(), 15); m.openPopup(); } 
}
</script>
