markers[6] = L.marker([17.866882, 102.746281], {icon: icon_lakmuang_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Lak Muang</h3><a href='https://lek3map.github.io/thailand/map/2005/picture/05032970.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/05032970.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>ノンカイ</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=17.866882,102.746281' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=17.866882,102.746281&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a><br><button onclick='copyPlace(6, this)' style='margin-top:8px; padding:0 8px; font-size:12px; cursor:pointer;'>コピー</button> <button onclick='downloadPlace(6)' style='margin-top:8px; padding:0 8px; font-size:12px; cursor:pointer;'>CSVで保存</button></div>");
var PLACES = [{"date": "2005-03-29", "name": "Bus Terminal", "tname": "", "place": "ノンブアランプー", "des": "", "lat": 17.188519, "lon": 102.437854, "maps": "https://www.google.com/maps?q=17.188519,102.437854", "thumb": "https://lek3map.github.io/thailand/map/2005/thumbs/05032920.jpg", "album": "https://lek3map.github.io/thailand/map/2005/picture/05032920.jpg"}, {"date": "2005-03-29", "name": "Post Office", "tname": "", "place": "ノンブアランプー", "des": "", "lat": 17.200777, "lon": 102.441394, "maps": "https://www.google.com/maps?q=17.200777,102.441394", "thumb": "https://lek3map.github.io/thailand/map/2005/thumbs/05032931.jpg", "album": "https://lek3map.github.io/thailand/map/2005/picture/05032931.jpg"}, {"date": "2005-03-29", "name": "Lak Muang", "tname": "", "place": "ノンブアランプー", "des": "", "lat": 17.210449, "lon": 102.438768, "maps": "https://www.google.com/maps?q=17.210449,102.438768", "thumb": "https://lek3map.github.io/thailand/map/2005/thumbs/05032948.jpg", "album": "https://lek3map.github.io/thailand/map/2005/picture/05032948.jpg"}, {"date": "2005-03-29", "name": "23rd Wing", "tname": "", "place": "ウドンタニ", "des": "第２３航空団", "lat": 17.379484, "lon": 102.8067, "maps": "https://www.google.com/maps?q=17.379484,102.8067", "thumb": "https://lek3map.github.io/thailand/map/2005/thumbs/05032954.jpg", "album": "https://lek3map.github.io/thailand/map/2005/picture/05032954.jpg"}, {"date": "2005-03-29", "name": "Bus Terminal", "tname": "", "place": "ノンカイ", "des": "", "lat": 17.884976, "lon": 102.755068, "maps": "https://www.google.com/maps?q=17.884976,102.755068", "thumb": "https://lek3map.github.io/thailand/map/2005/thumbs/05032959.jpg", "album": "https://lek3map.github.io/thailand/map/2005/picture/05032959.jpg"}, {"date": "2005-03-29", "name": "Post Office", "tname": "", "place": "ノンカイ", "des": "", "lat": 17.88382, "lon": 102.755068, "maps": "https://www.google.com/maps?q=17.88382,102.755068", "thumb": "https://lek3map.github.io/thailand/map/2005/thumbs/05032962.jpg", "album": "https://lek3map.github.io/thailand/map/2005/picture/05032962.jpg"}, {"date": "2005-03-29", "name": "Lak Muang", "tname": "", "place": "ノンカイ", "des": "", "lat": 17.866882, "lon": 102.746281, "maps": "https://www.google.com/maps?q=17.866882,102.746281", "thumb": "https://lek3map.github.io/thailand/map/2005/thumbs/05032970.jpg", "album": "https://lek3map.github.io/thailand/map/2005/picture/05032970.jpg"}];

function placeRow(p) {
    return [p.date, p.name, p.tname, p.place, p.des, p.lat, p.lon, p.maps, p.thumb].join('\t');
}
function placeCsv(p) {
    var head = ['日付', '名前', 'タイ語名', '場所', '説明', '緯度', '経度', 'Google Maps', 'サムネイル'];
    function q(v) { return '"' + String(v).replace(/"/g, '""') + '"'; }
    var vals = [p.date, p.name, p.tname, p.place, p.des, p.lat, p.lon, p.maps, p.thumb];
    return head.map(q).join(',') + '\r\n' + vals.map(q).join(',') + '\r\n';
}
function copyPlace(i, btn) {
    var text = placeRow(PLACES[i]);
    function done() { btn.textContent = 'コピーしました'; setTimeout(function() { btn.textContent = 'コピー'; }, 2000); }
    function fallback() {
        var ta = document.createElement('textarea');
        ta.value = text; document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); done(); }
        catch (e) { btn.textContent = 'コピーできませんでした'; }
        document.body.removeChild(ta);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done).catch(fallback);
    } else { fallback(); }
}
function downloadPlace(i) {
    var p = PLACES[i];
    var blob = new Blob(['\ufeff' + placeCsv(p)], {type: 'text/csv;charset=utf-8'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = p.date.replace(/-/g, '') + '-' + (i + 1) + '.csv';
    document.body.appendChild(a); a.click();
    setTimeout(function() { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}


if (pathPoints.length > 0) {
    var polyline = L.polyline(pathPoints, {color: '#ff0000', weight: 4, opacity: 0.8}).addTo(map);
    map.fitBounds(polyline.getBounds(), {padding: [30, 30]});
} else if (Object.keys(markers).length > 0) {
    map.fitBounds(markerGroup.getBounds(), {padding: [50, 50]});
} else {
    map.setView([13.7563, 100.5018], 6);
}

function moveToMarker(id) { 
    var m = markers[id]; 
    if(m) { map.flyTo(m.getLatLng(), 15); m.openPopup(); } 
}
