<!DOCTYPE html>
<html lang='ja'>
<head>
<meta charset='utf-8'>
<meta property="og:title" content="2005年3月18日の地図日記">
<meta property="og:type" content="website">
<title>2005年3月18日の地図日記</title>
<link rel='stylesheet' href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css' />
<script src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'></script>
<style>
    body { display: flex; height: 100vh; margin: 0; background: #111; font-family: sans-serif; }
    #map { flex: 1; }
    #sidebar { width: 200px; overflow-y: auto; background: #111; padding: 10px; border-left: 1px solid #333; }
    .photo-thumb { margin-bottom: 10px; cursor: pointer; border: 2px solid transparent; min-height: 40px; background: #222; }
    .photo-thumb:hover { border-color: #007bff; }
    .photo-thumb img { width: 100%; border-radius: 4px; display: block; }
    .thumb-label { color: #ccc; font-size: 12px; text-align: center; padding: 4px 2px; word-break: break-word; }
</style>
</head>
<body>
<div id='map'></div>
<div id='sidebar'><div style='color:white; text-align:center; margin-bottom:15px;'>2005年3月18日</div><div class='photo-thumb'><img src='https://lek3map.github.io/thailand/picture/aruki.jpg' title='交通手段' alt='交通手段' onerror="this.style.display='none'"></div><div class='photo-thumb' onclick='moveToMarker(0)'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/05031820.jpg' title='Lak Muang' alt='Lak Muang' onerror="this.style.display='none'"><div class='thumb-label'>Lak Muang</div></div><div class='photo-thumb' onclick='moveToMarker(1)'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/05031825.jpg' title='Wat Phrathat Choeng Chum Worawihan' alt='Wat Phrathat Choeng Chum Worawihan' onerror="this.style.display='none'"><div class='thumb-label'>Wat Phrathat Choeng Chum Worawihan</div></div><div class='photo-thumb' onclick='moveToMarker(2)'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/05031844.jpg' title='Sakon Nakhon Gate' alt='Sakon Nakhon Gate' onerror="this.style.display='none'"><div class='thumb-label'>Sakon Nakhon Gate</div></div><div class='photo-thumb' onclick='moveToMarker(3)'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/05031848.jpg' title='Ancient Khmer Bridge' alt='Ancient Khmer Bridge' onerror="this.style.display='none'"><div class='thumb-label'>Ancient Khmer Bridge</div></div><div class='photo-thumb' onclick='moveToMarker(4)'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/05031858.jpg' title='Post Office' alt='Post Office' onerror="this.style.display='none'"><div class='thumb-label'>Post Office</div></div><div style='text-align:center; margin-top:12px; padding-top:8px; border-top:1px solid #333;'><a href='../../使い方.html' style='color:#66aaff; font-size:12px;'>地図の使い方</a></div></div>
<script>
var map = L.map('map');
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

var markers = {};
var markerGroup = L.featureGroup().addTo(map);
var pathPoints = [];

var icon_iseki_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/iseki.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
var icon_lakmuang_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/lakmuang.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
var icon_postbox_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/postbox.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
var icon_starr_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/starr.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
markers[0] = L.marker([17.160469, 104.155256], {icon: icon_lakmuang_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Lak Muang</h3><a href='https://lek3map.github.io/thailand/map/2005/picture/05031820.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/05031820.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>サコンナコン</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=17.160469,104.155256' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=17.160469,104.155256&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a><br><button onclick='copyPlace(0, this)' style='margin-top:8px; padding:0 8px; font-size:12px; cursor:pointer;'>コピー</button> <button onclick='downloadPlace(0)' style='margin-top:8px; padding:0 8px; font-size:12px; cursor:pointer;'>CSVで保存</button></div>");
markers[1] = L.marker([17.164205, 104.152944], {icon: icon_iseki_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Wat Phrathat Choeng Chum Worawihan<br>วัดพระธาตุเชิงชุมวรวิหาร</h3><a href='https://goo.gl/photos/prpUw8K4HXxnP9q7A' target='_blank'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/05031825.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>サコンナコン</div><div style='text-align:left; margin-top:8px;'>第二級王室仏教寺院 この仏塔が県章元 クメール遺跡</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=17.164205,104.152944' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=17.164205,104.152944&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a><br><button onclick='copyPlace(1, this)' style='margin-top:8px; padding:0 8px; font-size:12px; cursor:pointer;'>コピー</button> <button onclick='downloadPlace(1)' style='margin-top:8px; padding:0 8px; font-size:12px; cursor:pointer;'>CSVで保存</button></div>");
markers[2] = L.marker([17.169587, 104.143138], {icon: icon_starr_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Sakon Nakhon Gate</h3><a href='https://lek3map.github.io/thailand/map/2005/picture/05031844.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/05031844.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>サコンナコン</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=17.169587,104.143138' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=17.169587,104.143138&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a><br><button onclick='copyPlace(2, this)' style='margin-top:8px; padding:0 8px; font-size:12px; cursor:pointer;'>コピー</button> <button onclick='downloadPlace(2)' style='margin-top:8px; padding:0 8px; font-size:12px; cursor:pointer;'>CSVで保存</button></div>");
markers[3] = L.marker([17.170074, 104.14015], {icon: icon_iseki_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Ancient Khmer Bridge<br>สะพานขอมโบราณ</h3><a href='https://photos.app.goo.gl/kM4vU8Hv9JJoh3wY8' target='_blank'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/05031848.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>サコンナコン</div><div style='text-align:left; margin-top:8px;'>古代橋</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=17.170074,104.14015' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=17.170074,104.14015&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a><br><button onclick='copyPlace(3, this)' style='margin-top:8px; padding:0 8px; font-size:12px; cursor:pointer;'>コピー</button> <button onclick='downloadPlace(3)' style='margin-top:8px; padding:0 8px; font-size:12px; cursor:pointer;'>CSVで保存</button></div>");
markers[4] = L.marker([17.167947, 104.143487], {icon: icon_postbox_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Post Office</h3><a href='https://lek3map.github.io/thailand/map/2005/picture/05031858.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/05031858.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>サコンナコン</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=17.167947,104.143487' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=17.167947,104.143487&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a><br><button onclick='copyPlace(4, this)' style='margin-top:8px; padding:0 8px; font-size:12px; cursor:pointer;'>コピー</button> <button onclick='downloadPlace(4)' style='margin-top:8px; padding:0 8px; font-size:12px; cursor:pointer;'>CSVで保存</button></div>");
var PLACES = [{"date": "2005-03-18", "name": "Lak Muang", "tname": "", "place": "サコンナコン", "des": "", "lat": 17.160469, "lon": 104.155256, "maps": "https://www.google.com/maps?q=17.160469,104.155256", "thumb": "https://lek3map.github.io/thailand/map/2005/thumbs/05031820.jpg", "album": "https://lek3map.github.io/thailand/map/2005/picture/05031820.jpg"}, {"date": "2005-03-18", "name": "Wat Phrathat Choeng Chum Worawihan", "tname": "วัดพระธาตุเชิงชุมวรวิหาร", "place": "サコンナコン", "des": "第二級王室仏教寺院 この仏塔が県章元 クメール遺跡", "lat": 17.164205, "lon": 104.152944, "maps": "https://www.google.com/maps?q=17.164205,104.152944", "thumb": "https://lek3map.github.io/thailand/map/2005/thumbs/05031825.jpg", "album": "https://goo.gl/photos/prpUw8K4HXxnP9q7A"}, {"date": "2005-03-18", "name": "Sakon Nakhon Gate", "tname": "", "place": "サコンナコン", "des": "", "lat": 17.169587, "lon": 104.143138, "maps": "https://www.google.com/maps?q=17.169587,104.143138", "thumb": "https://lek3map.github.io/thailand/map/2005/thumbs/05031844.jpg", "album": "https://lek3map.github.io/thailand/map/2005/picture/05031844.jpg"}, {"date": "2005-03-18", "name": "Ancient Khmer Bridge", "tname": "สะพานขอมโบราณ", "place": "サコンナコン", "des": "古代橋", "lat": 17.170074, "lon": 104.14015, "maps": "https://www.google.com/maps?q=17.170074,104.14015", "thumb": "https://lek3map.github.io/thailand/map/2005/thumbs/05031848.jpg", "album": "https://photos.app.goo.gl/kM4vU8Hv9JJoh3wY8"}, {"date": "2005-03-18", "name": "Post Office", "tname": "", "place": "サコンナコン", "des": "", "lat": 17.167947, "lon": 104.143487, "maps": "https://www.google.com/maps?q=17.167947,104.143487", "thumb": "https://lek3map.github.io/thailand/map/2005/thumbs/05031858.jpg", "album": "https://lek3map.github.io/thailand/map/2005/picture/05031858.jpg"}];

function placeRow(p) {
    return [p.date, p.name, p.tname, p.place, p.des, p.lat, p.lon, p.maps, p.thumb].join('\t');
}
function placeCsv(p) {
    var head = ['日付', '名前', 'タイ語名', '場所', '説明', '緯度', '経度', 'Google Maps', 'サムネイル'];
    function q(v) { return '"' + String(v).replace(/"/g, '""') + '"'; }
    var vals = [p.date, p.name, p.tname, p.place, p.des, p.lat, p.lon, p.maps, p.thumb];
    return head.map(q).join(',') + '\r\n' + vals.map(q).join(',') + '\r\n';
}
function copyPlace(i, btn) {
    var text = placeRow(PLACES[i]);
    function done() { btn.textContent = 'コピーしました'; setTimeout(function() { btn.textContent = 'コピー'; }, 2000); }
    function fallback() {
        var ta = document.createElement('textarea');
        ta.value = text; document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); done(); }
        catch (e) { btn.textContent = 'コピーできませんでした'; }
        document.body.removeChild(ta);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done).catch(fallback);
    } else { fallback(); }
}
function downloadPlace(i) {
    var p = PLACES[i];
    var blob = new Blob(['\ufeff' + placeCsv(p)], {type: 'text/csv;charset=utf-8'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = p.date.replace(/-/g, '') + '-' + (i + 1) + '.csv';
    document.body.appendChild(a); a.click();
    setTimeout(function() { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}


if (pathPoints.length > 0) {
    var polyline = L.polyline(pathPoints, {color: '#ff0000', weight: 4, opacity: 0.8}).addTo(map);
    map.fitBounds(polyline.getBounds(), {padding: [30, 30]});
} else if (Object.keys(markers).length > 0) {
    map.fitBounds(markerGroup.getBounds(), {padding: [50, 50]});
} else {
    map.setView([13.7563, 100.5018], 6);
}

function moveToMarker(id) { 
    var m = markers[id]; 
    if(m) { map.flyTo(m.getLatLng(), 15); m.openPopup(); } 
}
</script>
</body>
</html>
