<!DOCTYPE html>
<html lang='ja'>
<head>
<meta charset='utf-8'>
<meta property="og:title" content="2005年11月10日の地図日記">
<meta property="og:type" content="website">
<title>2005年11月10日の地図日記</title>
<link rel='stylesheet' href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css' />
<script src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'></script>
<style>
    body { display: flex; height: 100vh; margin: 0; background: #111; font-family: sans-serif; }
    #map { flex: 1; }
    #sidebar { width: 200px; overflow-y: auto; background: #111; padding: 10px; border-left: 1px solid #333; }
    .photo-thumb { margin-bottom: 10px; cursor: pointer; border: 2px solid transparent; min-height: 40px; background: #222; }
    .photo-thumb:hover { border-color: #007bff; }
    .photo-thumb img { width: 100%; border-radius: 4px; display: block; }
    .thumb-label { color: #ccc; font-size: 12px; text-align: center; padding: 4px 2px; word-break: break-word; }
</style>
</head>
<body>
<div id='map'></div>
<div id='sidebar'><div style='color:white; text-align:center; margin-bottom:15px;'>2005年11月10日</div><div class='photo-thumb'><img src='https://lek3map.github.io/thailand/picture/aruki.jpg' title='交通手段' alt='交通手段' onerror="this.style.display='none'"></div><div class='photo-thumb' onclick='moveToMarker(0)'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/05111008.jpg' title='Wat Klang Ming Muang' alt='Wat Klang Ming Muang' onerror="this.style.display='none'"><div class='thumb-label'>Wat Klang Ming Muang</div></div><div class='photo-thumb' onclick='moveToMarker(1)'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/05111037.jpg' title='Aquarium' alt='Aquarium' onerror="this.style.display='none'"><div class='thumb-label'>Aquarium</div></div><div class='photo-thumb' onclick='moveToMarker(2)'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/05111051.jpg' title='Wat Nuea' alt='Wat Nuea' onerror="this.style.display='none'"><div class='thumb-label'>Wat Nuea</div></div><div style='text-align:center; margin-top:12px; padding-top:8px; border-top:1px solid #333;'><a href='../../使い方.html' style='color:#66aaff; font-size:12px;'>地図の使い方</a></div></div>
<script>
var map = L.map('map');
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

var markers = {};
var markerGroup = L.featureGroup().addTo(map);
var pathPoints = [];

var icon_tera_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/tera.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
var icon_yakata_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/yakata.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
markers[0] = L.marker([16.061779, 103.65416], {icon: icon_tera_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Wat Klang Ming Muang<br>วัดกลางมิ่งเมือง</h3><a href='https://photos.app.goo.gl/rakhd8n4dBBFmSpj8' target='_blank'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/05111008.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>ロイエット</div><div style='text-align:left; margin-top:8px;'>第三級王室仏教寺院 シム</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=16.061779,103.65416' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=16.061779,103.65416&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a><br><button onclick='copyPlace(0, this)' style='margin-top:8px; padding:0 8px; font-size:12px; cursor:pointer;'>コピー</button> <button onclick='downloadPlace(0)' style='margin-top:8px; padding:0 8px; font-size:12px; cursor:pointer;'>CSVで保存</button></div>");
markers[1] = L.marker([16.055856, 103.650137], {icon: icon_yakata_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Aquarium<br>สถานแสดงพันธุ์สัตว์น้ำเทศบาลเมืองร้อยเอ็ด</h3><a href='https://photos.app.goo.gl/c8mDbj2mD5363NfZA' target='_blank'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/05111037.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>ロイエット</div><div style='text-align:left; margin-top:8px;'>２００５年当時入場料は２０Ｂだった、でもタダで入れてもらったんでこの場を借りて宣伝しておく、期待して入っちゃ駄目だぞ、ロイエットに来たついでに入ってみましたぐらいがいい</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=16.055856,103.650137' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=16.055856,103.650137&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a><br><button onclick='copyPlace(1, this)' style='margin-top:8px; padding:0 8px; font-size:12px; cursor:pointer;'>コピー</button> <button onclick='downloadPlace(1)' style='margin-top:8px; padding:0 8px; font-size:12px; cursor:pointer;'>CSVで保存</button></div>");
markers[2] = L.marker([16.060506, 103.645997], {icon: icon_tera_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Wat Nuea<br>วัดเหนือ</h3><a href='https://photos.app.goo.gl/bWKf2bDaNCyvDMmM6' target='_blank'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/05111051.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>ロイエット</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=16.060506,103.645997' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=16.060506,103.645997&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a><br><button onclick='copyPlace(2, this)' style='margin-top:8px; padding:0 8px; font-size:12px; cursor:pointer;'>コピー</button> <button onclick='downloadPlace(2)' style='margin-top:8px; padding:0 8px; font-size:12px; cursor:pointer;'>CSVで保存</button></div>");
var PLACES = [{"date": "2005-11-10", "name": "Wat Klang Ming Muang", "tname": "วัดกลางมิ่งเมือง", "place": "ロイエット", "des": "第三級王室仏教寺院 シム", "lat": 16.061779, "lon": 103.65416, "maps": "https://www.google.com/maps?q=16.061779,103.65416", "thumb": "https://lek3map.github.io/thailand/map/2005/thumbs/05111008.jpg", "album": "https://photos.app.goo.gl/rakhd8n4dBBFmSpj8"}, {"date": "2005-11-10", "name": "Aquarium", "tname": "สถานแสดงพันธุ์สัตว์น้ำเทศบาลเมืองร้อยเอ็ด", "place": "ロイエット", "des": "２００５年当時入場料は２０Ｂだった、でもタダで入れてもらったんでこの場を借りて宣伝しておく、期待して入っちゃ駄目だぞ、ロイエットに来たついでに入ってみましたぐらいがいい", "lat": 16.055856, "lon": 103.650137, "maps": "https://www.google.com/maps?q=16.055856,103.650137", "thumb": "https://lek3map.github.io/thailand/map/2005/thumbs/05111037.jpg", "album": "https://photos.app.goo.gl/c8mDbj2mD5363NfZA"}, {"date": "2005-11-10", "name": "Wat Nuea", "tname": "วัดเหนือ", "place": "ロイエット", "des": "", "lat": 16.060506, "lon": 103.645997, "maps": "https://www.google.com/maps?q=16.060506,103.645997", "thumb": "https://lek3map.github.io/thailand/map/2005/thumbs/05111051.jpg", "album": "https://photos.app.goo.gl/bWKf2bDaNCyvDMmM6"}];

function placeRow(p) {
    return [p.date, p.name, p.tname, p.place, p.des, p.lat, p.lon, p.maps, p.thumb].join('\t');
}
function placeCsv(p) {
    var head = ['日付', '名前', 'タイ語名', '場所', '説明', '緯度', '経度', 'Google Maps', 'サムネイル'];
    function q(v) { return '"' + String(v).replace(/"/g, '""') + '"'; }
    var vals = [p.date, p.name, p.tname, p.place, p.des, p.lat, p.lon, p.maps, p.thumb];
    return head.map(q).join(',') + '\r\n' + vals.map(q).join(',') + '\r\n';
}
function copyPlace(i, btn) {
    var text = placeRow(PLACES[i]);
    function done() { btn.textContent = 'コピーしました'; setTimeout(function() { btn.textContent = 'コピー'; }, 2000); }
    function fallback() {
        var ta = document.createElement('textarea');
        ta.value = text; document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); done(); }
        catch (e) { btn.textContent = 'コピーできませんでした'; }
        document.body.removeChild(ta);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done).catch(fallback);
    } else { fallback(); }
}
function downloadPlace(i) {
    var p = PLACES[i];
    var blob = new Blob(['\ufeff' + placeCsv(p)], {type: 'text/csv;charset=utf-8'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = p.date.replace(/-/g, '') + '-' + (i + 1) + '.csv';
    document.body.appendChild(a); a.click();
    setTimeout(function() { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}


if (pathPoints.length > 0) {
    var polyline = L.polyline(pathPoints, {color: '#ff0000', weight: 4, opacity: 0.8}).addTo(map);
    map.fitBounds(polyline.getBounds(), {padding: [30, 30]});
} else if (Object.keys(markers).length > 0) {
    map.fitBounds(markerGroup.getBounds(), {padding: [50, 50]});
} else {
    map.setView([13.7563, 100.5018], 6);
}

function moveToMarker(id) { 
    var m = markers[id]; 
    if(m) { map.flyTo(m.getLatLng(), 15); m.openPopup(); } 
}
</script>
</body>
</html>
