<link rel='stylesheet' href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css' />
<script src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'></script>
<style>
    body { display: flex; height: 100vh; margin: 0; background: #111; font-family: sans-serif; }
    #map { flex: 1; }
    #sidebar { width: 200px; overflow-y: auto; background: #111; padding: 10px; border-left: 1px solid #333; }
    .photo-thumb { margin-bottom: 10px; cursor: pointer; border: 2px solid transparent; min-height: 40px; background: #222; }
    .photo-thumb:hover { border-color: #007bff; }
    .photo-thumb img { width: 100%; border-radius: 4px; display: block; }
    .thumb-label { color: #ccc; font-size: 12px; text-align: center; padding: 4px 2px; word-break: break-word; }

<body>
<div id='map'></div>
<div id='sidebar'><div style='color:white; text-align:center; margin-bottom:15px;'>2005年3月19日</div><div class='photo-thumb'><img src='https://lek3map.github.io/thailand/picture/aruki.jpg' title='交通手段' alt='交通手段' onerror="this.style.display='none'"></div><div class='photo-thumb' onclick='moveToMarker(0)'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/05031909.jpg' title='Post Office' alt='Post Office' onerror="this.style.display='none'"><div class='thumb-label'>Post Office</div></div><div class='photo-thumb' onclick='moveToMarker(1)'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/05031913.jpg' title='Chaloem Phra Kiat National Library' alt='Chaloem Phra Kiat National Library' onerror="this.style.display='none'"><div class='thumb-label'>Chaloem Phra Kiat National Library</div></div><div class='photo-thumb' onclick='moveToMarker(2)'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/05031918.jpg' title='Lak Muang' alt='Lak Muang' onerror="this.style.display='none'"><div class='thumb-label'>Lak Muang</div></div><div class='photo-thumb' onclick='moveToMarker(3)'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/05031972.jpg' title='Lak Muang' alt='Lak Muang' onerror="this.style.display='none'"><div class='thumb-label'>Lak Muang</div></div><div class='photo-thumb' onclick='moveToMarker(4)'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/05031979.jpg' title='Fountain Rotary' alt='Fountain Rotary' onerror="this.style.display='none'"><div class='thumb-label'>Fountain Rotary</div></div><div class='photo-thumb' onclick='moveToMarker(5)'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/05031980.jpg' title='Post Office' alt='Post Office' onerror="this.style.display='none'"><div class='thumb-label'>Post Office</div></div><div style='text-align:center; margin-top:12px; padding-top:8px; border-top:1px solid #333;'><a href='../../使い方.html' style='color:#66aaff; font-size:12px;'>地図の使い方</a></div></div>
<script>
var map = L.map('map');
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

var markers = {};
var markerGroup = L.featureGroup().addTo(map);
var pathPoints = [];

var icon_funsui_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/funsui.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
var icon_lakmuang_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/lakmuang.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
var icon_postbox_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/postbox.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
var icon_yakata_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/yakata.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
markers[0] = L.marker([17.407803, 104.785473], {icon: icon_postbox_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Post Office</h3><a href='https://lek3map.github.io/thailand/map/2005/picture/05031909.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/05031909.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>ナコンパノム</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=17.407803,104.785473' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=17.407803,104.785473&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a><br><button onclick='copyPlace(0, this)' style='margin-top:8px; padding:0 8px; font-size:12px; cursor:pointer;'>コピー</button> <button onclick='downloadPlace(0)' style='margin-top:8px; padding:0 8px; font-size:12px; cursor:pointer;'>CSVで保存</button></div>");
markers[1] = L.marker([17.408499, 104.77979], {icon: icon_yakata_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Chaloem Phra Kiat National Library</h3><a href='https://lek3map.github.io/thailand/map/2005/picture/05031913.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/05031913.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>ナコンパノム</div><div style='text-align:left; margin-top:8px;'>今は図書館として使われている</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=17.408499,104.77979' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=17.408499,104.77979&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a><br><button onclick='copyPlace(1, this)' style='margin-top:8px; padding:0 8px; font-size:12px; cursor:pointer;'>コピー</button> <button onclick='downloadPlace(1)' style='margin-top:8px; padding:0 8px; font-size:12px; cursor:pointer;'>CSVで保存</button></div>");
markers[2] = L.marker([17.408156, 104.780538], {icon: icon_lakmuang_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Lak Muang</h3><a href='https://lek3map.github.io/thailand/map/2005/picture/05031918.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/05031918.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>ナコンパノム</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=17.408156,104.780538' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=17.408156,104.780538&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a><br><button onclick='copyPlace(2, this)' style='margin-top:8px; padding:0 8px; font-size:12px; cursor:pointer;'>コピー</button> <button onclick='downloadPlace(2)' style='margin-top:8px; padding:0 8px; font-size:12px; cursor:pointer;'>CSVで保存</button></div>");
markers[3] = L.marker([16.543312, 104.726712], {icon: icon_lakmuang_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Lak Muang</h3><a href='https://lek3map.github.io/thailand/map/2005/picture/05031972.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/05031972.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>ムクダハン</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=16.543312,104.726712' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=16.543312,104.726712&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a><br><button onclick='copyPlace(3, this)' style='margin-top:8px; padding:0 8px; font-size:12px; cursor:pointer;'>コピー</button> <button onclick='downloadPlace(3)' style='margin-top:8px; padding:0 8px; font-size:12px; cursor:pointer;'>CSVで保存</button></div>");
markers[4] = L.marker([16.541328, 104.729104], {icon: icon_funsui_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Fountain Rotary</h3><a href='https://lek3map.github.io/thailand/map/2005/picture/05031979.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/05031979.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>ムクダハン</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=16.541328,104.729104' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=16.541328,104.729104&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a><br><button onclick='copyPlace(4, this)' style='margin-top:8px; padding:0 8px; font-size:12px; cursor:pointer;'>コピー</button> <button onclick='downloadPlace(4)' style='margin-top:8px; padding:0 8px; font-size:12px; cursor:pointer;'>CSVで保存</button></div>");
markers[5] = L.marker([16.541533, 104.728745], {icon: icon_postbox_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Post Office</h3><a href='https://lek3map.github.io/thailand/map/2005/picture/05031980.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/05031980.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>ムクダハン</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=16.541533,104.728745' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=16.541533,104.728745&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a><br><button onclick='copyPlace(5, this)' style='margin-top:8px; padding:0 8px; font-size:12px; cursor:pointer;'>コピー</button> <button onclick='downloadPlace(5)' style='margin-top:8px; padding:0 8px; font-size:12px; cursor:pointer;'>CSVで保存</button></div>");
var PLACES = [{"date": "2005-03-19", "name": "Post Office", "tname": "", "place": "ナコンパノム", "des": "", "lat": 17.407803, "lon": 104.785473, "maps": "https://www.google.com/maps?q=17.407803,104.785473", "thumb": "https://lek3map.github.io/thailand/map/2005/thumbs/05031909.jpg", "album": "https://lek3map.github.io/thailand/map/2005/picture/05031909.jpg"}, {"date": "2005-03-19", "name": "Chaloem Phra Kiat National Library", "tname": "", "place": "ナコンパノム", "des": "今は図書館として使われている", "lat": 17.408499, "lon": 104.77979, "maps": "https://www.google.com/maps?q=17.408499,104.77979", "thumb": "https://lek3map.github.io/thailand/map/2005/thumbs/05031913.jpg", "album": "https://lek3map.github.io/thailand/map/2005/picture/05031913.jpg"}, {"date": "2005-03-19", "name": "Lak Muang", "tname": "", "place": "ナコンパノム", "des": "", "lat": 17.408156, "lon": 104.780538, "maps": "https://www.google.com/maps?q=17.408156,104.780538", "thumb": "https://lek3map.github.io/thailand/map/2005/thumbs/05031918.jpg", "album": "https://lek3map.github.io/thailand/map/2005/picture/05031918.jpg"}, {"date": "2005-03-19", "name": "Lak Muang", "tname": "", "place": "ムクダハン", "des": "", "lat": 16.543312, "lon": 104.726712, "maps": "https://www.google.com/maps?q=16.543312,104.726712", "thumb": "https://lek3map.github.io/thailand/map/2005/thumbs/05031972.jpg", "album": "https://lek3map.github.io/thailand/map/2005/picture/05031972.jpg"}, {"date": "2005-03-19", "name": "Fountain Rotary", "tname": "", "place": "ムクダハン", "des": "", "lat": 16.541328, "lon": 104.729104, "maps": "https://www.google.com/maps?q=16.541328,104.729104", "thumb": "https://lek3map.github.io/thailand/map/2005/thumbs/05031979.jpg", "album": "https://lek3map.github.io/thailand/map/2005/picture/05031979.jpg"}, {"date": "2005-03-19", "name": "Post Office", "tname": "", "place": "ムクダハン", "des": "", "lat": 16.541533, "lon": 104.728745, "maps": "https://www.google.com/maps?q=16.541533,104.728745", "thumb": "https://lek3map.github.io/thailand/map/2005/thumbs/05031980.jpg", "album": "https://lek3map.github.io/thailand/map/2005/picture/05031980.jpg"}];

function placeRow(p) {
    return [p.date, p.name, p.tname, p.place, p.des, p.lat, p.lon, p.maps, p.thumb].join('\t');
}
function placeCsv(p) {
    var head = ['日付', '名前', 'タイ語名', '場所', '説明', '緯度', '経度', 'Google Maps', 'サムネイル'];
    function q(v) { return '"' + String(v).replace(/"/g, '""') + '"'; }
    var vals = [p.date, p.name, p.tname, p.place, p.des, p.lat, p.lon, p.maps, p.thumb];
    return head.map(q).join(',') + '\r\n' + vals.map(q).join(',') + '\r\n';
}
function copyPlace(i, btn) {
    var text = placeRow(PLACES[i]);
    function done() { btn.textContent = 'コピーしました'; setTimeout(function() { btn.textContent = 'コピー'; }, 2000); }
    function fallback() {
        var ta = document.createElement('textarea');
        ta.value = text; document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); done(); }
        catch (e) { btn.textContent = 'コピーできませんでした'; }
        document.body.removeChild(ta);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done).catch(fallback);
    } else { fallback(); }
}
function downloadPlace(i) {
    var p = PLACES[i];
    var blob = new Blob(['\ufeff' + placeCsv(p)], {type: 'text/csv;charset=utf-8'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = p.date.replace(/-/g, '') + '-' + (i + 1) + '.csv';
    document.body.appendChild(a); a.click();
    setTimeout(function() { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}


if (pathPoints.length > 0) {
    var polyline = L.polyline(pathPoints, {color: '#ff0000', weight: 4, opacity: 0.8}).addTo(map);
    map.fitBounds(polyline.getBounds(), {padding: [30, 30]});
} else if (Object.keys(markers).length > 0) {
    map.fitBounds(markerGroup.getBounds(), {padding: [50, 50]});
} else {
    map.setView([13.7563, 100.5018], 6);
}

function moveToMarker(id) { 
    var m = markers[id]; 
    if(m) { map.flyTo(m.getLatLng(), 15); m.openPopup(); } 
}
</script>
</body>
