markers[5] = L.marker([8.417102, 99.965082], {icon: icon_clock_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Clock Tower<br>หอนาฬิกา</h3><a href='https://lek3map.github.io/thailand/map/2005/picture/05071949.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/map/2005/thumbs/05071949.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>ナコンシータマラート</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=8.417102,99.965082' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=8.417102,99.965082&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a><br><button onclick='copyPlace(5, this)' style='margin-top:8px; padding:0 8px; font-size:12px; cursor:pointer;'>コピー</button> <button onclick='downloadPlace(5)' style='margin-top:8px; padding:0 8px; font-size:12px; cursor:pointer;'>CSVで保存</button></div>");

var PLACES = [{"date": "2005-07-19", "name": "Phra Phuttha Nirokhantrai Chaiwat Chaturathit", "tname": "", "place": "パタルン", "des": "", "lat": 7.616747, "lon": 100.0740426, "maps": "https://www.google.com/maps?q=7.616747,100.0740426", "thumb": "https://lek3map.github.io/thailand/map/2005/thumbs/05071903.jpg", "album": "https://photos.app.goo.gl/YfzPo9CZmm7G5o9k7"}, {"date": "2005-07-19", "name": "Phatthalung Station", "tname": "", "place": "パタルン", "des": "", "lat": 7.620867, "lon": 100.085503, "maps": "https://www.google.com/maps?q=7.620867,100.085503", "thumb": "https://lek3map.github.io/thailand/map/2005/thumbs/05071909.jpg", "album": "https://photos.app.goo.gl/i6i7kBjZAs7JvGC5A"}, {"date": "2005-07-19", "name": "Post Office", "tname": "", "place": "ナコンシータマラート", "des": "", "lat": 8.431663, "lon": 99.963098, "maps": "https://www.google.com/maps?q=8.431663,99.963098", "thumb": "https://lek3map.github.io/thailand/map/2005/thumbs/05071920.jpg", "album": "https://lek3map.github.io/thailand/map/2005/picture/05071920.jpg"}, {"date": "2005-07-19", "name": "Lak Muang", "tname": "", "place": "ナコンシータマラート", "des": "", "lat": 8.430586, "lon": 99.962143, "maps": "https://www.google.com/maps?q=8.430586,99.962143", "thumb": "https://lek3map.github.io/thailand/map/2005/thumbs/05071931.jpg", "album": "https://lek3map.github.io/thailand/map/2005/picture/05071931.jpg"}, {"date": "2005-07-19", "name": "Mosque", "tname": "", "place": "ナコンシータマラート", "des": "", "lat": 8.432539, "lon": 99.96129, "maps": "https://www.google.com/maps?q=8.432539,99.96129", "thumb": "https://lek3map.github.io/thailand/map/2005/thumbs/05071933.jpg", "album": "https://lek3map.github.io/thailand/map/2005/picture/05071933.jpg"}, {"date": "2005-07-19", "name": "Clock Tower", "tname": "หอนาฬิกา", "place": "ナコンシータマラート", "des": "", "lat": 8.417102, "lon": 99.965082, "maps": "https://www.google.com/maps?q=8.417102,99.965082", "thumb": "https://lek3map.github.io/thailand/map/2005/thumbs/05071949.jpg", "album": "https://lek3map.github.io/thailand/map/2005/picture/05071949.jpg"}, {"date": "2005-07-19", "name": "Old Wall, North Gate", "tname": "", "place": "ナコンシータマラート", "des": "", "lat": 8.427684, "lon": 99.963752, "maps": "https://www.google.com/maps?q=8.427684,99.963752", "thumb": "https://lek3map.github.io/thailand/map/2005/thumbs/05071953.jpg", "album": "https://lek3map.github.io/thailand/map/2005/picture/05071953.jpg"}];

function placeRow(p) {
    return [p.date, p.name, p.tname, p.place, p.des, p.lat, p.lon, p.maps, p.thumb].join('\t');
}
function placeCsv(p) {
    var head = ['日付', '名前', 'タイ語名', '場所', '説明', '緯度', '経度', 'Google Maps', 'サムネイル'];
    function q(v) { return '"' + String(v).replace(/"/g, '""') + '"'; }
    var vals = [p.date, p.name, p.tname, p.place, p.des, p.lat, p.lon, p.maps, p.thumb];
    return head.map(q).join(',') + '\r\n' + vals.map(q).join(',') + '\r\n';
}
function copyPlace(i, btn) {
    var text = placeRow(PLACES[i]);
    function done() { btn.textContent = 'コピーしました'; setTimeout(function() { btn.textContent = 'コピー'; }, 2000); }
    function fallback() {
        var ta = document.createElement('textarea');
        ta.value = text; document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); done(); }
        catch (e) { btn.textContent = 'コピーできませんでした'; }
        document.body.removeChild(ta);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done).catch(fallback);
    } else { fallback(); }
}
function downloadPlace(i) {
    var p = PLACES[i];
    var blob = new Blob(['\ufeff' + placeCsv(p)], {type: 'text/csv;charset=utf-8'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = p.date.replace(/-/g, '') + '-' + (i + 1) + '.csv';
    document.body.appendChild(a); a.click();
    setTimeout(function() { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}


if (pathPoints.length > 0) {
    var polyline = L.polyline(pathPoints, {color: '#ff0000', weight: 4, opacity: 0.8}).addTo(map);
    map.fitBounds(polyline.getBounds(), {padding: [30, 30]});
} else if (Object.keys(markers).length > 0) {
    map.fitBounds(markerGroup.getBounds(), {padding: [50, 50]});
} else {
    map.setView([13.7563, 100.5018], 6);
}

function moveToMarker(id) { 
    var m = markers[id]; 
    if(m) { map.flyTo(m.getLatLng(), 15); m.openPopup(); } 
}
