<!DOCTYPE html>
<html lang='ja'>
<head>
<meta charset='utf-8'>
<meta property="og:title" content="2013年04月24日の地図日記">
<meta property="og:image" content="https://lek3map.github.io/thailand/picture/hyoushi_note.png">
<meta property="og:type" content="website">
<title>2013年04月24日の地図日記</title>
<link rel='stylesheet' href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css' />
<script src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'></script>
<style>
    body { display: flex; height: 100vh; margin: 0; background: #111; font-family: sans-serif; }
    #map { flex: 1; }
    #sidebar { width: 200px; overflow-y: auto; background: #111; padding: 10px; border-left: 1px solid #333; }
    .photo-thumb { margin-bottom: 10px; cursor: pointer; border: 2px solid transparent; }
    .photo-thumb:hover { border-color: #007bff; }
    .photo-thumb img { width: 100%; border-radius: 4px; display: block; }
</style>
</head>
<body>
<div id='map'></div>
<div id='sidebar'><div style='color:white; text-align:center; margin-bottom:15px;'>2013年04月24日</div><div class='photo-thumb' onclick='moveToMarker(0)'><img src='https://lh3.googleusercontent.com/-pz-Ctc8RqxI/UXjc9Jqa81I/AAAAAAAALBU/gMnFPXcOOvU/s680/130424012.jpg' title='Thailand National Railways Birthplace Monument'></div>
</div>
<script>
var map = L.map('map');
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

var markers = {};
var markerGroup = L.featureGroup().addTo(map);
var pathPoints = [];


                var icon_monument_png = L.icon({
                    iconUrl: 'https://lek3map.github.io/thailand/icon/monument.png',
                    iconSize: [30, 30],
                    iconAnchor: [15, 30],
                    popupAnchor: [0, -30]
                });
markers[0] = L.marker([13.742699, 100.516852], {icon: icon_monument_png}).addTo(markerGroup).bindPopup("<div style='width:250px;'><a href='https://photos.app.goo.gl/wXFEX25z1pxFFmwV8' target='_blank'><img src='https://lh3.googleusercontent.com/-pz-Ctc8RqxI/UXjc9Jqa81I/AAAAAAAALBU/gMnFPXcOOvU/s680/130424012.jpg' style='width:100%; border-radius:4px;'></a><h3 style='margin:10px 0 5px 0;'>Thailand National Railways Birthplace Monument</h3><div style='color:#666; font-size:1.1em;'>バンコク</div><div style='font-size:1.1em; color:#333; margin:10px 0;'>タイ国鉄発祥地記念碑：1891年3月9日ラマ５世によりこの地で国鉄線路起工式典、1896年3月26日国鉄開業式典が執り行われ、この記念碑は1990年3月26日にそれを記念し建てられたもの。http://doppo-kakashi.com/archives/38484908.html#more</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=13.742699,100.516852' target='_blank' style='font-weight:bold;'>📍 Google Maps</a></div>");


if (pathPoints.length > 0) {
    var polyline = L.polyline(pathPoints, {color: '#ff0000', weight: 4, opacity: 0.8}).addTo(map);
    map.fitBounds(polyline.getBounds(), {padding: [30, 30]});
} else if (Object.keys(markers).length > 0) {
    map.fitBounds(markerGroup.getBounds(), {padding: [50, 50]});
} else {
    map.setView([13.7563, 100.5018], 6);
}

function moveToMarker(id) { 
    var m = markers[id]; 
    if(m) { map.flyTo(m.getLatLng(), 15); m.openPopup(); } 
}
</script>
</body>
</html>
