<!DOCTYPE html>
<html lang='ja'>
<head>
<meta charset='utf-8'>
<meta property="og:title" content="2013年08月14日の地図日記">
<meta property="og:image" content="https://lek3map.github.io/thailand/picture/hyoushi_note.png">
<meta property="og:type" content="website">
<title>2013年08月14日の地図日記</title>
<link rel='stylesheet' href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css' />
<script src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'></script>
<style>
    body { display: flex; height: 100vh; margin: 0; background: #111; font-family: sans-serif; }
    #map { flex: 1; }
    #sidebar { width: 200px; overflow-y: auto; background: #111; padding: 10px; border-left: 1px solid #333; }
    .photo-thumb { margin-bottom: 10px; cursor: pointer; border: 2px solid transparent; }
    .photo-thumb:hover { border-color: #007bff; }
    .photo-thumb img { width: 100%; border-radius: 4px; display: block; }
</style>
</head>
<body>
<div id='map'></div>
<div id='sidebar'><div style='color:white; text-align:center; margin-bottom:15px;'>2013年08月14日</div><div class='photo-thumb' onclick='moveToMarker(0)'><img src='https://lh5.googleusercontent.com/-cIvcSXOnZ0o/UgtHb9FGvNI/AAAAAAAAM1M/1fBxOs4pqYk/s680/130814023.jpg' title='Phraya Thukkharat Monument'></div>
<div class='photo-thumb' onclick='moveToMarker(1)'><img src='https://lh5.googleusercontent.com/-0FRVsak7KG0/Ug4MU217jxI/AAAAAAAAdyQ/R6coP_U_-Dw/s180/130814001.jpg' title='Street Lamp'></div>
<div class='photo-thumb' onclick='moveToMarker(2)'><img src='https://lh5.googleusercontent.com/-Rmunf3R6Usg/UgtGYh0XgKI/AAAAAAAAMzc/xihq2LPzY7k/s680/130814006.jpg' title='Lak Muang'></div>
</div>
<script>
var map = L.map('map');
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

var markers = {};
var markerGroup = L.featureGroup().addTo(map);
var pathPoints = [];


                var icon_monument_png = L.icon({
                    iconUrl: 'https://lek3map.github.io/thailand/icon/monument.png',
                    iconSize: [30, 30],
                    iconAnchor: [15, 30],
                    popupAnchor: [0, -30]
                });
                var icon_gaitou_png = L.icon({
                    iconUrl: 'https://lek3map.github.io/thailand/icon/gaitou.png',
                    iconSize: [30, 30],
                    iconAnchor: [15, 30],
                    popupAnchor: [0, -30]
                });
                var icon_lak_png = L.icon({
                    iconUrl: 'https://lek3map.github.io/thailand/icon/lak.png',
                    iconSize: [30, 30],
                    iconAnchor: [15, 30],
                    popupAnchor: [0, -30]
                });
markers[0] = L.marker([7.61035, 100.05901], {icon: icon_monument_png}).addTo(markerGroup).bindPopup("<div style='width:250px;'><a href='https://photos.app.goo.gl/akQcS2sdF6iLugcW9' target='_blank'><img src='https://lh5.googleusercontent.com/-cIvcSXOnZ0o/UgtHb9FGvNI/AAAAAAAAM1M/1fBxOs4pqYk/s680/130814023.jpg' style='width:100%; border-radius:4px;'></a><h3 style='margin:10px 0 5px 0;'>Phraya Thukkharat Monument</h3><div style='color:#666; font-size:1.1em;'>パタルン</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=7.61035,100.05901' target='_blank' style='font-weight:bold;'>📍 Google Maps</a></div>");
markers[1] = L.marker([7.619299, 100.073686], {icon: icon_gaitou_png}).addTo(markerGroup).bindPopup("<div style='width:250px;'><a href='https://lh5.googleusercontent.com/-0FRVsak7KG0/Ug4MU217jxI/AAAAAAAAdyQ/R6coP_U_-Dw/s1600/130814001.jpg' target='_blank'><img src='https://lh5.googleusercontent.com/-0FRVsak7KG0/Ug4MU217jxI/AAAAAAAAdyQ/R6coP_U_-Dw/s180/130814001.jpg' style='width:100%; border-radius:4px;'></a><h3 style='margin:10px 0 5px 0;'>Street Lamp</h3><div style='color:#666; font-size:1.1em;'>パタルン</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=7.619299,100.073686' target='_blank' style='font-weight:bold;'>📍 Google Maps</a></div>");
markers[2] = L.marker([7.600024, 100.060664], {icon: icon_lak_png}).addTo(markerGroup).bindPopup("<div style='width:250px;'><a href='https://goo.gl/photos/dj5eq1Z9KAzC2Jpt5' target='_blank'><img src='https://lh5.googleusercontent.com/-Rmunf3R6Usg/UgtGYh0XgKI/AAAAAAAAMzc/xihq2LPzY7k/s680/130814006.jpg' style='width:100%; border-radius:4px;'></a><h3 style='margin:10px 0 5px 0;'>Lak Muang</h3><div style='color:#666; font-size:1.1em;'>パタルン</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=7.600024,100.060664' target='_blank' style='font-weight:bold;'>📍 Google Maps</a></div>");


if (pathPoints.length > 0) {
    var polyline = L.polyline(pathPoints, {color: '#ff0000', weight: 4, opacity: 0.8}).addTo(map);
    map.fitBounds(polyline.getBounds(), {padding: [30, 30]});
} else if (Object.keys(markers).length > 0) {
    map.fitBounds(markerGroup.getBounds(), {padding: [50, 50]});
} else {
    map.setView([13.7563, 100.5018], 6);
}

function moveToMarker(id) { 
    var m = markers[id]; 
    if(m) { map.flyTo(m.getLatLng(), 15); m.openPopup(); } 
}
</script>
</body>
</html>
