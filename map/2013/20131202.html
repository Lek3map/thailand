<!DOCTYPE html>
<html lang='ja'>
<head>
<meta charset='utf-8'>
<meta property="og:title" content="2013年12月02日の地図日記">
<meta property="og:image" content="https://lek3map.github.io/thailand/picture/hyoushi_note.png">
<meta property="og:type" content="website">
<title>2013年12月02日の地図日記</title>
<link rel='stylesheet' href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css' />
<script src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'></script>
<style>
    body { display: flex; height: 100vh; margin: 0; background: #111; font-family: sans-serif; }
    #map { flex: 1; }
    #sidebar { width: 200px; overflow-y: auto; background: #111; padding: 10px; border-left: 1px solid #333; }
    .photo-thumb { margin-bottom: 10px; cursor: pointer; border: 2px solid transparent; }
    .photo-thumb:hover { border-color: #007bff; }
    .photo-thumb img { width: 100%; border-radius: 4px; display: block; }
</style>
</head>
<body>
<div id='map'></div>
<div id='sidebar'><div style='color:white; text-align:center; margin-bottom:15px;'>2013年12月02日</div><div class='photo-thumb' onclick='moveToMarker(0)'><img src='https://lh3.googleusercontent.com/-HjHo1Fmevfw/UpyLe0rbCkI/AAAAAAAANPo/cJwwecfh-GU/s680/131202021.jpg' title='Wat Thep Mongkhon'></div>
<div class='photo-thumb' onclick='moveToMarker(1)'><img src='https://lh6.googleusercontent.com/-RzO51-44c8Y/UpyRUCuVXlI/AAAAAAAANUU/FEU46iI2ML0/s680/131202071.jpg' title='Wat Pa Si Sunthon'></div>
<div class='photo-thumb' onclick='moveToMarker(2)'><img src='https://lh4.googleusercontent.com/--BMCoA3bQX0/UpySb3no9II/AAAAAAAANV8/1_ozeuwJHDc/s680/131202048.jpg' title='Wat Neramit Wanaram'></div>
<div class='photo-thumb' onclick='moveToMarker(3)'><img src='https://lh4.googleusercontent.com/-2dI-LcE9wns/UpyPwBXD5AI/AAAAAAAANR8/UtXJc8Xs3x8/s680/131202037.jpg' title='Wat Tai Si Mongkhon'></div>
</div>
<script>
var map = L.map('map');
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

var markers = {};
var markerGroup = L.featureGroup().addTo(map);
var pathPoints = [];


                var icon_tera_png = L.icon({
                    iconUrl: 'https://lek3map.github.io/thailand/icon/tera.png',
                    iconSize: [30, 30],
                    iconAnchor: [15, 30],
                    popupAnchor: [0, -30]
                });
markers[0] = L.marker([15.867047, 104.62173], {icon: icon_tera_png}).addTo(markerGroup).bindPopup("<div style='width:250px;'><a href='https://photos.app.goo.gl/KS9Pvi1QyMFzBA2Q9' target='_blank'><img src='https://lh3.googleusercontent.com/-HjHo1Fmevfw/UpyLe0rbCkI/AAAAAAAANPo/cJwwecfh-GU/s680/131202021.jpg' style='width:100%; border-radius:4px;'></a><h3 style='margin:10px 0 5px 0;'>Wat Thep Mongkhon</h3><div style='color:#666; font-size:1.1em;'>アムナットチャルン</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=15.867047,104.62173' target='_blank' style='font-weight:bold;'>📍 Google Maps</a></div>");
markers[1] = L.marker([15.867315, 104.091167], {icon: icon_tera_png}).addTo(markerGroup).bindPopup("<div style='width:250px;'><a href='https://photos.app.goo.gl/2B1q2fBFeT5qauc69' target='_blank'><img src='https://lh6.googleusercontent.com/-RzO51-44c8Y/UpyRUCuVXlI/AAAAAAAANUU/FEU46iI2ML0/s680/131202071.jpg' style='width:100%; border-radius:4px;'></a><h3 style='margin:10px 0 5px 0;'>Wat Pa Si Sunthon</h3><div style='color:#666; font-size:1.1em;'>ヤソートン</div><div style='font-size:1.1em; color:#333; margin:10px 0;'>地獄絵あり</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=15.867315,104.091167' target='_blank' style='font-weight:bold;'>📍 Google Maps</a></div>");
markers[2] = L.marker([15.794148, 104.154205], {icon: icon_tera_png}).addTo(markerGroup).bindPopup("<div style='width:250px;'><a href='https://photos.app.goo.gl/7iwAoWfV5J7pvTQa7' target='_blank'><img src='https://lh4.googleusercontent.com/--BMCoA3bQX0/UpySb3no9II/AAAAAAAANV8/1_ozeuwJHDc/s680/131202048.jpg' style='width:100%; border-radius:4px;'></a><h3 style='margin:10px 0 5px 0;'>Wat Neramit Wanaram</h3><div style='color:#666; font-size:1.1em;'>ヤソートン</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=15.794148,104.154205' target='_blank' style='font-weight:bold;'>📍 Google Maps</a></div>");
markers[3] = L.marker([15.786193, 104.150809], {icon: icon_tera_png}).addTo(markerGroup).bindPopup("<div style='width:250px;'><a href='https://photos.app.goo.gl/y8q8UFZot2Dm9shj8' target='_blank'><img src='https://lh4.googleusercontent.com/-2dI-LcE9wns/UpyPwBXD5AI/AAAAAAAANR8/UtXJc8Xs3x8/s680/131202037.jpg' style='width:100%; border-radius:4px;'></a><h3 style='margin:10px 0 5px 0;'>Wat Tai Si Mongkhon</h3><div style='color:#666; font-size:1.1em;'>ヤソートン</div><div style='font-size:1.1em; color:#333; margin:10px 0;'>シム</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=15.786193,104.150809' target='_blank' style='font-weight:bold;'>📍 Google Maps</a></div>");


if (pathPoints.length > 0) {
    var polyline = L.polyline(pathPoints, {color: '#ff0000', weight: 4, opacity: 0.8}).addTo(map);
    map.fitBounds(polyline.getBounds(), {padding: [30, 30]});
} else if (Object.keys(markers).length > 0) {
    map.fitBounds(markerGroup.getBounds(), {padding: [50, 50]});
} else {
    map.setView([13.7563, 100.5018], 6);
}

function moveToMarker(id) { 
    var m = markers[id]; 
    if(m) { map.flyTo(m.getLatLng(), 15); m.openPopup(); } 
}
</script>
</body>
</html>
