<!DOCTYPE html>
<html lang='ja'>
<head>
<meta charset='utf-8'>
<meta property="og:title" content="2013年12月19日の地図日記">
<meta property="og:image" content="https://lek3map.github.io/thailand/picture/hyoushi_note.png">
<meta property="og:type" content="website">
<title>2013年12月19日の地図日記</title>
<link rel='stylesheet' href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css' />
<script src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'></script>
<style>
    body { display: flex; height: 100vh; margin: 0; background: #111; font-family: sans-serif; }
    #map { flex: 1; }
    #sidebar { width: 200px; overflow-y: auto; background: #111; padding: 10px; border-left: 1px solid #333; }
    .photo-thumb { margin-bottom: 10px; cursor: pointer; border: 2px solid transparent; }
    .photo-thumb:hover { border-color: #007bff; }
    .photo-thumb img { width: 100%; border-radius: 4px; display: block; }
</style>
</head>
<body>
<div id='map'></div>
<div id='sidebar'><div style='color:white; text-align:center; margin-bottom:15px;'>2013年12月19日</div><div class='photo-thumb' onclick='moveToMarker(0)'><img src='https://2.bp.blogspot.com/-lQDGMAJr5kQ/W6NE2WZzCrI/AAAAAAADogI/QE3TkfRivD8KKVV-Hg3ZUwjkhJmjikLAgCLcBGAs/s680/131219036.jpg' title='Core Isan'></div>
<div class='photo-thumb' onclick='moveToMarker(1)'><img src='https://lh4.googleusercontent.com/-v1wg1sOKgGk/UrTGS3jIFAI/AAAAAAAAd8U/35RRb4CCHhA/s680/131219034.jpg' title='Street Lamp'></div>
</div>
<script>
var map = L.map('map');
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

var markers = {};
var markerGroup = L.featureGroup().addTo(map);
var pathPoints = [];


                var icon_starr_png = L.icon({
                    iconUrl: 'https://lek3map.github.io/thailand/icon/starr.png',
                    iconSize: [30, 30],
                    iconAnchor: [15, 30],
                    popupAnchor: [0, -30]
                });
                var icon_gaitou_png = L.icon({
                    iconUrl: 'https://lek3map.github.io/thailand/icon/gaitou.png',
                    iconSize: [30, 30],
                    iconAnchor: [15, 30],
                    popupAnchor: [0, -30]
                });
markers[0] = L.marker([16.229612, 103.074213], {icon: icon_starr_png}).addTo(markerGroup).bindPopup("<div style='width:250px;'><a href='https://photos.app.goo.gl/jQ7aqkNPZ1zmQDPo9' target='_blank'><img src='https://2.bp.blogspot.com/-lQDGMAJr5kQ/W6NE2WZzCrI/AAAAAAADogI/QE3TkfRivD8KKVV-Hg3ZUwjkhJmjikLAgCLcBGAs/s680/131219036.jpg' style='width:100%; border-radius:4px;'></a><h3 style='margin:10px 0 5px 0;'>Core Isan</h3><div style='color:#666; font-size:1.1em;'>マハサラカム</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=16.229612,103.074213' target='_blank' style='font-weight:bold;'>📍 Google Maps</a></div>");
markers[1] = L.marker([16.228226, 103.074144], {icon: icon_gaitou_png}).addTo(markerGroup).bindPopup("<div style='width:250px;'><a href='https://lh4.googleusercontent.com/-v1wg1sOKgGk/UrTGS3jIFAI/AAAAAAAAd8U/35RRb4CCHhA/s1600/131219034.jpg' target='_blank'><img src='https://lh4.googleusercontent.com/-v1wg1sOKgGk/UrTGS3jIFAI/AAAAAAAAd8U/35RRb4CCHhA/s680/131219034.jpg' style='width:100%; border-radius:4px;'></a><h3 style='margin:10px 0 5px 0;'>Street Lamp</h3><div style='color:#666; font-size:1.1em;'>マハサラカム</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=16.228226,103.074144' target='_blank' style='font-weight:bold;'>📍 Google Maps</a></div>");


if (pathPoints.length > 0) {
    var polyline = L.polyline(pathPoints, {color: '#ff0000', weight: 4, opacity: 0.8}).addTo(map);
    map.fitBounds(polyline.getBounds(), {padding: [30, 30]});
} else if (Object.keys(markers).length > 0) {
    map.fitBounds(markerGroup.getBounds(), {padding: [50, 50]});
} else {
    map.setView([13.7563, 100.5018], 6);
}

function moveToMarker(id) { 
    var m = markers[id]; 
    if(m) { map.flyTo(m.getLatLng(), 15); m.openPopup(); } 
}
</script>
</body>
</html>
