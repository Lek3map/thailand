<!DOCTYPE html>
<html lang='ja'>
<head>
<meta charset='utf-8'>
<meta property="og:title" content="1995年7月8日の地図日記">
<meta property="og:type" content="website">
<title>1995年7月8日の地図日記</title>
<link rel='stylesheet' href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css' />
<script src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'></script>
<style>
    body { display: flex; height: 100vh; margin: 0; background: #111; font-family: sans-serif; }
    #map { flex: 1; }
    #sidebar { width: 200px; overflow-y: auto; background: #111; padding: 10px; border-left: 1px solid #333; }
    .photo-thumb { margin-bottom: 10px; cursor: pointer; border: 2px solid transparent; min-height: 40px; background: #222; }
    .photo-thumb:hover { border-color: #007bff; }
    .photo-thumb img { width: 100%; border-radius: 4px; display: block; }
    .thumb-label { color: #ccc; font-size: 12px; text-align: center; padding: 4px 2px; word-break: break-word; }
</style>
</head>
<body>
<div id='map'></div>
<div id='sidebar'><div style='color:white; text-align:center; margin-bottom:15px;'>1995年7月8日</div><div class='photo-thumb'><img src='https://lek3map.github.io/thailand/picture/aruki.jpg' title='交通手段' alt='交通手段' onerror="this.style.display='none'"></div><div class='photo-thumb' onclick='moveToMarker(0)'><img src='https://lek3map.github.io/thailand/map/1995/thumbs/95070810.jpg' title='ムンバイ（ボンベイ）' alt='ムンバイ（ボンベイ）' onerror="this.style.display='none'"><div class='thumb-label'>ムンバイ（ボンベイ）</div></div><div class='photo-thumb' onclick='moveToMarker(1)'><img src='https://lek3map.github.io/thailand/map/1995/thumbs/95070812.jpg' title='日本山妙法寺' alt='日本山妙法寺' onerror="this.style.display='none'"><div class='thumb-label'>日本山妙法寺</div></div></div>
<script>
var map = L.map('map');
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

var markers = {};
var markerGroup = L.featureGroup().addTo(map);
var pathPoints = [];

var icon_other_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/other.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
var icon_starr_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/starr.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
markers[0] = L.marker([18.922008, 72.834624], {icon: icon_starr_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>ムンバイ（ボンベイ）</h3><a href='https://photos.app.goo.gl/1AsmyhRy8a3BZwdz8' target='_blank'><img src='https://lek3map.github.io/thailand/map/1995/thumbs/95070810.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>ムンバイ（ボンベイ）</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=18.922008,72.834624' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=18.922008,72.834624&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[1] = L.marker([22.51079, 88.366236], {icon: icon_other_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>日本山妙法寺</h3><a href='https://photos.app.goo.gl/WeT1j5ccgj3DHn3R7' target='_blank'><img src='https://lek3map.github.io/thailand/map/1995/thumbs/95070812.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>カルカッタ</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=22.51079,88.366236' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=22.51079,88.366236&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");

if (pathPoints.length > 0) {
    var polyline = L.polyline(pathPoints, {color: '#ff0000', weight: 4, opacity: 0.8}).addTo(map);
    map.fitBounds(polyline.getBounds(), {padding: [30, 30]});
} else if (Object.keys(markers).length > 0) {
    map.fitBounds(markerGroup.getBounds(), {padding: [50, 50]});
} else {
    map.setView([13.7563, 100.5018], 6);
}

function moveToMarker(id) { 
    var m = markers[id]; 
    if(m) { map.flyTo(m.getLatLng(), 15); m.openPopup(); } 
}
</script>
</body>
</html>
