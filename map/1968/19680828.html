<!DOCTYPE html>
<html lang='ja'>
<head>
<meta charset='utf-8'>
<meta property="og:title" content="1968年8月28日の地図日記">
<meta property="og:type" content="website">
<title>1968年8月28日の地図日記</title>
<link rel='stylesheet' href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css' />
<script src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'></script>
<style>
    body { display: flex; height: 100vh; margin: 0; background: #111; font-family: sans-serif; }
    #map { flex: 1; }
    #sidebar { width: 200px; overflow-y: auto; background: #111; padding: 10px; border-left: 1px solid #333; }
    .photo-thumb { margin-bottom: 10px; cursor: pointer; border: 2px solid transparent; min-height: 40px; background: #222; }
    .photo-thumb:hover { border-color: #007bff; }
    .photo-thumb img { width: 100%; border-radius: 4px; display: block; }
    .thumb-label { color: #ccc; font-size: 12px; text-align: center; padding: 4px 2px; word-break: break-word; }
</style>
</head>
<body>
<div id='map'></div>
<div id='sidebar'><div style='color:white; text-align:center; margin-bottom:15px;'>1968年8月28日</div><div class='photo-thumb'><img src='https://lek3map.github.io/thailand/picture/aruki.png' title='交通手段' alt='交通手段' onerror="this.style.display='none'"></div><div class='photo-thumb' onclick='moveToMarker(0)'><img src='https://lek3map.github.io/thailand/map/1968/thumbs/68082805.jpg' title='クアラルンプール駅' alt='クアラルンプール駅' onerror="this.style.display='none'"><div class='thumb-label'>クアラルンプール駅</div></div><div class='photo-thumb' onclick='moveToMarker(1)'><img src='https://lek3map.github.io/thailand/map/1968/thumbs/68082810.jpg' title='Tugu Negara' alt='Tugu Negara' onerror="this.style.display='none'"><div class='thumb-label'>Tugu Negara</div></div><div class='photo-thumb' onclick='moveToMarker(2)'><img src='https://lek3map.github.io/thailand/map/1968/thumbs/68082801.jpg' title='マラッカ' alt='マラッカ' onerror="this.style.display='none'"><div class='thumb-label'>マラッカ</div></div><div class='photo-thumb' onclick='moveToMarker(3)'><img src='https://lek3map.github.io/thailand/map/1968/thumbs/68082812.jpg' title='Batu Caves' alt='Batu Caves' onerror="this.style.display='none'"><div class='thumb-label'>Batu Caves</div></div></div>
<script>
var map = L.map('map');
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

var markers = {};
var markerGroup = L.featureGroup().addTo(map);
var pathPoints = [];

var icon_beach_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/beach.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
var icon_sekihi_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/sekihi.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
var icon_station_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/station.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
var icon_tam_png = L.icon({
    iconUrl: 'https://lek3map.github.io/thailand/icon/tam.png',
    iconSize: [30, 30],
    iconAnchor: [15, 30],
    popupAnchor: [0, -30]
});
markers[0] = L.marker([3.139797, 101.693086], {icon: icon_station_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>クアラルンプール駅</h3><a href='https://photos.app.goo.gl/a8NLSXHqgD6UCJjp7' target='_blank'><img src='https://lek3map.github.io/thailand/map/1968/thumbs/68082805.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>クアラルンプール</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=3.139797,101.693086' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=3.139797,101.693086&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[1] = L.marker([3.148919, 101.68382], {icon: icon_sekihi_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Tugu Negara</h3><a href='https://photos.app.goo.gl/S3Hu63C6oxdwHuSg9' target='_blank'><img src='https://lek3map.github.io/thailand/map/1968/thumbs/68082810.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>クアラルンプール</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=3.148919,101.68382' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=3.148919,101.68382&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[2] = L.marker([2.176718, 102.28102], {icon: icon_beach_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>マラッカ</h3><a href='https://photos.app.goo.gl/txBLU8miTj1KCisD6' target='_blank'><img src='https://lek3map.github.io/thailand/map/1968/thumbs/68082801.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>マラッカ</div><div style='text-align:left; margin-top:8px;'>マラッカの工業高校の生徒だと言ってた、寮に連れられて夕飯を食べさせてくれた、夜アヘンを吸わされた。</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=2.176718,102.28102' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=2.176718,102.28102&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");
markers[3] = L.marker([3.237813, 101.684021], {icon: icon_tam_png}).addTo(markerGroup).bindPopup("<div style='width:250px; text-align:center;'><h3 style='margin:10px 0 5px 0;'>Batu Caves</h3><a href='https://photos.app.goo.gl/cVGZ5xqEMyUQ5tCF6' target='_blank'><img src='https://lek3map.github.io/thailand/map/1968/thumbs/68082812.jpg' style='width:100%; border-radius:4px;'></a><div style='color:#666; font-size:1.1em;'>クアラルンプール</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=3.237813,101.684021' target='_blank' style='font-weight:bold;'>📍 Google Maps</a>　<a href='https://www.google.com/maps?q=3.237813,101.684021&hl=th' target='_blank' style='font-weight:bold;'>タイ語</a></div>");

if (pathPoints.length > 0) {
    var polyline = L.polyline(pathPoints, {color: '#ff0000', weight: 4, opacity: 0.8}).addTo(map);
    map.fitBounds(polyline.getBounds(), {padding: [30, 30]});
} else if (Object.keys(markers).length > 0) {
    map.fitBounds(markerGroup.getBounds(), {padding: [50, 50]});
} else {
    map.setView([13.7563, 100.5018], 6);
}

function moveToMarker(id) { 
    var m = markers[id]; 
    if(m) { map.flyTo(m.getLatLng(), 15); m.openPopup(); } 
}
</script>
</body>
</html>
