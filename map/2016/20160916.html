<!DOCTYPE html>
<html lang='ja'>
<head>
<meta charset='utf-8'>
<meta property="og:title" content="2016年09月16日の地図日記">
<meta property="og:image" content="https://lek3map.github.io/thailand/picture/hyoushi_note.png">
<meta property="og:type" content="website">
<title>2016年09月16日の地図日記</title>
<link rel='stylesheet' href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css' />
<script src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'></script>
<style>
    body { display: flex; height: 100vh; margin: 0; background: #111; font-family: sans-serif; }
    #map { flex: 1; }
    #sidebar { width: 200px; overflow-y: auto; background: #111; padding: 10px; border-left: 1px solid #333; }
    .photo-thumb { margin-bottom: 10px; cursor: pointer; border: 2px solid transparent; }
    .photo-thumb:hover { border-color: #007bff; }
    .photo-thumb img { width: 100%; border-radius: 4px; display: block; }
</style>
</head>
<body>
<div id='map'></div>
<div id='sidebar'><div style='color:white; text-align:center; margin-bottom:15px;'>2016年09月16日</div><div class='photo-thumb' onclick='moveToMarker(0)'><img src='https://lek3map.github.io/thailand/picture/aruki.png' title='出発地'></div>
</div>
<script>
var map = L.map('map');
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

var markers = {};
var markerGroup = L.featureGroup().addTo(map);
var pathPoints = [[35.2192551, 139.7130698], [35.2199522, 139.7125758], [35.2203442, 139.7117582], [35.2214009, 139.7113737], [35.2218705, 139.7107643], [35.2225122, 139.7099775], [35.2233254, 139.7094923], [35.2235185, 139.7092873], [35.224669, 139.7080112], [35.2252368, 139.7072188], [35.2259511, 139.70672], [35.2259842, 139.706631], [35.2269073, 139.7052957], [35.2275111, 139.7050952], [35.2283971, 139.7041809], [35.2288202, 139.7035955], [35.2293768, 139.702665], [35.2297537, 139.7023458], [35.2297537, 139.7023458], [35.2297537, 139.7023458], [35.2297537, 139.7023458], [35.2297537, 139.7023458], [35.2307945, 139.7024256], [35.2304979, 139.7025852], [35.2296736, 139.7019994], [35.2289509, 139.7031722], [35.228205, 139.7039511], [35.2273209, 139.7048221], [35.2266871, 139.7055323], [35.2260564, 139.706266], [35.2254434, 139.7070046], [35.2245847, 139.7077627], [35.2241269, 139.7084923], [35.2234941, 139.7093612], [35.2226231, 139.7099696], [35.2220232, 139.7107316], [35.2213135, 139.7114172], [35.2205345, 139.7118114], [35.2201766, 139.7127829], [35.2197466, 139.7131973]];


                var icon_start_png = L.icon({
                    iconUrl: 'https://lek3map.github.io/thailand/icon/start.png',
                    iconSize: [30, 30],
                    iconAnchor: [15, 30],
                    popupAnchor: [0, -30]
                });
markers[0] = L.marker([35.219255, 139.71307], {icon: icon_start_png}).addTo(markerGroup).bindPopup("<div style='width:250px;'><a href='https://lek3map.github.io/thailand/picture/aruki.png' target='_blank'><img src='https://lek3map.github.io/thailand/picture/aruki.png' style='width:100%; border-radius:4px;'></a><h3 style='margin:10px 0 5px 0;'>出発地</h3><div style='color:#666; font-size:1.1em;'>横須賀市</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=35.219255,139.71307' target='_blank' style='font-weight:bold;'>📍 Google Maps</a></div>");


if (pathPoints.length > 0) {
    var polyline = L.polyline(pathPoints, {color: '#ff0000', weight: 4, opacity: 0.8}).addTo(map);
    map.fitBounds(polyline.getBounds(), {padding: [30, 30]});
} else if (Object.keys(markers).length > 0) {
    map.fitBounds(markerGroup.getBounds(), {padding: [50, 50]});
} else {
    map.setView([13.7563, 100.5018], 6);
}

function moveToMarker(id) { 
    var m = markers[id]; 
    if(m) { map.flyTo(m.getLatLng(), 15); m.openPopup(); } 
}
</script>
</body>
</html>
