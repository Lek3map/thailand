<!DOCTYPE html>
<html lang='ja'>
<head>
<meta charset='utf-8'>
<meta property="og:title" content="2016年12月19日の地図日記">
<meta property="og:image" content="https://lek3map.github.io/thailand/picture/hyoushi_note.png">
<meta property="og:type" content="website">
<title>2016年12月19日の地図日記</title>
<link rel='stylesheet' href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css' />
<script src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'></script>
<style>
    body { display: flex; height: 100vh; margin: 0; background: #111; font-family: sans-serif; }
    #map { flex: 1; }
    #sidebar { width: 200px; overflow-y: auto; background: #111; padding: 10px; border-left: 1px solid #333; }
    .photo-thumb { margin-bottom: 10px; cursor: pointer; border: 2px solid transparent; }
    .photo-thumb:hover { border-color: #007bff; }
    .photo-thumb img { width: 100%; border-radius: 4px; display: block; }
</style>
</head>
<body>
<div id='map'></div>
<div id='sidebar'><div style='color:white; text-align:center; margin-bottom:15px;'>2016年12月19日</div><div class='photo-thumb' onclick='moveToMarker(1)'><img src='https://lh3.googleusercontent.com/pw/AP1GczMS_IzDk_N_D90n1xWKS95qo_BExLZ-RhapVUbrnEEaHVPsX15UhLxSPcNU-4U3snlCdkB3BTtn-j1d4zHjUgCZIBfuGGiSKjNWoLvzFmuQK_PvFOKIt0Jz_x5Q0PUwpIMKsdI6KOlSvyTOf5cPbeHAww=w1159-h869-s-no-gm?authuser=0' title='マハサラカム'></div>
</div>
<script>
var map = L.map('map');
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

var markers = {};
var markerGroup = L.featureGroup().addTo(map);
var pathPoints = [];


                var icon_bikered_png = L.icon({
                    iconUrl: 'https://lek3map.github.io/thailand/icon/bikered.png',
                    iconSize: [30, 30],
                    iconAnchor: [15, 30],
                    popupAnchor: [0, -30]
                });
markers[1] = L.marker([16.176599, 103.304269], {icon: icon_bikered_png}).addTo(markerGroup).bindPopup("<div style='width:250px;'><a href='https://lh3.googleusercontent.com/pw/AP1GczMS_IzDk_N_D90n1xWKS95qo_BExLZ-RhapVUbrnEEaHVPsX15UhLxSPcNU-4U3snlCdkB3BTtn-j1d4zHjUgCZIBfuGGiSKjNWoLvzFmuQK_PvFOKIt0Jz_x5Q0PUwpIMKsdI6KOlSvyTOf5cPbeHAww=w1159-h869-s-no-gm?authuser=0' target='_blank'><img src='https://lh3.googleusercontent.com/pw/AP1GczMS_IzDk_N_D90n1xWKS95qo_BExLZ-RhapVUbrnEEaHVPsX15UhLxSPcNU-4U3snlCdkB3BTtn-j1d4zHjUgCZIBfuGGiSKjNWoLvzFmuQK_PvFOKIt0Jz_x5Q0PUwpIMKsdI6KOlSvyTOf5cPbeHAww=w1159-h869-s-no-gm?authuser=0' style='width:100%; border-radius:4px;'></a><h3 style='margin:10px 0 5px 0;'>マハサラカム</h3><div style='color:#666; font-size:1.1em;'>マハサラカム</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=16.176599,103.304269' target='_blank' style='font-weight:bold;'>📍 Google Maps</a></div>");


if (pathPoints.length > 0) {
    var polyline = L.polyline(pathPoints, {color: '#ff0000', weight: 4, opacity: 0.8}).addTo(map);
    map.fitBounds(polyline.getBounds(), {padding: [30, 30]});
} else if (Object.keys(markers).length > 0) {
    map.fitBounds(markerGroup.getBounds(), {padding: [50, 50]});
} else {
    map.setView([13.7563, 100.5018], 6);
}

function moveToMarker(id) { 
    var m = markers[id]; 
    if(m) { map.flyTo(m.getLatLng(), 15); m.openPopup(); } 
}
</script>
</body>
</html>
