<!DOCTYPE html>
<html lang='ja'>
<head>
<meta charset='utf-8'>
<meta property="og:title" content="2016年10月16日の地図日記">
<meta property="og:image" content="https://lek3map.github.io/thailand/picture/hyoushi_note.png">
<meta property="og:type" content="website">
<title>2016年10月16日の地図日記</title>
<link rel='stylesheet' href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css' />
<script src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'></script>
<style>
    body { display: flex; height: 100vh; margin: 0; background: #111; font-family: sans-serif; }
    #map { flex: 1; }
    #sidebar { width: 200px; overflow-y: auto; background: #111; padding: 10px; border-left: 1px solid #333; }
    .photo-thumb { margin-bottom: 10px; cursor: pointer; border: 2px solid transparent; }
    .photo-thumb:hover { border-color: #007bff; }
    .photo-thumb img { width: 100%; border-radius: 4px; display: block; }
</style>
</head>
<body>
<div id='map'></div>
<div id='sidebar'><div style='color:white; text-align:center; margin-bottom:15px;'>2016年10月16日</div><div class='photo-thumb' onclick='moveToMarker(1)'><img src='https://lh3.googleusercontent.com/W-5QdA3NTsBoXF95R0CM6IJxGT0h2TT3QDsyt7LS3T9ckLFwUkW5GELJRLkJixQoUT5jKjn1u9oqFg' title='ヘボン博士邸跡'></div>
<div class='photo-thumb' onclick='moveToMarker(2)'><img src='https://lh3.googleusercontent.com/Uy2Cl0Iuv7EsLX-lJ5SzVPbZh7DBhmc-ND_rIE1ffftunvsW9Z_nlNIDEF17T1fEYU2DclTsAW7HIg' title='横浜人形の家'></div>
<div class='photo-thumb' onclick='moveToMarker(3)'><img src='https://lh3.googleusercontent.com/fPYmqL8NTOuouW7Xu5abxUne2bZpo5DHaDiltCcD1HiUgVGZFJXweLKYuVNR5YQ6U8K9y-xPXAc6Ww' title='山下公園'></div>
</div>
<script>
var map = L.map('map');
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

var markers = {};
var markerGroup = L.featureGroup().addTo(map);
var pathPoints = [];


                var icon_sekihi_png = L.icon({
                    iconUrl: 'https://lek3map.github.io/thailand/icon/sekihi.png',
                    iconSize: [30, 30],
                    iconAnchor: [15, 30],
                    popupAnchor: [0, -30]
                });
                var icon_yakata_png = L.icon({
                    iconUrl: 'https://lek3map.github.io/thailand/icon/yakata.png',
                    iconSize: [30, 30],
                    iconAnchor: [15, 30],
                    popupAnchor: [0, -30]
                });
                var icon_parks_png = L.icon({
                    iconUrl: 'https://lek3map.github.io/thailand/icon/parks.png',
                    iconSize: [30, 30],
                    iconAnchor: [15, 30],
                    popupAnchor: [0, -30]
                });
markers[1] = L.marker([35.44263, 139.651726], {icon: icon_sekihi_png}).addTo(markerGroup).bindPopup("<div style='width:250px;'><a href='https://goo.gl/photos/4w8BP3y1fmrKsuxi8' target='_blank'><img src='https://lh3.googleusercontent.com/W-5QdA3NTsBoXF95R0CM6IJxGT0h2TT3QDsyt7LS3T9ckLFwUkW5GELJRLkJixQoUT5jKjn1u9oqFg' style='width:100%; border-radius:4px;'></a><h3 style='margin:10px 0 5px 0;'>ヘボン博士邸跡</h3><div style='color:#666; font-size:1.1em;'>神奈川県横浜市中区山下町</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=35.44263,139.651726' target='_blank' style='font-weight:bold;'>📍 Google Maps</a></div>");
markers[2] = L.marker([35.443197, 139.65211], {icon: icon_yakata_png}).addTo(markerGroup).bindPopup("<div style='width:250px;'><a href='https://goo.gl/photos/MBgYmu3S22qAt8Kw7' target='_blank'><img src='https://lh3.googleusercontent.com/Uy2Cl0Iuv7EsLX-lJ5SzVPbZh7DBhmc-ND_rIE1ffftunvsW9Z_nlNIDEF17T1fEYU2DclTsAW7HIg' style='width:100%; border-radius:4px;'></a><h3 style='margin:10px 0 5px 0;'>横浜人形の家</h3><div style='color:#666; font-size:1.1em;'>神奈川県横浜市中区山下町18</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=35.443197,139.65211' target='_blank' style='font-weight:bold;'>📍 Google Maps</a></div>");
markers[3] = L.marker([35.445941, 139.649656], {icon: icon_parks_png}).addTo(markerGroup).bindPopup("<div style='width:250px;'><a href='https://goo.gl/photos/3XPqDJdnRBrFCM9B9' target='_blank'><img src='https://lh3.googleusercontent.com/fPYmqL8NTOuouW7Xu5abxUne2bZpo5DHaDiltCcD1HiUgVGZFJXweLKYuVNR5YQ6U8K9y-xPXAc6Ww' style='width:100%; border-radius:4px;'></a><h3 style='margin:10px 0 5px 0;'>山下公園</h3><div style='color:#666; font-size:1.1em;'>神奈川県横浜市中区山下町１０</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=35.445941,139.649656' target='_blank' style='font-weight:bold;'>📍 Google Maps</a></div>");


if (pathPoints.length > 0) {
    var polyline = L.polyline(pathPoints, {color: '#ff0000', weight: 4, opacity: 0.8}).addTo(map);
    map.fitBounds(polyline.getBounds(), {padding: [30, 30]});
} else if (Object.keys(markers).length > 0) {
    map.fitBounds(markerGroup.getBounds(), {padding: [50, 50]});
} else {
    map.setView([13.7563, 100.5018], 6);
}

function moveToMarker(id) { 
    var m = markers[id]; 
    if(m) { map.flyTo(m.getLatLng(), 15); m.openPopup(); } 
}
</script>
</body>
</html>
