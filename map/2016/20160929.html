<!DOCTYPE html>
<html lang='ja'>
<head>
<meta charset='utf-8'>
<meta property="og:title" content="2016年09月29日の地図日記">
<meta property="og:image" content="https://lek3map.github.io/thailand/picture/hyoushi_note.png">
<meta property="og:type" content="website">
<title>2016年09月29日の地図日記</title>
<link rel='stylesheet' href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css' />
<script src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'></script>
<style>
    body { display: flex; height: 100vh; margin: 0; background: #111; font-family: sans-serif; }
    #map { flex: 1; }
    #sidebar { width: 200px; overflow-y: auto; background: #111; padding: 10px; border-left: 1px solid #333; }
    .photo-thumb { margin-bottom: 10px; cursor: pointer; border: 2px solid transparent; }
    .photo-thumb:hover { border-color: #007bff; }
    .photo-thumb img { width: 100%; border-radius: 4px; display: block; }
</style>
</head>
<body>
<div id='map'></div>
<div id='sidebar'><div style='color:white; text-align:center; margin-bottom:15px;'>2016年09月29日</div><div class='photo-thumb' onclick='moveToMarker(1)'><img src='https://lh3.googleusercontent.com/_CiPxtKA3IVOHHHp0UmVjIhNU3wk6FZjaziBLFBTMDS1ZvPJz4qRHz8mgq_3hhl7IUIpEmGGRnJuyg' title='クスコ ⇒ リマ'></div>
<div class='photo-thumb' onclick='moveToMarker(2)'><img src='https://lh3.googleusercontent.com/lI54qXDA9P68Ddp8pA0jMQCjNhHsojHAQQTp1jE8V3mz-HEH_TlbUpDDJlSfcNwG5_-WYMBob1ExbQ' title='ラルコ・マール'></div>
<div class='photo-thumb' onclick='moveToMarker(3)'><img src='https://lh3.googleusercontent.com/kxpJDxYnZOWl_3gSsVjFo-VpL5wazPQnoQMpPnY6If0SslL4kGSl3_uTXHkcLM9L1QNN3L32ZfVoBg' title='恋人たちの公園'></div>
</div>
<script>
var map = L.map('map');
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

var markers = {};
var markerGroup = L.featureGroup().addTo(map);
var pathPoints = [];


                var icon_other_png = L.icon({
                    iconUrl: 'https://lek3map.github.io/thailand/icon/other.png',
                    iconSize: [30, 30],
                    iconAnchor: [15, 30],
                    popupAnchor: [0, -30]
                });
                var icon_starr_png = L.icon({
                    iconUrl: 'https://lek3map.github.io/thailand/icon/starr.png',
                    iconSize: [30, 30],
                    iconAnchor: [15, 30],
                    popupAnchor: [0, -30]
                });
                var icon_parks_png = L.icon({
                    iconUrl: 'https://lek3map.github.io/thailand/icon/parks.png',
                    iconSize: [30, 30],
                    iconAnchor: [15, 30],
                    popupAnchor: [0, -30]
                });
markers[1] = L.marker([-12.643834, -74.26591], {icon: icon_other_png}).addTo(markerGroup).bindPopup("<div style='width:250px;'><a href='https://goo.gl/photos/VLJXYJy4ZPbvszcH6' target='_blank'><img src='https://lh3.googleusercontent.com/_CiPxtKA3IVOHHHp0UmVjIhNU3wk6FZjaziBLFBTMDS1ZvPJz4qRHz8mgq_3hhl7IUIpEmGGRnJuyg' style='width:100%; border-radius:4px;'></a><h3 style='margin:10px 0 5px 0;'>クスコ ⇒ リマ</h3><div style='color:#666; font-size:1.1em;'>クスコ</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=-12.643834,-74.26591' target='_blank' style='font-weight:bold;'>📍 Google Maps</a></div>");
markers[2] = L.marker([-12.132081, -77.030341], {icon: icon_starr_png}).addTo(markerGroup).bindPopup("<div style='width:250px;'><a href='https://goo.gl/photos/CjPmdbUvjRqKHw8z8' target='_blank'><img src='https://lh3.googleusercontent.com/lI54qXDA9P68Ddp8pA0jMQCjNhHsojHAQQTp1jE8V3mz-HEH_TlbUpDDJlSfcNwG5_-WYMBob1ExbQ' style='width:100%; border-radius:4px;'></a><h3 style='margin:10px 0 5px 0;'>ラルコ・マール</h3><div style='color:#666; font-size:1.1em;'>リマ</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=-12.132081,-77.030341' target='_blank' style='font-weight:bold;'>📍 Google Maps</a></div>");
markers[3] = L.marker([-12.126952, -77.036549], {icon: icon_parks_png}).addTo(markerGroup).bindPopup("<div style='width:250px;'><a href='https://goo.gl/photos/S1jA5Kd7YxNH9crx5' target='_blank'><img src='https://lh3.googleusercontent.com/kxpJDxYnZOWl_3gSsVjFo-VpL5wazPQnoQMpPnY6If0SslL4kGSl3_uTXHkcLM9L1QNN3L32ZfVoBg' style='width:100%; border-radius:4px;'></a><h3 style='margin:10px 0 5px 0;'>恋人たちの公園</h3><div style='color:#666; font-size:1.1em;'>リマ</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=-12.126952,-77.036549' target='_blank' style='font-weight:bold;'>📍 Google Maps</a></div>");


if (pathPoints.length > 0) {
    var polyline = L.polyline(pathPoints, {color: '#ff0000', weight: 4, opacity: 0.8}).addTo(map);
    map.fitBounds(polyline.getBounds(), {padding: [30, 30]});
} else if (Object.keys(markers).length > 0) {
    map.fitBounds(markerGroup.getBounds(), {padding: [50, 50]});
} else {
    map.setView([13.7563, 100.5018], 6);
}

function moveToMarker(id) { 
    var m = markers[id]; 
    if(m) { map.flyTo(m.getLatLng(), 15); m.openPopup(); } 
}
</script>
</body>
</html>
