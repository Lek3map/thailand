<!DOCTYPE html>
<html lang='ja'>
<head>
<meta charset='utf-8'>
<meta property="og:title" content="2016年07月23日の地図日記">
<meta property="og:image" content="https://lek3map.github.io/thailand/picture/hyoushi_note.png">
<meta property="og:type" content="website">
<title>2016年07月23日の地図日記</title>
<link rel='stylesheet' href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css' />
<script src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'></script>
<style>
    body { display: flex; height: 100vh; margin: 0; background: #111; font-family: sans-serif; }
    #map { flex: 1; }
    #sidebar { width: 200px; overflow-y: auto; background: #111; padding: 10px; border-left: 1px solid #333; }
    .photo-thumb { margin-bottom: 10px; cursor: pointer; border: 2px solid transparent; }
    .photo-thumb:hover { border-color: #007bff; }
    .photo-thumb img { width: 100%; border-radius: 4px; display: block; }
</style>
</head>
<body>
<div id='map'></div>
<div id='sidebar'><div style='color:white; text-align:center; margin-bottom:15px;'>2016年07月23日</div><div class='photo-thumb' onclick='moveToMarker(0)'><img src='https://lek3map.github.io/thailand/picture/aruki.jpg' title='出発地'></div>
</div>
<script>
var map = L.map('map');
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

var markers = {};
var markerGroup = L.featureGroup().addTo(map);
var pathPoints = [[5.976077, 116.075523], [5.976107, 116.075066], [5.976523, 116.075203], [5.976635, 116.07473], [5.976628, 116.074287], [5.97707, 116.074188], [5.977658, 116.074295], [5.977935, 116.074654], [5.978338, 116.07486], [5.978594, 116.074493], [5.978928, 116.074188], [5.979136, 116.0746], [5.979585, 116.074692], [5.979853, 116.07428], [5.980325, 116.074135], [5.980777, 116.074097], [5.981194, 116.074295], [5.981593, 116.074516], [5.982001, 116.074715], [5.982408, 116.074905], [5.982791, 116.075134], [5.983198, 116.075333], [5.983552, 116.075623], [5.983978, 116.07579], [5.984417, 116.075996], [5.984818, 116.075783], [5.984429, 116.075516], [5.983968, 116.075356], [5.983505, 116.075165], [5.982999, 116.075005], [5.982547, 116.074821], [5.98387, 116.075005], [5.984485, 116.075119], [5.984827, 116.075897], [5.984676, 116.075661], [5.984243, 116.07579], [5.984674, 116.076042], [5.984118, 116.075951], [5.983762, 116.075699], [5.983336, 116.075562], [5.982923, 116.075371], [5.98263, 116.07502], [5.982178, 116.074944], [5.981803, 116.074669], [5.981363, 116.074539], [5.980937, 116.074364], [5.980562, 116.074104], [5.980109, 116.074043], [5.979668, 116.073914], [5.979209, 116.073944], [5.978763, 116.073853], [5.978319, 116.073944], [5.978385, 116.074409]];


                var icon_start_png = L.icon({
                    iconUrl: 'https://lek3map.github.io/thailand/icon/start.png',
                    iconSize: [30, 30],
                    iconAnchor: [15, 30],
                    popupAnchor: [0, -30]
                });
markers[0] = L.marker([5.976077, 116.075523], {icon: icon_start_png}).addTo(markerGroup).bindPopup("<div style='width:250px;'><a href='https://lek3map.github.io/thailand/picture/aruki.jpg' target='_blank'><img src='https://lek3map.github.io/thailand/picture/aruki.jpg' style='width:100%; border-radius:4px;'></a><h3 style='margin:10px 0 5px 0;'>出発地</h3><div style='color:#666; font-size:1.1em;'>コタキナバル</div><hr style='border:0; border-top:1px solid #eee;'><a href='https://www.google.com/maps?q=5.976077,116.075523' target='_blank' style='font-weight:bold;'>📍 Google Maps</a></div>");


if (pathPoints.length > 0) {
    var polyline = L.polyline(pathPoints, {color: '#ff0000', weight: 4, opacity: 0.8}).addTo(map);
    map.fitBounds(polyline.getBounds(), {padding: [30, 30]});
} else if (Object.keys(markers).length > 0) {
    map.fitBounds(markerGroup.getBounds(), {padding: [50, 50]});
} else {
    map.setView([13.7563, 100.5018], 6);
}

function moveToMarker(id) { 
    var m = markers[id]; 
    if(m) { map.flyTo(m.getLatLng(), 15); m.openPopup(); } 
}
</script>
</body>
</html>
