<!DOCTYPE html>
<html>
<head>
    <title>Thailand Travel Archive</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.7.0/gpx.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { margin: 0; padding: 0; }
        #map { height: 100vh; width: 100%; }
        .sidebar { position: absolute; top: 10px; right: 10px; z-index: 1000; background: white; padding: 15px; max-height: 80vh; overflow-y: auto; border-radius: 8px; box-shadow: 0 0 20px rgba(0,0,0,0.3); width: 240px; font-family: sans-serif; border: 1px solid #ccc; }
        .date-item { display: flex; align-items: center; padding: 10px; border-bottom: 1px solid #eee; font-size: 14px; cursor: pointer; }
        .date-item input { margin-right: 12px; transform: scale(1.2); }
        .popup-image { max-width: 240px; height: auto; display: block; margin-top: 10px; border-radius: 5px; }
    </style>
</head>
<body>

<div id="map"></div>
<div class="sidebar">
    <h3 style="margin:0 0 10px 0; font-size: 16px;">旅の目次</h3>
    <div id="date-list"></div>
</div>

<script>
    const map = L.map('map').setView([15.0, 102.0], 6);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    const activeLayers = {}; 

    // Excelの数値を日付文字列に直す
    function formatToDate(val) {
        if (!val) return "";
        let d = (typeof val === 'number' && val > 30000) ? new Date(Math.round((val - 25569) * 86400 * 1000)) : new Date(val);
        if (isNaN(d.getTime())) return val.toString().trim();
        return `${d.getFullYear()}/${(d.getMonth() + 1).toString().padStart(2, '0')}/${d.getDate().toString().padStart(2, '0')}`;
    }

    async function loadArchive() {
        try {
            const response = await fetch('data.xlsx');
            const arrayBuffer = await response.arrayBuffer();
            const workbook = XLSX.read(new Uint8Array(arrayBuffer), {type: 'array'});
            const sheet = workbook.Sheets[workbook.SheetNames[0]];
            const rows = XLSX.utils.sheet_to_json(sheet, {header: 1}); 

            const dateList = document.getElementById('date-list');
            const groupedData = {};

            // 7行のデータを丁寧に仕分け
            rows.forEach((row, i) => {
                if (i === 0 || !row || row.length < 4) return;
                
                const name = row[0] || "地点";
                const lat = parseFloat(row[1]);
                const lon = parseFloat(row[2]);
                const date = formatToDate(row[3]);
                const desc = row[5] || "";
                const img = row[7] || "";
                const gpxFile = row[10] ? row[10].toString().trim() : "";

                if (!date || isNaN(lat)) return;
                if (!groupedData[date]) groupedData[date] = { points: [], gpx: gpxFile };
                groupedData[date].points.push({ lat, lon, name, img, desc });
            });

            // 目次を作成
            Object.keys(groupedData).sort().reverse().forEach(date => {
                const dayData = groupedData[date];
                const div = document.createElement('div');
                div.className = 'date-item';
                div.innerHTML = `<input type="checkbox"> <label>${date}</label>`;
                
                div.onclick = (e) => {
                    const chk = div.querySelector('input');
                    if (e.target !== chk) chk.checked = !chk.checked;

                    if (chk.checked) {
                        const group = L.layerGroup().addTo(map);
                        activeLayers[date] = group;

                        // 1. ピンを表示
                        dayData.points.forEach(p => {
                            const content = `<div><strong>${p.name}</strong><br>${p.desc}<br>${p.img ? `<img src="${p.img}" class="popup-image">` : ""}</div>`;
                            L.marker([p.lat, p.lon]).bindPopup(content).addTo(group);
                        });

                        // 2. 軌跡（GPX）を表示
                        if (dayData.gpx) {
                            const gpxUrl = "logs/" + dayData.gpx;
                            new L.GPX(gpxUrl, {
                                async: true,
                                marker_options: { startIconUrl: '', endIconUrl: '', shadowUrl: '' },
                                polyline_options: { color: '#ff4500', weight: 6, opacity: 0.9 }
                            }).on('loaded', e => map.fitBounds(e.target.getBounds())).addTo(group);
                        }
                    } else {
                        if (activeLayers[date]) { map.removeLayer(activeLayers[date]); delete activeLayers[date]; }
                    }
                };
                dateList.appendChild(div);
            });
        } catch (e) { console.error(e); }
    }
    loadArchive();
</script>
</body>
</html>
