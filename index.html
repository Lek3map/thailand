<!DOCTYPE html>
<html>
<head>
    <title>Thailand Travel Archive</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.7.0/gpx.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { margin: 0; padding: 0; }
        #map { height: 100vh; width: 100%; }
        .sidebar { position: absolute; top: 10px; right: 10px; z-index: 1000; background: white; padding: 15px; max-height: 80vh; overflow-y: auto; border-radius: 8px; box-shadow: 0 0 20px rgba(0,0,0,0.3); width: 220px; font-family: sans-serif; }
        .date-item { cursor: pointer; padding: 10px; border-bottom: 1px solid #eee; font-size: 14px; color: #333; font-weight: bold; }
        .date-item:hover { background: #f0f7ff; color: #007bff; }
        .popup-image { max-width: 250px; height: auto; display: block; margin-top: 10px; border-radius: 5px; }
    </style>
</head>
<body>

<div id="map"></div>
<div class="sidebar">
    <h3 style="margin:0 0 10px 0; font-size: 16px; border-bottom: 2px solid #007bff;">旅の目次</h3>
    <div id="date-list"></div>
</div>

<script>
    const map = L.map('map').setView([15.0, 102.0], 6);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    let currentGpxLayer = null;
    let markers = [];

    // 日付を「◯◯年◯月◯日」に直す関数
    function parseDate(val) {
        if (!val) return "";
        if (typeof val === 'number' && val > 30000) {
            const d = new Date(Math.round((val - 25569) * 86400 * 1000));
            return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
        }
        return val.toString().trim();
    }

    async function loadArchive() {
        try {
            const response = await fetch('data.xlsx');
            const arrayBuffer = await response.arrayBuffer();
            const data = new Uint8Array(arrayBuffer);
            const workbook = XLSX.read(data, {type: 'array'});
            const sheet = workbook.Sheets[workbook.SheetNames[0]];
            const rows = XLSX.utils.sheet_to_json(sheet, {header: 1}); 

            const dateList = document.getElementById('date-list');
            const groupedData = {};

            rows.forEach((row, i) => {
                if (i === 0 || !row || row.length < 3) return; // 見出しと空行を飛ばす

                // 列の並びに依存せず、内容から推測して取得
                let date = "", lat = NaN, lon = NaN, gpx = "", img = "", name = row[0];

                row.forEach((cell, idx) => {
                    if (!cell) return;
                    const str = cell.toString().toLowerCase();

                    // 日付（45666などの数字、または「年」を含む）
                    if ((typeof cell === 'number' && cell > 30000 && cell < 60000) || str.includes("年")) {
                        date = parseDate(cell);
                    }
                    // 緯度・経度（10〜20の間なら緯度、90〜110の間なら経度と推測）
                    const num = parseFloat(cell);
                    if (!isNaN(num)) {
                        if (num > 5 && num < 25) lat = num;
                        if (num > 95 && num < 110) lon = num;
                    }
                    // GPXファイル
                    if (str.endsWith(".gpx")) gpx = cell;
                    // 画像
                    if (str.startsWith("http") && (str.includes("google") || str.includes(".jpg"))) img = cell;
                });

                if (!date || isNaN(lat)) return;

                if (!groupedData[date]) {
                    groupedData[date] = { points: [], gpx: gpx };
                    const div = document.createElement('div');
                    div.className = 'date-item';
                    div.innerText = date;
                    div.onclick = () => showDate(date);
                    dateList.appendChild(div);
                }
                groupedData[date].points.push({ lat, lon, name, img, desc: row[5] || "" });
            });

            function showDate(date) {
                if (currentGpxLayer) map.removeLayer(currentGpxLayer);
                markers.forEach(m => map.removeLayer(m));
                markers = [];

                const dayData = groupedData[date];

                if (dayData.gpx) {
                    currentGpxLayer = new L.GPX(`logs/${dayData.gpx.toString().trim()}`, {
                        async: true,
                        marker_options: { startIconUrl: '', endIconUrl: '', shadowUrl: '' },
                        polyline_options: { color: '#ff4500', weight: 5 }
                    }).on('loaded', e => map.fitBounds(e.target.getBounds())).addTo(map);
                }

                dayData.points.forEach(p => {
                    const content = `<div><strong>${p.name}</strong><br>${p.desc}<br>${p.img ? `<img src="${p.img}" class="popup-image">` : ""}</div>`;
                    const m = L.marker([p.lat, p.lon]).addTo(map).bindPopup(content);
                    markers.push(m);
                });
            }
        } catch (e) { console.error(e); }
    }
    loadArchive();
</script>
</body>
</html>
