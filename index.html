<!DOCTYPE html>
<html>
<head>
    <title>Thailand Travel Archive</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.7.0/gpx.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { margin: 0; padding: 0; }
        #map { height: 100vh; width: 100%; }
        .sidebar { position: absolute; top: 10px; right: 10px; z-index: 1000; background: white; padding: 15px; max-height: 80vh; overflow-y: auto; border-radius: 8px; box-shadow: 0 0 20px rgba(0,0,0,0.3); width: 240px; font-family: sans-serif; }
        .date-item { display: flex; align-items: center; padding: 8px; border-bottom: 1px solid #eee; font-size: 14px; cursor: pointer; }
        .date-item:hover { background: #f9f9f9; }
        .date-item input { margin-right: 10px; cursor: pointer; }
        .popup-image { max-width: 250px; height: auto; display: block; margin-top: 10px; border-radius: 5px; }
    </style>
</head>
<body>

<div id="map"></div>
<div class="sidebar">
    <h3 style="margin:0 0 10px 0; font-size: 16px; border-bottom: 2px solid #007bff;">旅の目次</h3>
    <div id="date-list"></div>
</div>

<script>
    const map = L.map('map').setView([15.0, 102.0], 6);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    const activeLayers = {}; 

    function formatExcelDate(val) {
        if (!val) return "";
        if (typeof val === 'number' && val > 30000) {
            const d = new Date(Math.round((val - 25569) * 86400 * 1000));
            const y = d.getFullYear();
            const m = (d.getMonth() + 1).toString().padStart(2, '0');
            const day = d.getDate().toString().padStart(2, '0');
            return `${y}/${m}/${day}`;
        }
        return val.toString().trim();
    }

    async function loadArchive() {
        try {
            const response = await fetch('data.xlsx');
            const arrayBuffer = await response.arrayBuffer();
            const workbook = XLSX.read(new Uint8Array(arrayBuffer), {type: 'array'});
            const sheet = workbook.Sheets[workbook.SheetNames[0]];
            
            // 見出しの名前を使ってオブジェクト形式で読み込む（これなら列がズレても大丈夫）
            const data = XLSX.utils.sheet_to_json(sheet); 

            const groupedData = {};

            data.forEach(row => {
                // Excelの1行目の名前に合わせてデータを取得（ここを実際のExcelの見出し名と合わせてください）
                const dateRaw = row["日付"] || row["Date"] || row["Date欄"];
                const date = formatExcelDate(dateRaw);
                const lat = parseFloat(row["緯度"] || row["Lat"] || row["緯度欄"]);
                const lon = parseFloat(row["経度"] || row["Lon"] || row["経度欄"]);
                const gpx = row["GPXファイル名"] || row["GPX"] || row["GpxFile"] || "";
                const img = row["画像URL"] || row["URL"] || row["Image"] || "";
                const name = row["地点名"] || row["Name"] || "地点";
                const desc = row["備考"] || row["詳細"] || "";

                if (!date || isNaN(lat)) return;

                if (!groupedData[date]) {
                    groupedData[date] = { points: [], gpx: gpx.toString().trim() };
                }
                groupedData[date].points.push({ lat, lon, name, img, desc });
            });

            const dateList = document.getElementById('date-list');
            // 日付順に並び替えて目次を作成
            Object.keys(groupedData).sort((a, b) => b.localeCompare(a)).forEach(date => {
                const dayData = groupedData[date];
                const div = document.createElement('div');
                div.className = 'date-item';
                div.innerHTML = `<input type="checkbox"> <label>${date}</label>`;
                
                div.onclick = (e) => {
                    const chk = div.querySelector('input');
                    if (e.target !== chk) chk.checked = !chk.checked;

                    if (chk.checked) {
                        const group = L.layerGroup().addTo(map);
                        activeLayers[date] = group;

                        // ピンを表示
                        dayData.points.forEach(p => {
                            const content = `<div><strong>${p.name}</strong><br>${p.desc}<br>${p.img ? `<img src="${p.img}" class="popup-image">` : ""}</div>`;
                            L.marker([p.lat, p.lon]).bindPopup(content).addTo(group);
                        });

                        // 軌跡（GPX）を表示
                        if (dayData.gpx) {
                            const gpxUrl = "logs/" + dayData.gpx;
                            new L.GPX(gpxUrl, {
                                async: true,
                                marker_options: { startIconUrl: '', endIconUrl: '', shadowUrl: '' },
                                polyline_options: { color: '#ff4500', weight: 4, opacity: 0.8 }
                            }).on('loaded', (e) => {
                                map.fitBounds(e.target.getBounds());
                            }).addTo(group);
                        }
                    } else {
                        if (activeLayers[date]) {
                            map.removeLayer(activeLayers[date]);
                            delete activeLayers[date];
                        }
                    }
                };
                dateList.appendChild(div);
            });
        } catch (e) { console.error(e); }
    }
    loadArchive();
</script>
</body>
</html>
