<!DOCTYPE html>
<html>
<head>
    <title>Thailand Travel Archive</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.7.0/gpx.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { margin: 0; padding: 0; }
        #map { height: 100vh; width: 100%; }
        .sidebar { position: absolute; top: 10px; right: 10px; z-index: 1000; background: white; padding: 15px; max-height: 80vh; overflow-y: auto; border-radius: 8px; box-shadow: 0 0 20px rgba(0,0,0,0.3); width: 220px; font-family: sans-serif; }
        .date-item { cursor: pointer; padding: 10px; border-bottom: 1px solid #eee; font-size: 14px; color: #333; font-weight: bold; }
        .date-item:hover { background: #f0f7ff; color: #007bff; }
        .popup-image { max-width: 250px; height: auto; display: block; margin-top: 10px; border-radius: 5px; }
    </style>
</head>
<body>

<div id="map"></div>
<div class="sidebar">
    <h3 style="margin:0 0 10px 0; font-size: 16px; border-bottom: 2px solid #007bff;">旅の目次</h3>
    <div id="date-list"></div>
</div>

<script>
    const map = L.map('map').setView([15.0, 102.0], 6);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    let currentGpxLayer = null;
    let markers = [];

    async function loadArchive() {
        try {
            const response = await fetch('data.xlsx');
            const arrayBuffer = await response.arrayBuffer();
            const data = new Uint8Array(arrayBuffer);
            // raw: false, cellText: true で「見たまま」を最優先
            const workbook = XLSX.read(data, {type: 'array', cellText: true, raw: false});
            const sheet = workbook.Sheets[workbook.SheetNames[0]];
            
            // どんな形式でもオブジェクトとして読み込む
            const rows = XLSX.utils.sheet_to_json(sheet, {defval: ""}); 

            const dateList = document.getElementById('date-list');
            const groupedData = {};

            rows.forEach(row => {
                // 列名が何であっても、値の内容から推測して取得
                let date = "";
                let lat = NaN, lon = NaN, gpx = "", img = "", name = "", desc = "";

                for (let key in row) {
                    let val = row[key] ? row[key].toString().trim() : "";
                    if (!val) continue;

                    // 日付（年、月、日が含まれる、または特定の形式）
                    if (key.includes("日付") || key.includes("Date") || val.includes("年")) date = val;
                    // 緯度・経度
                    if (key.includes("緯度") || key.includes("Lat") || (!isNaN(val) && val.startsWith("1"))) {
                         if (val.includes(".")) {
                             if (parseFloat(val) < 30) lat = parseFloat(val);
                             else if (parseFloat(val) > 90) lon = parseFloat(val);
                         }
                    }
                    if (key.includes("経度") || key.includes("Lon")) lon = parseFloat(val);
                    // GPXファイル
                    if (val.toLowerCase().endsWith(".gpx")) gpx = val;
                    // 画像URL
                    if (val.startsWith("http") && (val.includes(".jpg") || val.includes(".png") || val.includes("googleusercontent"))) img = val;
                    // 地点名（最初の列など）
                    if (key === Object.keys(row)[0]) name = val;
                    // 詳細（備考など）
                    if (key.includes("市場") || key.includes("詳細") || key.includes("備考")) desc = val;
                }

                if (!date) return;

                if (!groupedData[date]) {
                    groupedData[date] = { points: [], gpx: gpx };
                    const div = document.createElement('div');
                    div.className = 'date-item';
                    div.innerText = date;
                    div.onclick = () => showDate(date);
                    dateList.appendChild(div);
                }
                groupedData[date].points.push({ lat, lon, name, img, desc });
            });

            function showDate(date) {
                if (currentGpxLayer) map.removeLayer(currentGpxLayer);
                markers.forEach(m => map.removeLayer(m));
                markers = [];

                const dayData = groupedData[date];

                if (dayData.gpx) {
                    const gpxPath = `logs/${dayData.gpx}`;
                    currentGpxLayer = new L.GPX(gpxPath, {
                        async: true,
                        marker_options: { startIconUrl: '', endIconUrl: '', shadowUrl: '' },
                        polyline_options: { color: '#ff4500', weight: 5, opacity: 0.8 }
                    }).on('loaded', function(e) {
                        map.fitBounds(e.target.getBounds());
                    }).addTo(map);
                }

                dayData.points.forEach(p => {
                    if (!isNaN(p.lat) && !isNaN(p.lon)) {
                        const popupContent = `<div><strong>${p.name}</strong><br>${p.desc}<br>${p.img ? `<img src="${p.img}" class="popup-image">` : ""}</div>`;
                        const m = L.marker([p.lat, p.lon]).addTo(map).bindPopup(popupContent);
                        markers.push(m);
                    }
                });
            }
        } catch (e) { console.error(e); }
    }
    loadArchive();
</script>
</body>
</html>
