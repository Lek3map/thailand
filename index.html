<!DOCTYPE html>
<html>
<head>
    <title>Thailand Travel Archive</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.7.0/gpx.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { margin: 0; }
        #map { height: 100vh; width: 100%; background: #eee; }
        .sidebar { position: absolute; top: 10px; right: 10px; z-index: 1000; background: white; padding: 10px; max-height: 90vh; overflow-y: auto; width: 220px; border: 2px solid #333; }
        .date-item { padding: 10px; border-bottom: 1px solid #ccc; font-size: 16px; cursor: pointer; display: flex; align-items: center; }
        .date-item input { margin-right: 10px; width: 20px; height: 20px; }
    </style>
</head>
<body>

<div id="map"></div>
<div class="sidebar">
    <div style="font-weight:bold; border-bottom:2px solid #333; margin-bottom:10px;">旅の目次</div>
    <div id="date-list">読み込み中...</div>
</div>

<script>
    // 1. 地図を表示
    const map = L.map('map').setView([15.0, 102.0], 6);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    const activeLayers = {}; 

    async function load() {
        try {
            // 2. Excel (data.xlsx) を読み込む
            const res = await fetch('data.xlsx');
            const ab = await res.arrayBuffer();
            const wb = XLSX.read(new Uint8Array(ab), {type: 'array'});
            const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header: 1}); 

            const dateList = document.getElementById('date-list');
            dateList.innerHTML = "";
            const grouped = {};

            // 3. データを整理 (1列目:名, 2:緯度, 3:経度, 4:日, 6:備考, 8:画像, 11:GPX)
            for(let i=1; i < rows.length; i++) {
                const r = rows[i];
                if(!r || r.length < 4) continue;

                // 日付が数字（45666等）の場合は変換
                let dStr = r[3];
                if(typeof dStr === 'number') {
                    const d = new Date(Math.round((dStr - 25569) * 86400 * 1000));
                    dStr = `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`;
                }

                if(!grouped[dStr]) grouped[dStr] = { points: [], gpx: r[10] };
                grouped[dStr].points.push({ lat: r[1], lon: r[2], name: r[0], desc: r[5], img: r[7] });
            }

            // 4. 目次を作る
            Object.keys(grouped).sort().reverse().forEach(date => {
                const div = document.createElement('div');
                div.className = 'date-item';
                div.innerHTML = `<input type="checkbox"> ${date}`;
                
                div.onclick = (e) => {
                    const chk = div.querySelector('input');
                    if (e.target !== chk) chk.checked = !chk.checked;

                    if (chk.checked) {
                        const group = L.layerGroup().addTo(map);
                        activeLayers[date] = group;

                        // 軌跡(GPX)
                        if (grouped[date].gpx) {
                            new L.GPX("logs/" + grouped[date].gpx, {
                                async: true,
                                marker_options: { startIconUrl: '', endIconUrl: '' },
                                polyline_options: { color: 'orange', weight: 6, opacity: 0.9 }
                            }).on('loaded', e => map.fitBounds(e.target.getBounds())).addTo(group);
                        }

                        // ピン
                        grouped[date].points.forEach(p => {
                            const html = `<b>${p.name}</b><br>${p.desc}${p.img ? `<br><img src="${p.img}" style="width:200px">` : ""}`;
                            L.marker([p.lat, p.lon]).bindPopup(html).addTo(group);
                        });
                    } else {
                        if (activeLayers[date]) { map.removeLayer(activeLayers[date]); delete activeLayers[date]; }
                    }
                };
                dateList.appendChild(div);
            });
        } catch (e) { dateList.innerText = "エラー: " + e; }
    }
    load();
</script>
</body>
</html>
