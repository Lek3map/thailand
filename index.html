<!DOCTYPE html>
<html>
<head>
    <title>Thailand Travel Archive</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.7.0/gpx.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        #map { height: 100vh; width: 100%; }
        .sidebar { position: absolute; top: 10px; right: 10px; z-index: 1000; background: white; padding: 10px; max-height: 80vh; overflow-y: auto; border-radius: 5px; box-shadow: 0 0 15px rgba(0,0,0,0.2); width: 200px; }
        .sidebar h4 { margin: 0 0 10px; }
        .date-item { cursor: pointer; padding: 5px; border-bottom: 1px solid #eee; font-size: 14px; }
        .date-item:hover { background: #f0f0f0; }
        /* 写真のサイズを調整する設定 */
        .popup-image { max-width: 100%; height: auto; display: block; margin-top: 5px; border-radius: 4px; }
        .leaflet-popup-content { width: 300px !important; }
    </style>
</head>
<body>

<div id="map"></div>
<div class="sidebar">
    <h4>旅の記録</h4>
    <div id="date-list"></div>
</div>

<script>
    const map = L.map('map').setView([13.7563, 100.5018], 6);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    let currentGpxLayer = null;

    // 日本語の日付（2025年1月10日）を標準形式（2025-01-10）に変換する関数
    function formatDate(dateStr) {
        if (!dateStr) return "";
        return dateStr.replace(/年|月/g, '-').replace(/日/g, '').replace(/-(\d)(?!\d)/g, '-0$1').replace(/-(\d)$/g, '-0$1');
    }

    async function loadArchive() {
        const response = await fetch('data.xlsx');
        const arrayBuffer = await response.arrayBuffer();
        const data = new Uint8Array(arrayBuffer);
        const workbook = XLSX.read(data, {type: 'array'});
        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet);

        const dateList = document.getElementById('date-list');
        const groupedData = {};

        rows.forEach(row => {
            // ここで日付を変換
            const date = formatDate(row["日付"] || row["Date"]); 
            if (!groupedData[date]) {
                groupedData[date] = { points: [], gpx: row["GpxFile"] || row["GPXファイル名"] };
                const div = document.createElement('div');
                div.className = 'date-item';
                div.innerText = date;
                div.onclick = () => showDate(date);
                dateList.appendChild(div);
            }
            groupedData[date].points.push(row);
        });

        async function showDate(date) {
            if (currentGpxLayer) map.removeLayer(currentGpxLayer);
            
            const dayData = groupedData[date];
            
            // GPXの読み込み
            if (dayData.gpx) {
                currentGpxLayer = new L.GPX(`logs/${dayData.gpx}`, {
                    async: true,
                    marker_options: { startIconUrl: '', endIconUrl: '', shadowUrl: '' }
                }).on('loaded', function(e) {
                    map.fitBounds(e.target.getBounds());
                }).addTo(map);
            }

            // ピンの表示
            dayData.points.forEach(p => {
                const lat = p["Lat"] || p["緯度"];
                const lon = p["Lon"] || p["経度"];
                if (lat && lon) {
                    const imgUrl = p["Image"] || p["画像URL"];
                    const popupContent = `
                        <strong>${p["Name"] || p["地点名"]}</strong><br>
                        ${p["Description"] || p["備考"] || ""}<br>
                        ${imgUrl ? `<img src="${imgUrl}" class="popup-image">` : ""}
                    `;
                    L.marker([lat, lon]).addTo(map).bindPopup(popupContent);
                }
            });
        }
    }

    loadArchive();
</script>
</body>
</html>
