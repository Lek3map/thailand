<!DOCTYPE html>
<html>
<head>
    <title>Thailand Travel Archive</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.7.0/gpx.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { margin: 0; padding: 0; }
        #map { height: 100vh; width: 100%; }
        .sidebar { position: absolute; top: 10px; right: 10px; z-index: 1000; background: white; padding: 15px; max-height: 80vh; overflow-y: auto; border-radius: 8px; box-shadow: 0 0 20px rgba(0,0,0,0.3); width: 220px; font-family: sans-serif; }
        .date-item { cursor: pointer; padding: 10px; border-bottom: 1px solid #eee; font-size: 14px; color: #333; font-weight: bold; }
        .date-item:hover { background: #f0f7ff; color: #007bff; }
        .popup-image { max-width: 250px; height: auto; display: block; margin-top: 10px; border-radius: 5px; }
        .leaflet-popup-content { width: 260px !important; }
    </style>
</head>
<body>

<div id="map"></div>
<div class="sidebar">
    <h3 style="margin:0 0 10px 0; font-size: 16px; border-bottom: 2px solid #007bff;">旅の目次</h3>
    <div id="date-list"></div>
</div>

<script>
    const map = L.map('map').setView([15.0, 102.0], 6);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    let currentGpxLayer = null;
    let markers = [];

    async function loadArchive() {
        try {
            const response = await fetch('data.xlsx');
            const arrayBuffer = await response.arrayBuffer();
            const data = new Uint8Array(arrayBuffer);
            const workbook = XLSX.read(data, {type: 'array'});
            const sheet = workbook.Sheets[workbook.SheetNames[0]];
            
            // オブジェクト形式で読み込む（見出しの名前をキーにする）
            const rows = XLSX.utils.sheet_to_json(sheet); 

            const dateList = document.getElementById('date-list');
            const groupedData = {};

            rows.forEach(row => {
                // 見出しの名前に合わせてデータを取得（Excelの1行目の文字と一致させてください）
                const date = row["日付"] || row["Date"] || row["Date欄"];
                const lat = parseFloat(row["緯度"] || row["Lat"] || row["緯度欄"]);
                const lon = parseFloat(row["経度"] || row["Lon"] || row["経度欄"]);
                const placeName = row["地点名"] || row["Name"] || row["ムクダハン"]; // 最初の列
                const imgUrl = row["画像URL"] || row["Image"] || row["URL"];
                const gpxFile = row["GPXファイル名"] || row["GpxFile"] || row["GPX"];

                if (!date) return;

                if (!groupedData[date]) {
                    groupedData[date] = { points: [], gpx: gpxFile };
                    const div = document.createElement('div');
                    div.className = 'date-item';
                    div.innerText = date;
                    div.onclick = () => showDate(date);
                    dateList.appendChild(div);
                }
                groupedData[date].points.push({ 
                    lat, lon, 
                    name: placeName || "地点", 
                    img: imgUrl, 
                    desc: row["備考"] || row["詳細"] || "" 
                });
            });

            function showDate(date) {
                if (currentGpxLayer) map.removeLayer(currentGpxLayer);
                markers.forEach(m => map.removeLayer(m));
                markers = [];

                const dayData = groupedData[date];

                if (dayData.gpx) {
                    const gpxPath = `logs/${dayData.gpx.toString().trim()}`;
                    currentGpxLayer = new L.GPX(gpxPath, {
                        async: true,
                        marker_options: { startIconUrl: '', endIconUrl: '', shadowUrl: '' },
                        polyline_options: { color: '#ff4500', weight: 5, opacity: 0.8 }
                    }).on('loaded', function(e) {
                        map.fitBounds(e.target.getBounds());
                    }).addTo(map);
                }

                dayData.points.forEach(p => {
                    if (!isNaN(p.lat) && !isNaN(p.lon)) {
                        const popupContent = `
                            <div>
                                <strong style="font-size:14px;">${p.name}</strong><br>
                                <span style="font-size:12px; color:#666;">${p.desc}</span><br>
                                ${p.img ? `<img src="${p.img}" class="popup-image">` : ""}
                            </div>
                        `;
                        const m = L.marker([p.lat, p.lon]).addTo(map).bindPopup(popupContent);
                        markers.push(m);
                    }
                });
            }
        } catch (e) {
            console.error("エラー:", e);
        }
    }

    loadArchive();
</script>
</body>
</html>
