<!DOCTYPE html>
<html>
<head>
    <title>Thailand Travel Archive</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.7.0/gpx.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { margin: 0; padding: 0; }
        #map { height: 100vh; width: 100%; background: #eee; }
        .sidebar { position: absolute; top: 10px; right: 10px; z-index: 1000; background: white; padding: 15px; max-height: 80vh; overflow-y: auto; border-radius: 8px; box-shadow: 0 0 20px rgba(0,0,0,0.3); width: 240px; font-family: sans-serif; }
        .date-item { display: flex; align-items: center; padding: 10px; border-bottom: 1px solid #eee; font-size: 14px; cursor: pointer; }
        .date-item:hover { background: #f0f7ff; }
        .date-item input { margin-right: 12px; transform: scale(1.3); }
        .popup-image { max-width: 240px; height: auto; display: block; margin-top: 8px; border-radius: 4px; }
    </style>
</head>
<body>

<div id="map"></div>
<div class="sidebar">
    <h3 style="margin:0 0 10px 0; font-size: 16px; color: #007bff;">旅の目次</h3>
    <div id="date-list">読み込み中...</div>
</div>

<script>
    // 1. まず地図を出す（これが消えないように最優先）
    const map = L.map('map').setView([15.0, 102.0], 6);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    const activeLayers = {}; 

    // Excelの日付（数字）を文字列に変換
    function excelDateToJS(serial) {
        if (typeof serial !== 'number') return serial;
        const d = new Date(Math.round((serial - 25569) * 86400 * 1000));
        return `${d.getFullYear()}/${(d.getMonth() + 1).toString().padStart(2, '0')}/${d.getDate().toString().padStart(2, '0')}`;
    }

    async function start() {
        try {
            const res = await fetch('data.xlsx');
            const ab = await res.arrayBuffer();
            const wb = XLSX.read(new Uint8Array(ab), {type: 'array'});
            const sheet = wb.Sheets[wb.SheetNames[0]];
            const rows = XLSX.utils.sheet_to_json(sheet, {header: 1}); 

            const dateList = document.getElementById('date-list');
            dateList.innerHTML = "";
            const grouped = {};

            // 7行のデータを1行ずつ処理
            for(let i=1; i<rows.length; i++) {
                const r = rows[i];
                if(!r || r.length < 4) continue;

                const name = r[0] || "地点";
                const lat = parseFloat(r[1]);
                const lon = parseFloat(r[2]);
                const date = excelDateToJS(r[3]);
                const desc = r[5] || "";
                const img = r[7] || "";
                const gpx = r[10] ? r[10].toString().trim() : "";

                if(!date || isNaN(lat)) continue;
                if(!grouped[date]) grouped[date] = { points: [], gpx: gpx };
                grouped[date].points.push({ lat, lon, name, img, desc });
            }

            // 目次作成
            Object.keys(grouped).sort().reverse().forEach(date => {
                const day = grouped[date];
                const item = document.createElement('div');
                item.className = 'date-item';
                item.innerHTML = `<input type="checkbox"> <label>${date}</label>`;
                
                item.onclick = (e) => {
                    const chk = item.querySelector('input');
                    if (e.target !== chk) chk.checked = !chk.checked;

                    if (chk.checked) {
                        const group = L.layerGroup().addTo(map);
                        activeLayers[date] = group;

                        // ピン表示
                        day.points.forEach(p => {
                            const html = `<b>${p.name}</b><br>${p.desc}${p.img ? `<br><img src="${p.img}" class="popup-image">` : ""}`;
                            L.marker([p.lat, p.lon]).bindPopup(html).addTo(group);
                        });

                        // 軌跡(GPX)表示
                        if (day.gpx) {
                            const gpxLayer = new L.GPX("logs/" + day.gpx, {
                                async: true,
                                marker_options: { startIconUrl: '', endIconUrl: '', shadowUrl: '' },
                                polyline_options: { color: '#ff4500', weight: 6, opacity: 0.9 }
                            }).on('loaded', e => map.fitBounds(e.target.getBounds())).addTo(group);
                        }
                    } else {
                        if (activeLayers[date]) { map.removeLayer(activeLayers[date]); delete activeLayers[date]; }
                    }
                };
                dateList.appendChild(item);
            });
        } catch (err) {
            document.getElementById('date-list').innerText = "読み込みエラー";
        }
    }
    start();
</script>
</body>
</html>
