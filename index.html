<!DOCTYPE html>
<html>
<head>
    <title>Thailand Travel Archive</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.7.0/gpx.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { margin: 0; padding: 0; }
        #map { height: 100vh; width: 100%; }
        .sidebar { position: absolute; top: 10px; right: 10px; z-index: 1000; background: white; padding: 15px; max-height: 80vh; overflow-y: auto; border-radius: 8px; box-shadow: 0 0 20px rgba(0,0,0,0.3); width: 220px; font-family: sans-serif; }
        .date-item { cursor: pointer; padding: 8px; border-bottom: 1px solid #eee; font-size: 14px; color: #333; font-weight: bold; }
        .date-item:hover { background: #eef6ff; color: #007bff; }
        .popup-image { max-width: 250px; height: auto; display: block; margin-top: 10px; border-radius: 5px; }
        .leaflet-popup-content { width: 260px !important; }
    </style>
</head>
<body>

<div id="map"></div>
<div class="sidebar">
    <h3 style="margin-top:0; font-size: 16px;">旅の目次</h3>
    <div id="date-list"></div>
</div>

<script>
    const map = L.map('map').setView([15.0, 102.0], 6);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    let currentGpxLayer = null;
    let markers = [];

    async function loadArchive() {
        try {
            const response = await fetch('data.xlsx');
            const arrayBuffer = await response.arrayBuffer();
            const data = new Uint8Array(arrayBuffer);
            const workbook = XLSX.read(data, {type: 'array'});
            const sheet = workbook.Sheets[workbook.SheetNames[0]];
            const rows = XLSX.utils.sheet_to_json(sheet, {header: 1}); 

            const dateList = document.getElementById('date-list');
            const groupedData = {};

            // 1行目（見出し）を飛ばして2行目から読み込み
            for (let i = 1; i < rows.length; i++) {
                const row = rows[i];
                if (!row || row.length < 4) continue; 
                
                // 列の対応（ムクダハンの例に準拠）
                // 0:地点名, 1:緯度, 2:経度, 3:日付, 4:空?, 5:分類, 6:詳細, 7:タイ語, 8:画像URL, 9:GooglePhoto, 10:GPX名
                const placeName = row[0];
                const lat = parseFloat(row[1]);
                const lon = parseFloat(row[2]);
                const date = row[3]; // ここを日付列として固定
                const imgUrl = row[8]; // 画像URLの列
                const gpxFile = row[11] || row[10]; // GPXファイル名の列

                if (!date || isNaN(lat)) continue;

                if (!groupedData[date]) {
                    groupedData[date] = { points: [], gpx: gpxFile };
                    const div = document.createElement('div');
                    div.className = 'date-item';
                    div.innerText = date;
                    div.onclick = () => showDate(date);
                    dateList.appendChild(div);
                }
                groupedData[date].points.push({ lat, lon, name: placeName, img: imgUrl, desc: row[6] });
            }

            function showDate(date) {
                if (currentGpxLayer) map.removeLayer(currentGpxLayer);
                markers.forEach(m => map.removeLayer(m));
                markers = [];

                const dayData = groupedData[date];

                // GPX表示
                if (dayData.gpx) {
                    const gpxPath = `logs/${dayData.gpx.trim()}`;
                    currentGpxLayer = new L.GPX(gpxPath, {
                        async: true,
                        marker_options: { startIconUrl: '', endIconUrl: '', shadowUrl: '' },
                        polyline_options: { color: '#e91e63', weight: 4, opacity: 0.8 } // 軌跡をピンク系で見やすく
                    }).on('loaded', function(e) {
                        map.fitBounds(e.target.getBounds());
                    }).addTo(map);
                }

                // ピン表示
                dayData.points.forEach(p => {
                    if (p.lat && p.lon) {
                        const popupContent = `
                            <div>
                                <strong>${p.name}</strong><br>
                                <span style="font-size:12px">${p.desc || ""}</span><br>
                                ${p.img ? `<img src="${p.img}" class="popup-image">` : ""}
                            </div>
                        `;
                        const m = L.marker([p.lat, p.lon]).addTo(map).bindPopup(popupContent);
                        markers.push(m);
                    }
                });
            }
        } catch (e) {
            console.error("読み込み失敗:", e);
        }
    }

    loadArchive();
</script>
</body>
</html>
