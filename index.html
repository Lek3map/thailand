<!DOCTYPE html>
<html>
<head>
    <title>Thai Archive Test</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; font-family: "Meiryo", sans-serif; }
        #main-container { display: flex; height: 100vh; }
        #map { flex-grow: 1; height: 100%; }
        #sidebar { width: 300px; background: white; border-left: 2px solid #ddd; overflow-y: auto; padding: 15px; }
        .day-item { margin-bottom: 10px; padding: 8px; border: 1px solid #eee; border-radius: 4px; cursor: pointer; }
        .day-item:hover { background: #f0f0f0; }
        .popup-content img { width: 100%; }
    </style>
</head>
<body>

<div id="main-container">
    <div id="map"></div>
    <div id="sidebar">
        <h3 style="border-bottom:2px solid #2c3e50;">旅の目次</h3>
        <div id="status" style="font-size:12px; color:orange;">データ読み込み中...</div>
        <div id="day-list"></div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.7.0/gpx.min.js"></script>

<script>
    const map = L.map('map').setView([13.75, 100.5], 6);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    const dayGroups = {};

    // 旗のアイコン定義（SVG）
    const flagIcon = (color) => L.divIcon({
        html: `<svg width="30" height="30" viewBox="0 0 24 24"><path d="M5 21V4s2-1 5-1 3 2 6 2 5-1 5-1v8s-2 1-5 1-3-2-6-2-5 1-5 1" fill="${color}" stroke="black"/></svg>`,
        iconSize: [30, 30], iconAnchor: [5, 28]
    });

    // 自動読み込み開始
    window.onload = function() {
        fetch('data.xlsx')
            .then(res => res.arrayBuffer())
            .then(buffer => {
                const workbook = XLSX.read(new Uint8Array(buffer), {type: 'array'});
                const rows = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
                
                rows.forEach(row => {
                    let dateKey = row.Date;
                    if (typeof dateKey === 'number') {
                        const d = new Date(Math.round((dateKey - 25569) * 86400 * 1000));
                        dateKey = d.toISOString().split('T')[0];
                    }
                    if (!dateKey) return;

                    // 目次作成
                    if (!dayGroups[dateKey]) {
                        dayGroups[dateKey] = L.layerGroup().addTo(map);
                        createListItem(dateKey, row);
                        // ついでにGPXも自動読み込み
                        loadGPX(dateKey);
                    }

                    // ピン作成
                    if (row.Lat && row.Lon) {
                        const img = row.Image ? `<img src="${row.Image}">` : '';
                        L.marker([row.Lat, row.Lon]).bindPopup(`<b>${row.Name || ''}</b><br>${row.des || ''}${img}`).addTo(dayGroups[dateKey]);
                    }
                });
                document.getElementById('status').innerText = "読み込み完了";
            }).catch(err => {
                document.getElementById('status').innerText = "エラー: data.xlsxが見つかりません";
            });
    };

    function loadGPX(dateKey) {
        const gpxPath = `logs/${dateKey}.gpx`;
        new L.GPX(gpxPath, {
            async: true,
            spawnMarker: false
        }).on('loaded', function(e) {
            const g = e.target;
            g.getLayers().forEach(l => { if(l instanceof L.Polyline) l.setStyle({color:'blue', weight:4}).addTo(dayGroups[dateKey]); });
            // 旗を立てる
            L.marker(g.get_start_loc(), {icon: flagIcon('#2ecc71')}).addTo(dayGroups[dateKey]);
            L.marker(g.get_end_loc(), {icon: flagIcon('#e74c3c')}).addTo(dayGroups[dateKey]);
        }).addTo(map);
    }

    function createListItem(dateKey, row) {
        const list = document.getElementById('day-list');
        const div = document.createElement('div');
        div.className = 'day-item';
        div.innerHTML = `<strong>${dateKey}</strong><br><small>${row.Pref || ''}</small>`;
        div.onclick = () => {
            const layers = dayGroups[dateKey].getLayers();
            if(layers.length > 0) map.fitBounds(L.featureGroup(layers).getBounds());
        };
        list.appendChild(div);
    }
</script>
</body>
</html>
