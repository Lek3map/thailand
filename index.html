<!DOCTYPE html>
<html>
<head>
    <title>Archive Test</title>
    <meta charset="utf-8" />
    <style>
        body { font-family: sans-serif; padding: 20px; }
        #status { padding: 10px; background: #eee; border-radius: 5px; margin-bottom: 10px; }
        .sidebar { width: 200px; border: 1px solid #ccc; padding: 10px; }
        .date-item { cursor: pointer; color: blue; text-decoration: underline; margin-bottom: 5px; }
    </style>
</head>
<body>

    <h2>アーカイブ表示テスト</h2>
    <div id="status">確認中...</div>
    
    <div class="sidebar">
        <h4>旅の目次（テスト）</h4>
        <div id="date-list">
            <div class="date-item">テスト：2025年1月10日</div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script>
        const status = document.getElementById('status');
        status.innerText = "プログラムは起動しました。Excelを探します...";

        async function testLoad() {
            try {
                const response = await fetch('data.xlsx');
                if (response.ok) {
                    status.style.background = "#d4edda";
                    status.innerText = "✅ data.xlsx が見つかりました！読み込みます...";
                    
                    const arrayBuffer = await response.arrayBuffer();
                    const data = new Uint8Array(arrayBuffer);
                    const workbook = XLSX.read(data, {type: 'array'});
                    status.innerText += " -> 変換成功！";
                } else {
                    status.style.background = "#f8d7da";
                    status.innerText = "❌ data.xlsx が見つかりません（404エラー）。ファイル名や場所を確認してください。";
                }
            } catch (e) {
                status.style.background = "#fff3cd";
                status.innerText = "⚠️ エラー発生: " + e.message;
            }
        }
        testLoad();
    </script>
</body>
</html>
