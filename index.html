<!DOCTYPE html>
<html>
<head>
    <title>Thailand Travel Archive</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.7.0/gpx.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { margin: 0; }
        #map { height: 100vh; width: 100%; background: #eee; }
        .sidebar { position: absolute; top: 10px; right: 10px; z-index: 1000; background: white; padding: 10px; max-height: 90vh; overflow-y: auto; width: 220px; border: 1px solid #333; font-family: sans-serif; }
        .date-item { padding: 8px; border-bottom: 1px solid #eee; font-size: 15px; cursor: pointer; display: flex; align-items: center; }
        .date-item input { margin-right: 10px; width: 18px; height: 18px; }
    </style>
</head>
<body>

<div id="map"></div>
<div class="sidebar">
    <div style="font-weight:bold; margin-bottom:10px; border-bottom:2px solid #007bff;">旅の目次</div>
    <div id="date-list"></div>
</div>

<script>
    const map = L.map('map').setView([15.0, 102.0], 6);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    const activeLayers = {}; 

    function formatExcelDate(val) {
        if (!val) return "";
        if (typeof val === 'number') {
            const d = new Date(Math.round((val - 25569) * 86400 * 1000));
            return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`;
        }
        return String(val).trim();
    }

    async function load() {
        try {
            const res = await fetch('data.xlsx');
            const ab = await res.arrayBuffer();
            const wb = XLSX.read(new Uint8Array(ab), {type: 'array'});
            const data = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]); 

            const dateList = document.getElementById('date-list');
            const grouped = {};

            data.forEach(row => {
                const date = formatExcelDate(row["日付"] || row["Date"] || "");
                const lat = parseFloat(row["緯度"] || row["Lat"] || 0);
                const lon = parseFloat(row["経度"] || row["Lon"] || 0);
                // GPXファイル名の取得
                const gpx = row["GPX"] || row["GPXファイル名"] || "";
                
                if (!date || isNaN(lat) || lat === 0) return;

                if (!grouped[date]) grouped[date] = { points: [], gpx: gpx };
                grouped[date].points.push({ 
                    lat, lon, 
                    name: row["地点名"] || row["Name"] || "地点", 
                    desc: row["備考"] || row["Note"] || "", 
                    img: row["画像"] || row["Image"] || "" 
                });
            });

            Object.keys(grouped).sort().reverse().forEach(date => {
                const div = document.createElement('div');
                div.className = 'date-item';
                div.innerHTML = `<input type="checkbox"> ${date}`;
                
                div.onclick = (e) => {
                    const chk = div.querySelector('input');
                    if (e.target !== chk) chk.checked = !chk.checked;

                    if (chk.checked) {
                        const group = L.layerGroup().addTo(map);
                        activeLayers[date] = group;

                        // 【最重要】GPXの読み込み
                        if (grouped[date].gpx) {
                            // logs/ をつけず、Excelに書かれた文字をそのままURLとして使う
                            const gpxUrl = String(grouped[date].gpx).trim();
                            console.log("読み込み開始:", gpxUrl);

                            new L.GPX(gpxUrl, {
                                async: true,
                                marker_options: { startIconUrl: '', endIconUrl: '' },
                                polyline_options: { color: 'orange', weight: 6, opacity: 0.9 }
                            }).on('loaded', e => {
                                map.fitBounds(e.target.getBounds());
                            }).on('error', e => {
                                console.error("読み込めませんでした:", gpxUrl);
                            }).addTo(group);
                        }

                        grouped[date].points.forEach(p => {
                            const html = `<b>${p.name}</b><br>${p.desc}${p.img ? `<br><img src="${p.img}" style="width:200px">` : ""}`;
                            L.marker([p.lat, p.lon]).bindPopup(html).addTo(group);
                        });
                    } else {
                        if (activeLayers[date]) { map.removeLayer(activeLayers[date]); delete activeLayers[date]; }
                    }
                };
                dateList.appendChild(div);
            });
        } catch (e) { console.error(e); }
    }
    load();
</script>
</body>
</html>
