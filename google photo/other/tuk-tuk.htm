<!DOCTYPE html>
<html lang="ja">

<head>
<!-- 文字コード。元はshift_jisでしたが、今回はUTF-8で保存し直したので合わせています -->
<meta charset="utf-8">
<meta http-equiv="Content-Language" content="ja">
<link rel="shortcut icon" href="../../images/kamon.gif">
<title>流れる画像テンプレート</title>

<!-- リンクを新しいタブで開く設定(全部のaタグに効く) -->
<base target="_blank">

<style>

  .rounded-photo {
  border-radius: 10px; /* 数字が大きいほど丸くなります */
	}


/* ▼ アニメーションの中身:左端(0)から、自分の幅ぶん左(-100%)まで動かす */
@keyframes infinity-scroll-left {
  from { transform: translateX(0); }
  to   { transform: translateX(-100%); }
}

/* ▼ 画像の列を並べる外枠。はみ出した部分は隠す */
.scroll-infinity__wrap {
  display: flex;
  overflow: hidden;
}

/* ▼ 画像の列(ul)。横一列に並べ、リストの点を消す */
.scroll-infinity__list {
  display: flex;
  list-style: none;
  padding: 0;
}

/* ▼ 左へ流れるアニメーションを設定(10秒で1周、等速、ずっと繰り返す================= ) */
.scroll-infinity__list--left {
  animation: infinity-scroll-left 113s infinite linear 0.2s both;
}

/* ▼ 下の2つは、今のHTMLでは使われていないクラス用の設定(そのまま残しています) */
.scroll-infinity__item {
  width: calc(100vw / 6);
}
.scroll-infinity__item > img {
  width: 100%;
}

/* ▼ マウスを乗せている間はアニメーションを一時停止 */
.scroll-infinity__wrap:hover .scroll-infinity__list--left {
  animation-play-state: paused;
}

</style>
</head>

<script>
  // ▼ 開始位置をランダムにする処理 ========================================

  // 0〜10秒の間でランダムな数を作り、マイナスにする。
  // (10 はCSSのアニメーション時間 10s と同じ数字。CSSの秒数を変えたらここも合わせる)
  // animation-delay がマイナスだと「その秒数ぶん進んだ状態」から始まる。
  var offset = -(Math.random() * 113);

  // 流れる2本の画像列(ul)を全部探して、同じ値を設定する。
  // 2本の値がずれると継ぎ目に隙間ができるので、必ず同じ値にする。
  document.querySelectorAll('.scroll-infinity__list--left').forEach(function (el) {
    el.style.animationDelay = offset + 's';
  });
</script>
