        // 2. 今日の日付から「年＋月＋日」の数字を作る（例: 20261103）
        const today = new Date();
        const dateNum = (today.getFullYear() * 10000) + ((today.getMonth() + 1) * 100) + today.getDate();

        // 3. 日付の数字をデータの件数で割った「余り」をインデックスにする
        const itemIndex = dateNum % items.length;

        // 4. 選ばれた画像とリンク先をセット
        const selectedItem = items[itemIndex];
        document.getElementById("myImage").src = selectedItem.imgUrl;
        document.getElementById("myLink").href = selectedItem.linkUrl;
