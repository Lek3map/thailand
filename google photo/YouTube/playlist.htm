<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube再生リスト</title>
<style>
  :root {
    --bg: #FBF4E6;
    --text: #1c1c1e;
    --muted: #6b6b70;
    --thumb-bg: #e4e4e7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", Meiryo, sans-serif;
  }

  /* スマホで2列、広い画面では3列 */
  .video-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px 6px;
    padding: 6px;
    max-width: 900px;
    margin: 0 auto;
  }
  @media (min-width: 700px) {
    .video-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }

  .video-item {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  /* サムネイルの上中央のタイトル */
  .video-title {
    width: 100%;
    margin: 0 0 4px;
    text-align: center;
    font-size: 13px;
    font-weight: 600;
    line-height: 1.35;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .thumb {
    all: unset;
    display: block;
    position: relative;
    width: 100%;
    cursor: pointer;
    border-radius: 8px;
    overflow: hidden;
  }
  .thumb:focus-visible { outline: 3px solid #3b82f6; outline-offset: 3px; }
  .thumb img {
    display: block;
    width: 100%;
    aspect-ratio: 16 / 9;
    object-fit: cover;
    background: var(--thumb-bg);
  }
  /* 画像自体に黒い帯が入っている古い動画用（zoom: true） */
  .thumb img.zoom { transform: scale(1.34); }
  /* サムネイル未指定のときの代わり */
  .thumb .placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: var(--thumb-bg);
    color: var(--muted);
    font-size: 28px;
  }
  /* 「再生リスト」であることを示すバッジ */
  .badge {
    position: absolute;
    right: 0;
    bottom: 0;
    padding: 2px 8px;
    background: rgba(0, 0, 0, 0.75);
    color: #fff;
    font-size: 11px;
    line-height: 1.5;
    border-top-left-radius: 8px;
  }
  /* サムネイルの下中央の地球アイコン（Googleマップへのリンク） */
  .video-foot {
    height: 26px;
    margin-top: 2px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .map-link {
    display: block;
    width: 22px;
    height: 22px;
  }
  .map-link img { width: 100%; height: 100%; display: block; }
  .map-link:focus-visible { outline: 3px solid #3b82f6; border-radius: 50%; }

  /* ポップアップ */
  .modal {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.85);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
  }
  .modal.open { display: flex; }
  .modal-content {
    position: relative;
    width: 92%;
    max-width: 640px;
  }
  .player {
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
  }
  .player iframe { width: 100%; height: 100%; border: 0; display: block; }
  .modal-title {
    color: #fff;
    font-size: 14px;
    margin: 10px 0 0;
  }
  .close-btn {
    position: absolute;
    top: -44px;
    right: 0;
    background: none;
    border: 0;
    color: #fff;
    font-size: 16px;
    padding: 8px 4px;
    cursor: pointer;
  }
</style>
<meta content="text/html; charset=utf-8" http-equiv="Content-Type">
</head>
<body>

<div class="video-grid" id="grid"></div>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="再生リストプレーヤー">
  <div class="modal-content">
    <button class="close-btn" id="close" type="button">✕ 閉じる</button>
    <div class="player" id="player"></div>
    <p class="modal-title" id="modalTitle"></p>
  </div>
</div>

<script>
  /* ===== ここだけ編集してください =====
     title : 再生リストのタイトル
     list  : 再生リストID（URLの list= のあとの文字列。PL… などで始まる）
     thumb : サムネイルに使う動画ID（再生リスト内の動画のID。省略すると灰色の枠になります）
     gps   : 場所があるときだけ "緯度,経度"（なければ書かない → アイコンも出ません）
     zoom  : サムネイル自体に黒い帯が入っている古い動画だけ true（黒帯を切って拡大）
     増やすときは { title: "...", list: "...", thumb: "...", gps: "...", zoom: true }, の行をコピーして追加します。 */
  const playlists = [

    { title: "อีสานบ้านเฮา", list: "PLjCnRsJUlVz_DdGhrGUJJql2mGHA94rVq", thumb: "y3ETogI_03Q",},
    { title: "乗り物", list: "PLjCnRsJUlVz-WZyela1dPTMgVvlwCzVPA", thumb: "0hN8KfrIwYY",},
    { title: "祭りやイベント", list: "PLjCnRsJUlVz9PxH9SGp5eCgUFN-EAQKpH", thumb: "WEkqEoC8XT8",},
    { title: "タイ寺院等", list: "PLjCnRsJUlVz9iekGpKvqhI2ImmSwuijmt", thumb: "28FccDxOhy8",},
    { title: "タイその他", list: "PLjCnRsJUlVz_T2wDyQjttQaBDbeE9-oe7", thumb: "4OWI7rJ3g0U",},
    { title: "地獄寺", list: "PLjCnRsJUlVz9o2kPUg2LuY3w3p45TAsap", thumb: "RpkEAtcBUpY",},

  ];
  /* ================================== */

  const grid = document.getElementById("grid");
  const modal = document.getElementById("modal");
  const player = document.getElementById("player");
  const modalTitle = document.getElementById("modalTitle");
  let lastFocused = null;

  // 1件もgpsがないページでは、アイコン用の余白を作らない
  const hasGps = playlists.some((v) => v.gps);

  playlists.forEach((v) => {
    const item = document.createElement("div");
    item.className = "video-item";

    // 上：タイトル
    const title = document.createElement("p");
    title.className = "video-title";
    title.textContent = v.title;

    // 中：サムネイル（タップで再生リスト）
    const btn = document.createElement("button");
    btn.className = "thumb";
    btn.type = "button";
    btn.setAttribute("aria-label", v.title + "を再生");
    if (v.thumb) {
      const img = document.createElement("img");
      img.src = "https://img.youtube.com/vi/" + v.thumb + "/hqdefault.jpg";
      img.alt = "";
      img.loading = "lazy";
      if (v.zoom) img.classList.add("zoom");
      btn.appendChild(img);
    } else {
      const ph = document.createElement("div");
      ph.className = "placeholder";
      ph.textContent = "▶";
      btn.appendChild(ph);
    }
    const badge = document.createElement("span");
    badge.className = "badge";
    badge.textContent = "☰ 再生リスト";
    btn.appendChild(badge);
    btn.addEventListener("click", () => openModal(v, btn));

    // 下：地球アイコン（gps があるときだけ）
    const foot = document.createElement("div");
    foot.className = "video-foot";
    if (v.gps) {
      const a = document.createElement("a");
      a.className = "map-link";
      a.href = "https://www.google.com/maps?q=" + encodeURIComponent(v.gps.replace(/\s/g, ""));
      a.target = "_blank";
      a.rel = "noopener";
      a.setAttribute("aria-label", v.title + "の場所をマップで開く");
      const icon = document.createElement("img");
      icon.src = "../icon/chikyu.png";
      icon.alt = "";
      a.appendChild(icon);
      foot.appendChild(a);
    }

    item.append(title, btn);
    if (hasGps) item.appendChild(foot);
    grid.appendChild(item);
  });

  function openModal(v, trigger) {
    lastFocused = trigger;
    modalTitle.textContent = v.title;
    // 開いたときにだけ iframe を作る → 閉じると確実に再生が止まる
    const iframe = document.createElement("iframe");
    iframe.src = "https://www.youtube.com/embed?listType=playlist&list=" + encodeURIComponent(v.list) + "&autoplay=1&rel=0&playsinline=1";
    iframe.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen";
    iframe.allowFullscreen = true;
    iframe.referrerPolicy = "strict-origin-when-cross-origin";
    iframe.title = v.title;
    player.replaceChildren(iframe);
    modal.classList.add("open");
    document.getElementById("close").focus();
  }

  function closeModal() {
    modal.classList.remove("open");
    player.replaceChildren(); // iframeを削除して再生を停止
    if (lastFocused) lastFocused.focus();
  }

  document.getElementById("close").addEventListener("click", closeModal);
  modal.addEventListener("click", (e) => { if (e.target === modal) closeModal(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });
</script>

</body>
</html>
